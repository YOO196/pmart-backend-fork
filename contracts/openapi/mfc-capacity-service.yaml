openapi: 3.1.0
info:
  title: mfc-capacity-service
  version: 0.26.0
  description: |
    MFC 작업 여력(CapacitySnapshot)·CapacityHold·작업자/장비/근무/자격·작업 배정(assignment_version)·OR-Tools 계획·수령창/수용량(ReceivingCapability)·하차면 예약·운영 제한의 정본. (docs/architecture/service-map.md §5, ADR-0008)
    비정본: 재고 R(mfc-inventory; CapacityHold와 독립), 고객 도착 슬롯(delivery-capacity), 작업 실행(mfc-fulfillment/inbound).
    CapacitySnapshot = 피킹·패킹대(기본 4·최대 8)·보관 공간·인력을 같은 수용 단위로 환산한 최소값.
    CapacityHold: HELD→CONFIRMED/RELEASED/EXPIRED. CONFIRMED 해제는 근거(reason) 필수.
    AssignmentPlan: PROPOSED→COMMITTED / NO_SOLUTION / STALE / RECOVERY_REQUIRED. 활성 담당 1명.
    조회 실패·미설정은 0/무제한이 아니라 CONFIG_REQUIRED/503.
    0.16.0(2026-11-17, 본사 승인 번호 실제 확인 — 요청 AP-1, 사용자 "운영 제한 해제는 항상 본사"): 운영 제한 해제는 approval-service 승인
      (MFC_OPERATION_RESTRICTION, OPERATOR_ADMIN) 번호를 해제 전 한 번 쓴다. 번호가 없으면 422 APPROVAL_REQUIRED + 변경 요청 본문.
    0.17.0(2026-11-17, 작업자 오늘 업무 내역 — 요청 F-7 R3·R4): `GET /mfcs/{mfcId}/workers/{workerId}/activities?date=` — 네 정본의 처리 내역을 모은다.
    0.18.0(2026-11-18, 센터 관리자 웹 목록 — 요청 MB-1): `GET /assignment-plans`(지난 추천, 최근 순).
    0.19.0(2026-11-18, mfc-app 요청 — 피킹한 사람이 그 주문 패킹, 사용자 결정 "피커만 받음"): 다음 작업 받기가 자기가 피킹한 출고 PACK 을 가장 먼저 주고, 다른 사람이 피킹한 PACK 은 주지 않는다(센터 관리자 배정으로만). 배정 추천도 그 PACK 은 빼고 계산. fulfillment 0.18.0 `pickedBy` 를 읽는다.
    0.20.0(2026-11-18, mfc-app 요청 B1~B3 — 사용자 결정): 센터 휴게 번호 `GET·PUT /mfcs/{mfcId}/break-pin`(4자리, 해시만 저장·응답 없음), 작업자 본인이 휴게를 켤 때 `supervisorPin` 필수(422 BREAK_PIN_INVALID·BREAK_PIN_LOCKED(5번 틀리면 15분)·BREAK_PIN_NOT_SET), 근무에 휴게 구간(`breakStartAt`·`breakEndAt`) → 그 시간에 자동 휴게(AUTO, 일찍 끝내기는 센터 관리자만 — 409 AUTO_BREAK_SUPERVISOR_ONLY). WorkerBreak `source`·`shiftId`·`plannedEndAt`.
    0.21.0(2026-11-18, mfc-backoffice "내 정보" — 사용자 결정): 센터 직원 연락처 `GET /mfcs/{mfcId}/staff-contacts`(모든 운영자·라이더 — 연락 수단 표시만), `GET·PUT /mfcs/{mfcId}/staff-contacts/me`(그 센터 운영자 본인 — 이름·휴대폰·이메일, X-Expected-Version). 로그인·알림 발송에는 쓰지 않는다.
    0.22.0(2026-11-19, 센터 관리자 "작업 시작" — 사용자 결정): `POST /assignment-plans` 본문 `commit: true` 면 계산한 추천을 바로 확정(배정)한다 — 확정 사이에 작업이 바뀌어 STALE 이면 한 번 다시 계산해 확정, 그래도 안 되면 그 결과(STALE). 추천만 보는 화면을 따로 두지 않고, 바꿀 것은 수동 배정 `POST /assignments` 로.
    0.23.0(2026-11-19, ADR-0070 화면 번호 — 직원 = 이름 · 사번): 작업자 응답 `name`·`employeeNo`, 센터 화면용 `GET /mfcs/{mfcId}/staff-names?operatorIds=`(운영자 ID 여러 개 → 이름·사번 — 처리자·결정자 칸의 OP-… 대신). 이름은 hr-service 내부 조회, 사번은 인사 사본.
    0.24.0(2026-11-20, PDA BR-52 R2·R12~R14 — 요청 MC-1): 작업 유형 `CYCLE_COUNT`(재고 실사 — mfc-inventory 계획 실사, taskId = sessionId)·`RETURN_RECEIPT`(회수품 반입 — mfc-inbound 반납 도착 대기, taskId = arrivalId)·
      `RETURN_INSPECT`(회수품 검수 — mfc-inbound 검수 대기 반입, taskId = returnReceiptId). 업무 STOCK_COUNT = CYCLE_COUNT, INSPECTION 에 RETURN_INSPECT, STOCK_MOVE 에 RETURN_RECEIPT.
      다음 작업 받기가 셋을 같은 업무의 기존 유형 뒤에 준다(임시 순서). 상세 `locationCodes`(실사 칸), 상세 줄 `sku` 는 반납 대기 줄에서 null 일 수 있다.
    0.25.0(2026-11-20, PDA BR-52 R2·BR-53 R9 — mfc-inbound 입고 예정 0.16.0 위): 다음 작업 받기가 **입고(RECEIVE, 업무 INBOUND, taskId = trfId)** 를 준다 —
      mfc-inbound `GET /inbound-promises?mfcId=`(끝나지 않은 EXPECTED·RECEIVING) 중 출발(TOUT `departureId`)을 받았고, EXPECTED 이거나 RECEIVING 이면서 재고 반영 전 수령이 없는 것.
      순서는 자동 보충·긴급 이동 뒤·품질검사 앞(임시), 같은 유형은 예정 도착 이른 순. 상세 = 예정 줄(상품·상품명·CDC LOT·소비기한·남은 양). 새 경로·필드 없음.
    0.26.0(2026-11-20, 사용자 결정 — 요청 MC-2·mfc-inbound 0.17.0): ① **격리 이동(QUARANTINE_MOVE)** — mfc-inbound 가 만들 때 담당(검수자·반입자·현장 예외 보고자)을 정한 입고 작업.
      그 담당이 다음 작업 받기를 부르면 들고 있는 작업이 없을 때 **다른 어떤 새 작업보다 먼저, 고른 업무와 상관없이** 준다(다른 사람에게는 주지 않음). 응답 `taskType: QUARANTINE_MOVE`, 상세 = 입고 작업 한 줄(출발 칸, 남은 양 = 계획 − 완료 − 현장 예외분).
      ② **입고(RECEIVE)는 도착한 것만** — 도착 등록된 RECEIVING(출발 받음·재고 반영 전 수령 없음)만 준다. 출발만 하고 도착 전인 EXPECTED 는 더는 주지 않는다. 새 경로·필드 없음.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: capacity, description: 여력 스냅샷·CapacityHold (orchestration) }
  - { name: workers, description: '작업자·업무(작업 유형·온도대 자격)·근무 (WK-02 입력, 0.4.0)' }
  - { name: receiving, description: 수령창·수용량·하차면 (SCM/TMS) }
  - { name: assignments, description: 작업 배정·OR-Tools 계획 }
  - { name: restrictions, description: 운영 제한 (접수 중지·용량 축소) }
  - { name: work-activities, description: '작업자 처리 내역 — 오늘 업무 내역 (F-7, 0.17.0)' }

paths:
  /internal/capacity-snapshots:
    get:
      tags: [capacity]
      summary: '[orchestration/delivery-capacity→capacity] 여력 스냅샷 (시간창별 환산 최소값·점유)'
      operationId: getCapacitySnapshot
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: window, in: query, required: true, schema: { type: string, description: 'ISO-8601 interval 예 2026-10-23T13:00:00Z/2026-10-23T14:00:00Z. Asia/Seoul 정시에 시작하는 1시간 창만' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacitySnapshot' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/capacity-holds:
    post:
      tags: [capacity]
      summary: '[orchestration→capacity] HoldCapacity — 결제 전 작업 여력 확보 (S1)'
      description: |
        수용 단위 부족 시 CAPACITY_EXCEEDED. 재고가 충분해도 여력 없으면 접수 실패(IV-05). TTL 기본 10분.
        window 는 Asia/Seoul 정시에 시작하는 1시간 창만(아니면 400). 점유는 (mfcId, window) 단위로 센다.
        [시험 정책 2026-10-30] 주문 1건 = 수용 단위 1. 1시간 창당 수용 단위는 정책값(미설정 → 422 CONFIG_REQUIRED). demand 는 검증만 하고 환산에 쓰지 않는다.
        orderId 당 활성(HELD/CONFIRMED) Hold 는 1개 — 이미 있으면 409 HOLD_ALREADY_ACTIVE.
        S4 예약 시간 변경(2026-11-16): `replacesHoldId` = 같은 주문·센터의 **확정** Hold → 다른 창의 새 HELD(두 창 모두 단위를 잡는다). 확정이 아니면 409 INVALID_STATE,
        같은 창이면 422 SAME_WINDOW, 진행 중인 교체가 있으면 409 HOLD_ALREADY_ACTIVE. 새 Hold 를 확정하면 같은 트랜잭션에서 기존 Hold 가 RELEASED(reason RESCHEDULED),
        새 Hold 가 만료·해제되면 기존은 그대로.
        업무 거절(422)은 멱등 기록에 남지 않으므로 같은 키 재전송은 다시 판정한다.
      operationId: holdCapacity
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, mfcId, window, demand]
              properties:
                orderId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                window: { type: string, description: ISO-8601 interval }
                ttlMinutes: { type: integer, minimum: 1, maximum: 60, default: 10 }
                demand: { $ref: '#/components/schemas/CapacityDemand' }
                replacesHoldId: { type: string, description: 'S4 — 교체할 기존 확정 Hold(2026-11-16)' }
      responses:
        '201':
          description: HELD (resultId = holdId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: HOLD_ALREADY_ACTIVE (같은 orderId 의 활성 Hold) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: CAPACITY_EXCEEDED / CONFIG_REQUIRED / OPERATION_RESTRICTED (접수 중지)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/capacity-holds/{holdId}:
    get:
      tags: [capacity]
      summary: CapacityHold 조회
      operationId: getCapacityHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityHold' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/capacity-holds/{holdId}/confirmations:
    post:
      tags: [capacity]
      summary: '[orchestration→capacity] Hold 확정 (HELD→CONFIRMED)'
      description: 이미 CONFIRMED 면 그대로 성공(멱등). 만료 시각이 지난 HELD 는 정리 전이라도 EXPIRED 로 보고 409 INVALID_STATE.
      operationId: confirmCapacityHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400':
          description: VALIDATION_FAILED (orderId 가 Hold 의 주문과 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (EXPIRED/RELEASED) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/capacity-holds/{holdId}/releases:
    post:
      tags: [capacity]
      summary: '[orchestration→capacity] Hold 해제 (CONFIRMED 해제는 reason 필수)'
      description: HELD/CONFIRMED → RELEASED(수용 단위 반환). 이미 RELEASED/EXPIRED 면 그대로 성공(멱등, 상태 불변).
      operationId: releaseCapacityHold
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [SAGA_COMPENSATION, ORDER_CANCELLED, SHORTAGE, RESCHEDULED, OPERATOR], description: CONFIRMED 상태 해제 시 필수 }
                sourceRef: { type: string, description: sagaId / stopRequestId / approvalRef }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400':
          description: VALIDATION_FAILED (CONFIRMED 해제에 reason 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/receiving-capabilities:
    get:
      tags: [receiving]
      summary: '[SCM/TMS→capacity] 수령창·수용량 조회 (일자별 창·1회 입고 상한·잔여)'
      operationId: getReceivingCapabilities
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, required: true, schema: { type: string, format: date, description: Asia/Seoul } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfcId: { type: string }
                  date: { type: string, format: date }
                  version: { $ref: '_common.yaml#/components/schemas/Version' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  windows: { type: array, items: { $ref: '#/components/schemas/ReceivingWindow' } }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/unloading-bay-reservations:
    post:
      tags: [receiving]
      summary: '[TMS→capacity] 하차면 예약 (수령창 내, 1회 입고 상한 검증)'
      operationId: reserveUnloadingBay
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, tripId, window, loadUnits]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                tripId: { type: string }
                trfIds: { type: array, items: { type: string } }
                window: { type: string, description: ISO-8601 interval }
                vehicleType: { type: string }
                loadUnits: { type: integer, minimum: 1, description: 박스/팔레트 환산 단위 }
      responses:
        '201':
          description: 예약 (resultId = bayReservationId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CAPACITY_EXCEEDED (1회 입고 상한·창 외) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/unloading-bay-reservations/{bayReservationId}:
    get:
      tags: [receiving]
      summary: 하차면 예약 조회
      operationId: getUnloadingBayReservation
      parameters:
        - { name: bayReservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bayReservationId: { type: string }
                  mfcId: { type: string }
                  tripId: { type: string }
                  bayCode: { type: string }
                  window: { type: string }
                  state: { type: string, enum: [RESERVED, ARRIVED, COMPLETED, CANCELLED] }
                  version: { type: integer }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    delete:
      tags: [receiving]
      summary: 하차면 예약 취소
      operationId: cancelUnloadingBayReservation
      parameters:
        - { name: bayReservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /assignments:
    get:
      tags: [assignments]
      summary: 작업 배정 조회 (fulfillment·점원 단말; 활성 담당 1명, assignment_version)
      description: |
        그 센터 운영자 또는 서비스 토큰. 기본은 ACTIVE 만(작업마다 최대 1건). taskId 로 한 작업의 현재 담당을, workerId 로 한 작업자의 담당 작업을 본다.
        date 는 배정 시각(Asia/Seoul) 날짜로 거른다(0.2.0 부터 선택).
      operationId: listAssignments
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: workerId, in: query, schema: { type: string } }
        - { name: taskId, in: query, schema: { type: string } }
        - name: state
          in: query
          description: 생략 시 ACTIVE
          schema: { type: string, enum: [ACTIVE, SUPERSEDED, RELEASED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [assignments]
      summary: 수동 배정·재배정 (WK-02·WK-05 — Q-08 결정 전에는 권한자 수동 지정만)
      description: |
        2026-11-07(슬라이스 6b). 그 센터의 `MFC_SUPERVISOR` 운영자만. 작업에 활성 담당을 한 명 정한다 — 이미 담당이 있으면 그 배정은 SUPERSEDED,
        assignmentVersion 은 작업마다 1부터 1씩 는다. X-Expected-Version = 지금 활성 assignmentVersion(담당이 없으면 0) — 다르면 409 VERSION_CONFLICT.
        같은 작업자에게 다시 지정하면 바꾸지 않고 현재 배정을 돌려준다(200).
        작업 상태(시작 가능 여부)는 mfc-fulfillment 가 시작 때 판정한다.
        WK-02 강제 제약(0.4.0): 작업자가 이 센터에 등록돼 있어야(422 WORKER_NOT_REGISTERED), ACTIVE(422 WORKER_NOT_ACTIVE), 지금 업무에 taskType 이 있어야(422 DUTY_NOT_ALLOWED),
        temperatureZone 을 주면 그 온도대 자격이 있어야(422 ZONE_NOT_QUALIFIED). 근무 밖이면 막지 않고 warnings 에 OFF_SHIFT(Q-09 미결 — 근무 미등록 작업자는 센터 직원 근무 시간표 STAFF 기준, 0.9.3, 시간표를 못 읽으면 경고 없이). 장비는 아직 없다.
        바뀌면 같은 트랜잭션에서 AssignmentPublished(planId null, planVersion = assignmentVersion, 항목 1개, 토픽 mfc.capacity.v1).
      operationId: assignTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignTaskRequest' }
      responses:
        '200':
          description: 이미 그 작업자가 담당(변화 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '201':
          description: 배정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /assignment-plans:
    get:
      tags: [assignments]
      summary: '배정 추천 목록 — 지난 추천 (0.18.0, MB-1)'
      description: |
        센터 관리자 웹 배정 > 지난 추천. 그 센터 운영자(단건과 같다). `date`(만든 날 Asia/Seoul, 선택)·`state` 반복(비우면 전부). 최근 순, 커서 = 마지막 planId,
        size ≤ 200. 항목은 단건과 같다.
      operationId: listAssignmentPlans
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [PROPOSED, COMMITTED, NO_SOLUTION, STALE, UNDETERMINED, INVALID] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AssignmentPlan' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [assignments]
      summary: 배정 추천 계산 (WK-09 — OR-Tools CP-SAT, 0.5.0)
      description: |
        2026-11-08. 그 센터 MFC_SUPERVISOR. 지금부터 horizonMinutes 안에서 READY 작업을 ACTIVE 작업자에게 나누는 **추천(PROPOSED)** 을 만든다 — 배정은 바뀌지 않는다
        (확정은 POST /assignment-plans/{planId}/commits, WK-10). 자동 확정(Q-08)은 아직 없다.
        입력(서버가 모음): mfc-fulfillment READY 작업(+ ASSIGNED·IN_PROGRESS 작업은 그 담당의 앞 점유), 이 서비스의 ACTIVE 작업자·지금 업무·근무.
        작업 시간은 설정 `pmart.capacity.plan.task-minutes.<유형>`(없으면 그 작업만 미배정 CONFIG_REQUIRED, 하나도 없으면 422 CONFIG_REQUIRED).
        강제 제약: 작업마다 배정 하나 또는 미배정, 업무에 그 유형이 있는 작업자만, 작업자 시간 겹침 금지, 근무를 등록한 작업자는 근무 안에서만(0.9.3 — 등록이 없으면 센터 직원 근무 시간표 STAFF 안에서만, 없으면 422 CONFIG_REQUIRED), 동시 PACK ≤ 패킹대 수(`plan.packing-stations`).
        목적(Q-08 전 임시 가중치): 미배정 수 → 약속 준비 시각(promisedReadyAt) 지연 분 → 작업자별 최대 부하 → 시작 시각 합 순.
        (0.9.2) 이동·보충도 넣는다 — mfc-inbound 열린 이동 지시 중 담당 없음·아직 안 집음은 후보, 담당 있는 진행 중 이동은 그 담당의 앞 점유. 확정하면 이동 지시도 배정(AssignmentPublished → inbound 담당 투영).
        같은 미배정 개수면 정해진 순서(주문 작업 → 자동 보충·긴급 이동 → 센터 관리자 이동 → 취소품 복귀)의 앞선 유형을 넣는다(미배정 벌점에 작게 더함). 이동 조회가 안 되면 이동 없이 계산하고 limitations 에 MOVES_NOT_INCLUDED.
        계산은 시간 제한(`plan.time-limit`) 안에서. OPTIMAL·FEASIBLE = PROPOSED, (0.9.4) UNKNOWN = UNDETERMINED·MODEL_INVALID = INVALID·INFEASIBLE = NO_SOLUTION(모두 수동 배정으로).
        (0.9.4) 엔진에는 규칙 기반 첫 해(정해진 앞섬 → 약속 순, 근무·겹침·패킹대 지킴)를 힌트로 준다. 엔진이 시간 안에 해를 못 내면(UNKNOWN) 그 규칙 기반 해를 PROPOSED 로 내고
        limitations 에 RULE_BASED_FALLBACK(최적화 안 됨, solverStatus 는 UNKNOWN 그대로). 규칙으로도 하나도 못 넣으면 UNDETERMINED.
        (0.9.4) 진행 중 작업은 남은 수량 비율만큼만 담당을 막는다(진척을 모르면 유형 분 전체).
        (0.11.0, 사용자 결정 2026-11-09) 작업 시간 추정 — 설정 `plan.travel.*` 이 있으면:
        PICK·PACK 은 유형 분(PICK 7·PACK 4 — 문서 기준)을 **이번 계산의 같은 유형 평균**으로 두고 주문마다 (걷는 거리 ÷ 걷는 속도 + 줄·개수 처리 초)의 비율로
        늘이고 줄인다(0.5~2배). PICK 걷는 길 = 장바구니 보관 자리 → 후보 칸(냉장 → 냉동 → 상온 C~H, 가까운 칸부터) → 포장 위치.
        이동·보충은 장바구니 보관 자리 → 출발 칸 → 도착 칸, 복귀는 포장 위치 → 추천 칸 — 걷는 시간 + 처리 초로 직접(최소 1분).
        작업자별 속도 배율(speedFactor)로 그 작업자의 시간 = 추정 분 ÷ 배율. limitations TRAVEL_ESTIMATED(작업 사이 이동은 추정에 포함 안 함),
        추정을 못 한 작업이 있으면 TRAVEL_ESTIMATE_PARTIAL(그 작업은 유형 분).
      operationId: createAssignmentPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, horizonMinutes]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                horizonMinutes: { type: integer, minimum: 10, maximum: 480 }
                commit: { type: boolean, default: false, description: '(0.22.0, 사용자 결정 2026-11-19 "작업 시작") true 면 계산 결과가 PROPOSED 일 때 바로 확정(배정 + AssignmentPublished, 같은 키로 멱등). 확정 직전 STALE 이면 한 번 다시 계산·확정. 응답 state = COMMITTED·NO_SOLUTION·STALE', x-added-in: '2026-11-19' }
      responses:
        '201':
          description: 계산됨(PROPOSED 또는 NO_SOLUTION)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /assignment-plans/{planId}:
    get:
      tags: [assignments]
      summary: 배정 추천 조회 (0.5.0)
      description: 그 센터 운영자·서비스.
      operationId: getAssignmentPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /assignment-plans/{planId}/input:
    get:
      tags: [assignments]
      summary: 배정 추천 계산 입력 (0.12.0, 원문 WK-09 재현 저장)
      description: |
        2026-11-09. 그 계획을 계산할 때 엔진(OR-Tools CP-SAT)에 넘긴 문제 그대로 — 작업(분·약속까지 분·우선순위·버전), 작업자(할 수 있는 유형·속도 배율·막힌 구간),
        패킹대 수, 목적 가중치, 계산 시간 제한, 구간 시작 시각. 다시 계산(replay)은 아직 없다(사용자 결정).
        기간으로 지우지 않는다 — 저장 총량이 설정 `plan.input-max-bytes`(LAN 2GB)를 넘으면 오래된 것부터 지운다(확정 안 된 계획 먼저). 지워졌으면 404 INPUT_NOT_KEPT.
      operationId: getAssignmentPlanInput
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: string }
                  inputHash: { type: string, description: 입력 JSON 의 SHA-256 — 같으면 같은 입력 }
                  bytes: { type: integer }
                  createdAt: { type: string, format: date-time }
                  input: { type: object, additionalProperties: true }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /assignment-plans/{planId}/commits:
    post:
      tags: [assignments]
      summary: 배정 추천 확정 (WK-10 — 최신 상태 재검증 뒤 전부 또는 전무, 0.5.0)
      description: |
        그 센터 MFC_SUPERVISOR, PROPOSED 만. 항목마다 다시 확인: 작업이 아직 READY·같은 version(fulfillment), 그 작업에 활성 담당 없음, 작업자가 아직 적격·같은 업무 버전.
        하나라도 어긋나면 아무것도 배정하지 않고 계획을 STALE(staleReasons) 로 두고 409 PLAN_STALE — 다시 계산한다.
        모두 맞으면 한 트랜잭션에서 항목마다 배정(planId 기록, assignmentVersion +1) + AssignmentPublished(planId, planVersion = assignmentVersion), 계획 COMMITTED.
        이미 COMMITTED 면 지금 상태(200). 미배정 작업은 수동 배정으로.
      operationId: commitAssignmentPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 확정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /operation-restrictions:
    get:
      tags: [restrictions]
      summary: 운영 제한 조회 (활성·이력)
      operationId: listOperationRestrictions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: activeOnly, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OperationRestriction' } }
    post:
      tags: [restrictions]
      summary: 운영 제한 적용 (INTAKE_STOP / CAPACITY_REDUCE, approvalRef 필수, OperationRestrictionApplied)
      description: |
        CAPACITY_REDUCE 는 기존 약속을 삭제하지 않고 영향 주문 목록을 CapacityReduced 로 발행한다. delivery-capacity 정원의 입력이지 자동 변경이 아니다.
        구현(0.3.0, 2026-11-08, BO-08): 그 센터 MFC_SUPERVISOR. approvalRef 필수(422 APPROVAL_REQUIRED — BO-08 승인 ID, 존재 확인 없이 기록).
        범위 = 슬롯 창(1시간)이 [effectiveFrom, effectiveTo) 와 겹치는 것(effectiveTo 없음 = 끝 없음). **시간이 지나도 자동 해제하지 않는다** — 해제(DELETE)로만.
        INTAKE_STOP: 범위 창의 신규 Hold 422 OPERATION_RESTRICTED(기존 Hold·확정은 그대로) + OperationRestrictionApplied.
        CAPACITY_REDUCE: reducedCapacityUnits 필수, 범위 창의 수용 단위 = min(설정값, 활성 축소들) — 신규 Hold 판정·스냅샷에 반영. 지금 활성 점유가 새 수용 단위를
        넘는 창마다 CapacityReduced(그 창의 활성 주문 = affectedOrders, 기존 약속 유지). 제한이 여럿이면 모두 적용(하나 해제돼도 나머지 유지).
      operationId: applyOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, restrictionType, approvalRef, effectiveFrom]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                restrictionType: { type: string, enum: [INTAKE_STOP, CAPACITY_REDUCE] }
                approvalRef: { type: string, description: approval-service approvalId (BO-08) }
                reason: { type: string, maxLength: 500 }
                effectiveFrom: { type: string, format: date-time }
                effectiveTo: { type: [string, 'null'], format: date-time }
                reducedCapacityUnits: { type: integer, minimum: 0, description: CAPACITY_REDUCE 시 축소 후 수용 단위 }
      responses:
        '201':
          description: 적용 (resultId = restrictionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (승인 참조 없음·불일치)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /operation-restrictions/{restrictionId}:
    get:
      tags: [restrictions]
      summary: 운영 제한 조회
      operationId: getOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: restrictionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationRestriction' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    delete:
      tags: [restrictions]
      summary: 운영 제한 해제·재개 (본사 승인 번호, OperationRestrictionLifted)
      description: |
        구현(0.3.0): 그 센터 MFC_SUPERVISOR, ACTIVE 만(이미 LIFTED 면 지금 상태 202). INTAKE_STOP 해제는 OperationRestrictionLifted. 다른 제한은 유지.
        (0.16.0, AP-1 — `pmart.approval-ref.mode: VERIFY`) 해제는 기준 없이 늘 본사 승인. approvalRef 가 없으면 422 APPROVAL_REQUIRED 이고 details
        `field=approvalRequest` 의 reason = approval-service `POST /change-requests` 본문 JSON(type MFC_OPERATION_RESTRICTION, targetRef
        `<mfcId>:RESTRICTION_LIFT:<restrictionId>`). 본사(OPERATOR_ADMIN) 승인 번호를 approvalRef 로 보내면 해제 전 한 번 쓴다(쓸 수 없으면 422 —
        details `field=approvalRef` reason = NOT_APPROVED·ALREADY_USED 등). `RECORD_ONLY`(LAN 시험)는 예전처럼 번호 필수·확인 없음.
      operationId: liftOperationRestriction
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: restrictionId, in: path, required: true, schema: { type: string } }
        - { name: approvalRef, in: query, required: false, schema: { type: string, maxLength: 64 }, description: '본사 승인 번호(approvalId) — 없으면 422 와 승인 요청 본문(0.16.0)' }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/workers:
    get:
      tags: [workers]
      summary: 센터 작업자 목록 (WK-02 입력 — 0.4.0)
      description: 그 센터 운영자 또는 서비스 토큰. 기본은 ACTIVE·SUSPENDED(LEFT 제외). 각 작업자의 지금 업무(dutyVersion 최신)를 같이 준다.
      operationId: listWorkers
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/WorkerState' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Worker' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [workers]
      summary: 작업자 등록 (그 센터 MFC_SUPERVISOR — 0.4.0)
      description: |
        2026-11-08. workerId = 로그인 계정(운영자 ID, 토큰 subject) — 등록 뒤 바꾸지 않는 열쇠. 업무(작업 유형·온도대 자격)는 계정이 아니라
        별도 업무 이력(dutyVersion 1부터)에 둔다 — 업무를 바꿔도 로그인 정보·계정은 그대로(사용자 결정 2026-11-08).
        같은 센터에 이미 있으면 409 WORKER_ALREADY_REGISTERED(LEFT 였다면 state-changes 로 다시 ACTIVE). 계정 존재 여부는 auth 를 부르지 않고 기록만.
      operationId: registerWorker
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, displayName, duty]
              properties:
                workerId: { type: string, minLength: 1, maxLength: 64 }
                displayName: { type: string, minLength: 1, maxLength: 60 }
                employmentType: { $ref: '#/components/schemas/EmploymentType' }
                qualification:
                  description: '(0.7.0) 자격 — 할 수 있는 일. 생략하면 정규직·알바 = duty 작업 유형, 일일크루 = PICK·PACK(사용자 결정). duty 는 자격 안이어야(422 DUTY_OUTSIDE_QUALIFICATION)'
                  allOf: [{ $ref: '#/components/schemas/QualificationBody' }]
                duty: { $ref: '#/components/schemas/WorkerDutyBody' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /mfcs/{mfcId}/workers/{workerId}:
    get:
      tags: [workers]
      summary: 작업자 한 명 — 지금 업무 + 업무 이력·상태 이력 (0.4.0)
      description: |
        그 센터 운영자(작업자 본인 포함) 또는 서비스 토큰. PDA 는 본인 토큰으로 자기 workerId(= 토큰 subject)를 불러 effectiveTaskTypes·workAreas·onBreak·displayName 으로
        업무 선택 화면의 권한·휴게를 표시한다(BR-52 R3).
        (0.13.0) 목록과 같은 작업자 값(employmentType·qualification·effectiveTaskTypes·workAreas·todayEnrollment·onBreak)을 모두 준다 — 0.12.0 까지 상세에서 빠져 있던 것을 고침.
      operationId: getWorker
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /mfcs/{mfcId}/workers/{workerId}/activities:
    get:
      tags: [work-activities]
      summary: '작업자 오늘 업무 내역 — 피킹·포장·입고·품질검사·적치·이동·실사·품질 판정을 한 곳에서 (0.17.0, F-7 R3·R4)'
      description: |
        PDA "업무 내역"(사용자 2026-11-17 "작업자마다 본인의 금일 작업내용을 체크할 수 있어야"). workerId = 토큰 주체(또는 `me`) 본인, 또는 그 센터 MFC_SUPERVISOR.
        `date`(Asia/Seoul, 없으면 오늘) 하루의 처리를 네 정본에서 모은다(각 `GET /internal/work-activities`):
        - mfc-fulfillment: PICK·RETURN(작업 실적 — 대기 중 RECORDED 포함), PACK(포장)
        - mfc-inbound: RECEIVE(입고 수령)·INSPECT·PUTAWAY(입고 작업 실행)·MOVE(이동·보충 — 집어 올린 사람, 시각 = 마지막 변경)·RETURN_RECEIPT(회수품 반입)
        - mfc-inventory: COUNT·RECOUNT(실사 계수)
        - mfc-quality: QUARANTINE·RELEASE(판정)·DISPOSE(폐기 실행)·RETURN_INSPECTION(회수품 검수)
        items 는 시각 순, `totals` = 정본·종류별 건수와 수량 합(REJECTED 는 건수만). 조회가 안 된 정본은 `unavailableSources` 에 이름만 — 빈 내역으로 오해하지 않게.
        진행 중 작업 목록·완료 시각은 fulfillment `GET /tasks?assignee=me&activityFrom=` 에도 있다(R1·R2).
      operationId: listWorkerActivities
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string }, description: '작업자(운영자) ID 또는 me' }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerActivities' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /mfcs/{mfcId}/workers/{workerId}/next-tasks:
    post:
      tags: [workers]
      summary: 다음 작업 받기 — 시스템이 작업을 하나씩 배정 (0.6.0)
      description: |
        2026-11-08 사용자 결정: 현장 크루는 정규직이든 일일크루든 **시스템이 작업을 하나씩 배정**한다. 작업자 본인(토큰 주체 = workerId)이 부른다.
        - 이미 들고 있는 작업(이 작업자의 ACTIVE 배정 중 아직 끝나지 않은 작업)이 있으면 그 배정을 200 으로 돌려준다(한 번에 하나).
        - 없으면 업무(작업 유형) 안의 **담당 없는 READY 작업** 중 가장 급한 것을 배정해 201(배정 출처 SYSTEM, `AssignmentPublished`).
          순서: 주문 작업(PICK·PACK — 출하 약속 이른 순) → 자동 보충(REPLENISH)·긴급 이동 → (0.25.0) **입고(RECEIVE)** → **품질검사(INSPECT) → 적치(PUTAWAY)** →
          센터 관리자 이동(MOVE) → 취소품 복귀(RETURN)(사용자 결정 2026-11-08, 품질검사·적치 자리는 2026-11-14 — Q-08 전 임시 순서)
          → (0.24.0) 회수품 반입(RETURN_RECEIPT) → 회수품 검수(RETURN_INSPECT) → 재고 실사(CYCLE_COUNT)(같은 업무의 기존 유형 뒤 — 사용자 순서 결정 전 임시). 같은 유형은 먼저 만든 것부터
          (입고 = 예정 도착(없으면 출발 시각), 반입 = 도착 시각, 검수 = 반입 시각, 실사 = 기준 시각).
          이동·보충은 mfc-inbound 이동 지시(담당 없음·아직 안 집음) — 조회가 안 되면 이동은 건너뛰고 나머지로.
          (0.14.0, BR-52 R2) 품질검사·적치는 mfc-inbound 입고 작업(READY·담당 없음) — 조회가 안 되면 건너뛰고 나머지로. 배정되면 mfc-inbound 가
          담당만 실행하게 한다(409 NOT_ASSIGNEE).
          (0.25.0, BR-53 R9) 입고(RECEIVE, taskId = trfId) = mfc-inbound 입고 예정(`GET /inbound-promises?mfcId=` — 끝나지 않은 EXPECTED·RECEIVING) 중
          **출발(TOUT `departureId`)을 받았고** (0.26.0, 사용자 결정 2026-11-20 "도착한 것만") **도착 등록된 RECEIVING** 이면서 재고 반영 전 수령(CAPTURED·SUBMITTED·PROCESSING·UNKNOWN_RESULT)이 없는 것
          (재고 거절 REJECTED 수령만 있으면 다시 준다). 도착 전(EXPECTED — 출발했어도)은 주지 않는다(0.25.0 은 출발한 EXPECTED 도 줬다). 입고 예정도 담당이 없어 이 서비스 배정이 한 사람에게만 주고,
          들고 있음 = 그 예정이 아직 EXPECTED·RECEIVING(재고 반영 TIN_POSTED·취소 CANCELLED 면 끝난 것). 조회가 안 되면 입고만 건너뛴다.
          (0.24.0) 회수품 반입 = mfc-inbound 반납 도착 대기(`GET /return-arrivals` WAITING), 회수품 검수 = 재고 반영(APPLIED)·검수 대기(PENDING) 반입,
          재고 실사 = mfc-inventory 계획 실사(`/internal/count-work`) — 각각 조회가 안 되면 그 종류만 건너뛴다. 셋은 정본에 담당이 없어 **이 서비스 배정이 한 사람에게만** 준다
          (들고 있는 사람이 있으면 다른 사람에게 안 줌, 실행 서비스는 담당을 검사하지 않는다). 실사는 셀 수 없는 사람(재계수의 첫 계수자)에게 주지 않고,
          첫 계수를 낸 사람의 배정은 끝난 것으로 닫아(RELEASED) 다른 사람에게 재계수를 준다. 끝난 판정 = 대기·계수 목록에서 빠졌는지.
        - ACTIVE 가 아니면 422 WORKER_NOT_ACTIVE, 등록 근무가 있는데 지금이 근무 밖이면 409 OFF_SHIFT — (0.9.3, 사용자 결정 2026-11-09 "풀타임 = 센터 운영시간") 근무 등록이 없으면 center-master 직원 근무 시간표(STAFF) 밖이면 409 OFF_SHIFT, 시간표가 없으면 422 CONFIG_REQUIRED(상시 근무로 바꾸지 않음),
          줄 작업이 없으면 409 NO_TASK_AVAILABLE. 센터 관리자의 수동 배정(`POST /assignments`)은 예외 처리로 그대로 쓴다.
        - MFC 는 온도대 출입 자격이 없다(사용자 2026-11-08 — 구분은 CDC 만).
        - (0.9.1) 응답 `detail` 에 받은 작업의 상세(상품·칸·LOT·수량·약속 시각)를 한 번에 — PICK·PACK·RETURN 은 mfc-fulfillment 작업 상세, REPLENISH·MOVE 는
          mfc-inbound 이동 지시, (0.14.0) INSPECT·PUTAWAY 는 mfc-inbound 입고 작업(한 줄 — 출발 칸 = 수령 위치, 남은 양)에서 옮겨 적는다.
          (0.24.0) CYCLE_COUNT 는 `locationCodes`(셀 칸 — 계수표는 mfc-inventory `GET /mfcs/{mfcId}/count-sessions/{sessionId}`), RETURN_RECEIPT 는 반납 대기 줄(상품·상품명·수량, 반품 칸은 현장에서),
          RETURN_INSPECT 는 반입 줄(상품·LOT·수량, 출발 칸 = 반품 칸, notice = 반입 때 적은 상태 메모).
          (0.25.0) RECEIVE 는 입고 예정 줄(상품·상품명·lotId = CDC LOT 표기·expiresOn = 소비기한·수량 = 예정 − 재고 반영된 인수, 다 받은 줄은 뺌) — 수령 위치는 현장에서, 도착·수령은 `GET /inbound-promises/{trfId}`.
          상품명·바코드는 상세에 없다 — 화면은 각 작업 조회(`/inbound-tasks/{id}`·`/move-orders/{id}`)의 productName·barcodes 를 쓴다. 조회가 안 되면 `detail.available=false`(배정은 그대로 — 화면이 상세 API 를 직접 부른다).
        - (0.13.0, BR-52 R1) 본문 `workArea`(작업자가 고른 업무)를 주면 **그 업무의 작업 유형 ∩ 유효 업무** 안에서만 새 작업을 배정한다.
          겹치는 유형이 없으면 422 WORK_AREA_NOT_ALLOWED(PDA "권한이 없어요"). 생략하면 예전처럼 유효 업무 전체.
          이미 들고 있는 작업은 고른 업무와 상관없이 그대로 돌려준다(한 번에 하나 — 업무가 다르면 화면이 안내).
        - (0.26.0, 요청 MC-2 — 사용자 결정 2026-11-20 "다음 업무에서 픽업하기 전에 새 업무로") **미리 정한 격리 이동이 맨 먼저** — mfc-inbound 입고 작업
          `taskType: QUARANTINE_MOVE`(0.17.0) 중 `assigneeId` 가 이 작업자인 READY 작업을, 들고 있는 작업이 없으면 다른 어떤 새 작업(자기 PACK·주문 작업 포함)보다 먼저 준다.
          고른 업무(`workArea`)·업무 범위와 상관없이(담당은 만들 때 정해졌다 — 422 WORK_AREA_NOT_ALLOWED 보다 먼저). 휴게 중(409 ON_BREAK)·근무 밖은 그대로 막는다.
          담당이 다른 사람이거나 없는 격리 이동은 아무에게도 주지 않는다(담당자는 PDA 작업 목록으로도 연다). 여럿이면 만든 순. 상세 = 입고 작업 한 줄(출발 칸, 남은 양 = 계획 − 완료 − 현장 예외분).
        - (0.19.0, 사용자 결정 2026-11-18) **피킹한 사람이 그 출고 PACK 을** — 자기가 끝낸 PICK 의 같은 출고 PACK(fulfillment `pickedBy`)이 READY 면 다른 어떤 후보보다 먼저 준다.
          다른 사람이 피킹한 PACK 은 후보에서 뺀다(장바구니를 든 사람만 — 피커가 휴게·퇴근·정지면 센터 관리자 배정 `POST /assignments` 로만). 피커를 모르는 PACK 은 누구나.
      operationId: pullNextTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { type: string } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workArea: { $ref: '#/components/schemas/WorkArea' }
      responses:
        '200':
          description: 이미 들고 있는 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '201':
          description: 새로 배정한 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignment' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: OFF_SHIFT / NO_TASK_AVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: WORKER_NOT_REGISTERED / WORKER_NOT_ACTIVE / DAILY_NOT_ENROLLED / WORK_AREA_NOT_ALLOWED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /mfcs/{mfcId}/workers/{workerId}/qualification-changes:
    post:
      tags: [workers]
      summary: 자격 변경 (그 센터 MFC_SUPERVISOR — 0.7.0)
      description: |
        2026-11-08 사용자 결정(자격과 업무 분리): 자격 = 할 수 있는 일(센터 관리자, 계속 유지, 만료일 선택). 새 버전으로 남긴다. 업무는 자격 안에서만 유효 —
        자격에서 빠진 업무 유형은 배정 조건에서 빠진다(업무 행은 그대로, 지금 유효 업무 = 업무 ∩ 자격). X-Expected-Version = 지금 자격 버전.
      operationId: changeWorkerQualification
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { type: string } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/QualificationBody'
                - type: object
                  properties:
                    reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 바뀐 작업자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/workers/{workerId}/day-enrollments:
    post:
      tags: [workers]
      summary: 일일크루 그날 근무 등록(출근) (0.7.0)
      description: |
        2026-11-08 사용자 결정: 일일크루는 계정을 사람별로 유지하고 **그날 근무 등록**으로 통제한다. 등록한 날만 작업을 받는다(없으면 배정·다음 작업
        받기 422 DAILY_NOT_ENROLLED). 그날 업무는 시스템이 정한다 — 지금은 유효 자격 전부(그날 수요에 맞춘 세분은 나중). 그 센터 MFC_SUPERVISOR 또는 본인.
        일일크루가 아니면 422 NOT_DAILY_CREW. 같은 날 다시 부르면 같은 등록.
      operationId: enrollWorkerDay
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { type: string } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                businessDate: { type: string, format: date, description: '생략 = 오늘(Asia/Seoul)' }
      responses:
        '200':
          description: 그날 등록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayEnrollment' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: NOT_DAILY_CREW / WORKER_NOT_ACTIVE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/workers/{workerId}/breaks:
    post:
      tags: [workers]
      summary: 휴게 시작 (0.8.0)
      description: |
        2026-11-08 사용자 결정(Q-09): 휴게 중에는 다음 작업 받기가 작업을 주지 않는다(409 ON_BREAK), 들고 있던 작업은 그대로. 본인 또는 그 센터 관리자.
        이미 휴게 중이면 그 휴게(200).
        (0.20.0, 사용자 결정 2026-11-18) **작업자 본인 토큰이면 `supervisorPin`(센터 관리자가 정한 4자리 — `PUT /mfcs/{mfcId}/break-pin`) 필수.** 센터 관리자는 번호 없이.
        422 `BREAK_PIN_NOT_SET`(센터가 번호를 안 정함)·`BREAK_PIN_INVALID`(틀림 — details 에 남은 횟수)·`BREAK_PIN_LOCKED`(그 작업자가 연속 5번 틀림 → 15분, details 에 풀리는 시각. 센터 관리자가 번호를 새로 정하면 풀림).
        번호가 빠지면 400 VALIDATION_FAILED(횟수를 세지 않는다). 거절도 확정 결과 — 같은 Idempotency-Key 는 같은 판정(번호를 바꿔 다시 시도하면 새 키).
      operationId: startWorkerBreak
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { type: string } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                supervisorPin: { type: string, pattern: '^[0-9]{4}$', description: '(0.20.0) 센터 휴게 번호 — 작업자 본인이면 필수. 저장·로그 금지', x-added-in: '2026-11-18' }
      responses:
        '200':
          description: 휴게 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerBreak' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /mfcs/{mfcId}/workers/{workerId}/breaks/current/end:
    post:
      tags: [workers]
      summary: 휴게 끝 (0.8.0)
      description: |
        본인 또는 그 센터 관리자, 번호 없이. (0.20.0) **자동 휴게(source AUTO — 근무의 휴게 구간)는 센터 관리자만 일찍 끝낼 수 있다** — 작업자 본인이면 409 `AUTO_BREAK_SUPERVISOR_ONLY`(사용자 결정 2026-11-18). 정한 끝 시각이 되면 서버가 끝낸다.
      operationId: endWorkerBreak
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { type: string } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 끝낸 휴게(휴게 중이 아니었으면 마지막 휴게, 없으면 404)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerBreak' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/pick-routes:
    post:
      tags: [assignments]
      summary: '[mfc-fulfillment→capacity] 피킹 방문 순서 (0.10.0, ADR-0050 B2)'
      description: |
        2026-11-09 사용자 결정. 피킹 시작 때 fulfillment 가 이 작업의 칸 목록을 주면 방문 순서를 돌려준다.
        - 규칙: MFC 문서 1장 8-3 원본 순서 → **냉장(B) → 냉동(A) → 상온 C → D → E → F → G → H** 그룹 순, 그룹 안은 걷는 거리 최단(OR-Tools 경로).
          출발점은 늘 장바구니 보관 자리(설정 `pmart.capacity.plan.pick-route-start`). 작업자 위치에 따른 예외 없음. 선반이 아닌 칸·좌표 없는 칸은 맨 뒤(코드 순).
        - 거리: mfc-location `/internal/location-distances`(직각 거리, 벽 미반영 — limitations WALLS_NOT_CONSIDERED).
        - method: ROUTING(OR-Tools) / NEAREST_FALLBACK(엔진을 못 쓰거나 시간 안에 못 풀면 가까운 칸부터). 거리표를 못 읽으면 503 — fulfillment 는 칸 코드 순으로 대신한다.
        - 읽기만 하는 계산이지만 POST(공통 규칙상 Idempotency-Key 필요).
      operationId: planPickRoute
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, locationCodes]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                locationCodes: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
      responses:
        '200':
          description: 방문 순서
          content:
            application/json:
              schema:
                type: object
                properties:
                  ordered: { type: array, items: { type: string }, description: 방문 순서(요청 칸 전부, 중복 없이) }
                  startLocation: { type: string }
                  method: { type: string, enum: [ROUTING, NEAREST_FALLBACK] }
                  totalMeters: { type: number, description: 출발점에서 마지막 칸까지(좌표 있는 칸만) }
                  missing: { type: array, items: { type: string }, description: 좌표가 없어 맨 뒤에 둔 칸 }
                  limitations: { type: array, items: { type: string } }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/assignments/{taskId}/releases:
    post:
      tags: [assignments]
      summary: '[mfc-fulfillment→capacity] 작업 내놓기 — 그 작업의 ACTIVE 배정 해제 (0.8.0)'
      description: |
        2026-11-08 사용자 결정(Q-09): 작업자가 "작업 내놓기"(교대·퇴근)를 하면 fulfillment 가 잔량을 확인(진행 중 실적 없음)한 뒤 이 요청으로 배정을 풀고
        작업을 READY 로 되돌린다. workerId 가 지금 담당이 아니면 409 NOT_ASSIGNEE. 활성 배정이 없으면 변화 없는 성공. 사건은 내지 않는다(fulfillment 가 작업 상태 정본).
      operationId: releaseTaskAssignment
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId: { type: string }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 해제(또는 이미 없음)
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  released: { type: boolean }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/workers/{workerId}/duty-changes:
    post:
      tags: [workers]
      summary: 업무 변경 — 새 업무 버전 (그 센터 MFC_SUPERVISOR — 0.4.0)
      description: |
        업무를 통째로 새 버전으로 적는다(이전 버전은 이력으로 남는다). 계정·로그인·상태는 바뀌지 않는다. X-Expected-Version = 지금 dutyVersion(다르면 409).
        이미 잡힌 배정은 지우지 않는다 — 새 업무에 맞지 않는 ACTIVE 배정은 응답 affectedAssignments 로 알려 센터 관리자가 재배정한다.
      operationId: changeWorkerDuty
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WorkerDutyBody'
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 바뀜(같은 내용이면 변화 없이 지금 상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerChangeResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /mfcs/{mfcId}/workers/{workerId}/state-changes:
    post:
      tags: [workers]
      summary: 작업자 상태 변경 ACTIVE·SUSPENDED·LEFT (그 센터 MFC_SUPERVISOR — 0.4.0)
      description: SUSPENDED·LEFT 는 새 배정을 막는다(로그인·센터 권한은 auth 소관이라 여기서 바꾸지 않는다). 기존 ACTIVE 배정은 affectedAssignments 로 알린다.
      operationId: changeWorkerState
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, reason]
              properties:
                state: { $ref: '#/components/schemas/WorkerState' }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 바뀜(같은 상태면 변화 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerChangeResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /mfcs/{mfcId}/workers/{workerId}/speed-changes:
    post:
      tags: [workers]
      summary: 작업자 속도 배율 변경 (그 센터 MFC_SUPERVISOR — 0.11.0)
      description: |
        2026-11-09 사용자 결정. 배정 추천(OR-Tools)에서 이 작업자가 작업에 쓰는 시간 = 작업 추정 분 ÷ 배율(올림, 최소 1분). 0.5~2.0, 기본 1.0.
        실데이터가 없어 센터 관리자가 정하는 값(예: 숙련 1.2, 신입 0.8). 다음 작업 받기(규칙 배정)에는 쓰지 않는다.
      operationId: changeWorkerSpeed
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speedFactor, reason]
              properties:
                speedFactor: { type: number, minimum: 0.5, maximum: 2.0 }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 바뀜(같은 값이면 변화 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Worker' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /mfcs/{mfcId}/staff-names:
    get:
      tags: [workers]
      summary: 직원 이름 · 사번 (0.23.0, ADR-0070)
      description: |
        센터 화면이 처리자·결정자·요청자 칸의 운영자 ID(OP-…)를 **이름 · 사번**으로 바꿔 보이려고(ADR-0070 — 운영자 ID 는 화면에 내지 않는다). 그 센터 운영자.
        `operatorIds` 반복(1~200, 같은 값은 한 번). 이름은 hr-service, 사번은 이 서비스의 인사 사본. 모르는 ID 는 items 에서 빠진다(오류 아님 — 화면은 "직원"으로).
        이름 조회가 안 되면 이름만 null(사번은 있으면 준다). 이름 외 인사 정보(메일·소속)는 싣지 않는다.
      operationId: getStaffNames
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: operatorIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: { type: string, maxLength: 128 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [operatorId]
                      properties:
                        operatorId: { type: string }
                        name: { type: [string, 'null'] }
                        employeeNo: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /mfcs/{mfcId}/break-pin:
    get:
      tags: [workers]
      summary: 센터 휴게 번호 상태 (0.20.0)
      description: 그 센터 운영자. 정했는지·언제·누가만 — 번호는 돌려주지 않는다.
      operationId: getBreakPin
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BreakPinStatus' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    put:
      tags: [workers]
      summary: 센터 휴게 번호 정하기·바꾸기 (그 센터 MFC_SUPERVISOR — 0.20.0)
      description: |
        사용자 결정(2026-11-18): 작업자가 PDA 로 휴게를 켤 때 받는 4자리. 로그인 비밀번호와 따로, 서버에는 해시(PBKDF2)만. 바꾸면 그 센터 작업자의 틀린 횟수·잠금이 모두 풀린다.
      operationId: setBreakPin
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, pattern: '^[0-9]{4}$', description: 저장·로그 금지 }
      responses:
        '200':
          description: 정해짐
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BreakPinStatus' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/staff-contacts:
    get:
      tags: [staff-contacts]
      summary: 센터 직원 연락처 목록 (0.21.0)
      description: |
        사용자 결정(2026-11-18): 시스템이 쓰지 않는 **연락 수단 표시용** — 라이더·다른 센터·본사 직원이 그 센터 담당자에게 연락할 때. 모든 운영자(센터 무관)·라이더.
        휴대폰·이메일 중 하나라도 있는 사람만, 이름 순. 로그인 ID(회사 메일)와 따로다.
      operationId: listStaffContacts
      x-pmart-user-types: [OPERATOR, RIDER]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/StaffContact' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /mfcs/{mfcId}/staff-contacts/me:
    get:
      tags: [staff-contacts]
      summary: 내 연락처 (0.21.0)
      description: 그 센터 운영자 본인. 아직 없으면 빈 값·version 0.
      operationId: getMyStaffContact
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffContact' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    put:
      tags: [staff-contacts]
      summary: 내 연락처 등록·변경 (0.21.0)
      description: |
        그 센터 운영자 본인만. X-Expected-Version = 지금 version(처음이면 0) — 다르면 409 VERSION_CONFLICT. 빈 값·null 은 지운다(셋 다 비면 목록에서 빠짐).
        형식이 틀리면 400 VALIDATION_FAILED(details field). 개인정보 — 로그·사건에 남기지 않는다.
      operationId: putMyStaffContact
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: [string, 'null'], maxLength: 50, description: 표시 이름(예 "센터장 홍길동") }
                phone: { type: [string, 'null'], maxLength: 20, description: '휴대폰·전화 — 숫자와 - 만, 9~11자리' }
                email: { type: [string, 'null'], maxLength: 254, description: 연락용 이메일(로그인 메일과 무관) }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffContact' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/workers/{workerId}/shifts:
    get:
      tags: [workers]
      summary: 근무 일정 (0.4.0)
      operationId: listWorkerShifts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK (PLANNED 만, 시작 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkerShift' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [workers]
      summary: 근무 등록 (그 센터 MFC_SUPERVISOR — 0.4.0)
      description: |
        [startAt, endAt) — 최대 16시간, 같은 작업자의 PLANNED 근무와 겹치면 409 SHIFT_OVERLAP. 휴게·교대 규칙(Q-09)은 미결이라 근무 밖 배정은 아직 막지 않는다
        (배정 응답 warnings 에 OFF_SHIFT 로만 알린다).
      operationId: addWorkerShift
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                note: { type: string, maxLength: 200 }
                breakStartAt: { type: string, format: date-time, description: '(0.20.0) 휴게 구간 시작 — breakEndAt 과 같이, 근무 안. 이 시각에 서버가 자동 휴게(AUTO)를 켠다', x-added-in: '2026-11-18' }
                breakEndAt: { type: string, format: date-time, description: '(0.20.0) 휴게 구간 끝 — 이 시각에 자동 휴게를 끝낸다', x-added-in: '2026-11-18' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerShift' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /mfcs/{mfcId}/workers/{workerId}/shifts/{shiftId}/cancellations:
    post:
      tags: [workers]
      summary: 근무 취소 (그 센터 MFC_SUPERVISOR — 0.4.0)
      operationId: cancelWorkerShift
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: workerId, in: path, required: true, schema: { type: string } }
        - { name: shiftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 취소됨(이미 취소면 지금 상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerShift' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
components:
  schemas:
    WorkerActivities:
      type: object
      required: [mfcId, workerId, date, items, totals, unavailableSources]
      properties:
        mfcId: { type: string }
        workerId: { type: string }
        date: { type: string, format: date, description: Asia/Seoul }
        items:
          type: array
          items:
            type: object
            required: [source, activityType, refId, at]
            properties:
              source: { type: string, description: 정본 서비스 이름 }
              activityType: { type: string }
              refId: { type: string }
              taskId: { type: [string, 'null'] }
              sku: { type: [string, 'null'] }
              qty: { type: [integer, 'null'] }
              result: { type: [string, 'null'], description: 그 원장의 상태(APPLIED·REJECTED·RECORDED 등) }
              at: { type: string, format: date-time }
        totals:
          type: array
          description: '(R4) 정본·종류별 건수·수량 합(REJECTED 는 수량에서 뺌)'
          items:
            type: object
            required: [source, activityType, count, qty]
            properties:
              source: { type: string }
              activityType: { type: string }
              count: { type: integer }
              qty: { type: integer }
        unavailableSources: { type: array, items: { type: string }, description: 주소가 없거나 조회 실패한 정본 }
    WorkerState: { type: string, enum: [ACTIVE, SUSPENDED, LEFT] }
    TaskType: { type: string, enum: [PICK, PACK, RETURN, DISPATCH, RECEIVE, INSPECT, PUTAWAY, REPLENISH, MOVE, RETURN_RECEIPT, RETURN_INSPECT, CYCLE_COUNT], description: '(0.9.0) MOVE = 센터 관리자 지시 재고 이동(mfc-inbound 이동 지시), REPLENISH = 자동 선반 보충. (0.13.1) RECEIVE 의 taskId = mfc-inbound 입고 예정 trfId(BR-53 R9) — 수동 배정도 trfId 로, (0.25.0) 다음 작업 받기가 출발을 받은 입고 예정을 준다. (0.24.0) RETURN_RECEIPT 회수품 반입(taskId = 반납 도착 arrivalId), RETURN_INSPECT 회수품 검수(taskId = returnReceiptId), CYCLE_COUNT 재고 실사(taskId = 실사 sessionId) — 기존 작업자에게 자동으로 더하지 않는다(센터 관리자가 자격·업무에 더한다)' }
    TemperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
    WorkArea:
      type: string
      enum: [INBOUND, INSPECTION, STOCK_MOVE, STOCK_COUNT, PICK_PACK]
      description: |
        (0.13.0, BR-52 R4 — 사용자 결정 2026-11-10) PDA 에서 작업자가 고르는 업무 = 작업 유형 묶음.
        INBOUND 입고 = RECEIVE / INSPECTION 품질검사 = INSPECT / STOCK_MOVE 재고 이동 = PUTAWAY·REPLENISH·MOVE·RETURN /
        STOCK_COUNT 재고 실사 = (아직 배정 가능한 작업 유형 없음) / PICK_PACK 피패킹 = PICK·PACK.
        (0.14.0, BR-52 R2) INSPECTION·STOCK_MOVE(적치)는 다음 작업 받기가 실제 작업을 준다. (0.25.0) INBOUND(RECEIVE)도 — mfc-inbound 입고 예정.
        (0.24.0) INSPECTION = INSPECT·RETURN_INSPECT, STOCK_MOVE = PUTAWAY·REPLENISH·MOVE·RETURN·RETURN_RECEIPT, STOCK_COUNT = CYCLE_COUNT. DISPATCH(배차 요청 — 점원)는 어느 업무에도 없다.
    WorkerDutyBody:
      type: object
      description: 업무 — 할 수 있는 작업 유형. 계정과 따로 버전으로 남긴다. temperatureZones 는 0.6.0 부터 MFC 에서 쓰지 않는다(사용자 2026-11-08 — MFC 는 온도대 출입 자격 없음, 구분은 CDC 만). 보내면 기록만.
      required: [taskTypes]
      properties:
        taskTypes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/TaskType' } }
        temperatureZones: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/TemperatureZone' }, description: '(0.6.0) MFC 에서 배정 조건 아님 — 기록만' }
    WorkerDuty:
      type: object
      properties:
        dutyVersion: { type: integer }
        taskTypes: { type: array, items: { $ref: '#/components/schemas/TaskType' } }
        temperatureZones: { type: array, items: { $ref: '#/components/schemas/TemperatureZone' } }
        reason: { type: [string, 'null'] }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    Worker:
      type: object
      properties:
        mfcId: { type: string }
        workerId: { type: string, description: 로그인 계정(운영자 ID). 바뀌지 않는다 }
        displayName: { type: string }
        name: { type: [string, 'null'], description: '(0.23.0, ADR-0070) 이름 — hr-service(조회가 안 되면 null). 화면 표기 = 이름 · 사번', x-added-in: '2026-11-19' }
        employeeNo: { type: [string, 'null'], description: '(0.23.0) 사번(인사 사본 — 인사 등록 전 직접 등록한 작업자는 null)', x-added-in: '2026-11-19' }
        state: { $ref: '#/components/schemas/WorkerState' }
        duty: { $ref: '#/components/schemas/WorkerDuty' }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        qualification: { $ref: '#/components/schemas/WorkerQualification' }
        effectiveTaskTypes: { type: array, items: { $ref: '#/components/schemas/TaskType' }, description: '(0.7.0) 지금 배정 조건 = 업무 ∩ 유효 자격(일일크루는 오늘 등록한 날의 업무)' }
        workAreas: { type: array, items: { $ref: '#/components/schemas/WorkArea' }, description: '(0.13.0) 지금 고를 수 있는 업무 — 묶음의 작업 유형이 effectiveTaskTypes 와 하나라도 겹치는 업무(WorkArea 순서). 빠진 업무는 PDA 가 "권한이 없어요"' }
        todayEnrollment: { oneOf: [{ $ref: '#/components/schemas/DayEnrollment' }, { type: 'null' }] }
        onBreak: { type: boolean, description: '(0.8.0) 휴게 중 — 다음 작업 받기 409 ON_BREAK' }
        speedFactor: { type: number, description: '(0.11.0) 속도 배율 — 배정 추천에서 이 작업자의 작업 시간 = 추정 분 ÷ 배율(1.0 보통, 실데이터 없어 센터 관리자가 정함)' }
        registeredBy: { type: string }
        registeredAt: { type: string, format: date-time }
    EmploymentType: { type: string, enum: [REGULAR, PART_TIME, DAILY], description: '(0.7.0) 정규직 / 알바 / 일일크루. 기본 REGULAR' }
    WorkerBreak:
      type: object
      properties:
        breakId: { type: string }
        workerId: { type: string }
        startedAt: { type: string, format: date-time }
        startedBy: { type: string, description: '(0.20.0) 자동 휴게는 SYSTEM' }
        endedAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [MANUAL, AUTO], description: '(0.20.0) AUTO = 근무 휴게 구간으로 서버가 켬', x-added-in: '2026-11-18' }
        shiftId: { type: [string, 'null'], description: '(0.20.0) 자동 휴게의 근무', x-added-in: '2026-11-18' }
        plannedEndAt: { type: [string, 'null'], format: date-time, description: '(0.20.0) 자동 휴게가 끝날 시각', x-added-in: '2026-11-18' }
    QualificationBody:
      type: object
      required: [taskTypes]
      properties:
        taskTypes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/TaskType' } }
        expiresAt: { type: [string, 'null'], format: date-time, description: '만료 — 지나면 이 자격으로 배정하지 않음. 기본 없음' }
    WorkerQualification:
      type: object
      properties:
        qualificationVersion: { type: integer }
        taskTypes: { type: array, items: { $ref: '#/components/schemas/TaskType' } }
        expiresAt: { type: [string, 'null'], format: date-time }
        expired: { type: boolean }
        changedBy: { type: string }
        changedAt: { type: string, format: date-time }
    DayEnrollment:
      type: object
      properties:
        workerId: { type: string }
        businessDate: { type: string, format: date }
        dutyTaskTypes: { type: array, items: { $ref: '#/components/schemas/TaskType' }, description: '시스템이 정한 그날 업무' }
        enrolledBy: { type: string }
        enrolledAt: { type: string, format: date-time }
    WorkerDetail:
      allOf:
        - $ref: '#/components/schemas/Worker'
        - type: object
          properties:
            dutyHistory: { type: array, description: 새 버전부터, items: { $ref: '#/components/schemas/WorkerDuty' } }
            stateHistory:
              type: array
              description: 새 것부터
              items:
                type: object
                properties:
                  fromState: { type: [string, 'null'] }
                  toState: { type: string }
                  reason: { type: [string, 'null'] }
                  changedBy: { type: string }
                  changedAt: { type: string, format: date-time }
    WorkerChangeResult:
      type: object
      properties:
        worker: { $ref: '#/components/schemas/Worker' }
        changed: { type: boolean }
        affectedAssignments:
          type: array
          description: 이 작업자의 ACTIVE 배정 중 새 업무·상태에 맞지 않는 것(지우지 않음 — 재배정 판단용)
          items: { $ref: '#/components/schemas/Assignment' }
    WorkerShift:
      type: object
      properties:
        shiftId: { type: string }
        mfcId: { type: string }
        workerId: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        state: { type: string, enum: [PLANNED, CANCELLED] }
        note: { type: [string, 'null'] }
        createdBy: { type: string }
        cancelReason: { type: [string, 'null'] }
        breakStartAt: { type: [string, 'null'], format: date-time, description: '(0.20.0) 휴게 구간(자동 휴게)', x-added-in: '2026-11-18' }
        breakEndAt: { type: [string, 'null'], format: date-time, x-added-in: '2026-11-18' }
    StaffContact:
      type: object
      x-added-in: '2026-11-18'
      description: (0.21.0) 센터 직원 연락처 — 연락 수단 표시용
      required: [mfcId, operatorId, version]
      properties:
        mfcId: { type: string }
        operatorId: { type: string }
        name: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        version: { type: integer, description: 처음이면 0 }
        updatedAt: { type: [string, 'null'], format: date-time }
    BreakPinStatus:
      type: object
      x-added-in: '2026-11-18'
      description: (0.20.0) 센터 휴게 번호 상태 — 번호 자체는 어떤 응답에도 없다
      required: [mfcId, set]
      properties:
        mfcId: { type: string }
        set: { type: boolean }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
    CapacityDemand:
      type: object
      description: 주문 1건이 소비하는 수용 단위 입력
      properties:
        lineCount: { type: integer, minimum: 1 }
        itemCount: { type: integer, minimum: 1 }
        weightG: { type: integer, minimum: 0 }
        plannedShipments: { type: integer, minimum: 1 }
        temperatureZones: { type: array, items: { type: string, enum: [AMBIENT, CHILLED, FROZEN] } }
    CapacitySnapshot:
      type: object
      properties:
        mfcId: { type: string }
        window: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        capacityUnits: { type: integer, description: 단계별 환산 최소값 }
        heldUnits: { type: integer }
        confirmedUnits: { type: integer }
        availableUnits: { type: integer, description: capacityUnits − held − confirmed }
        stages:
          type: array
          description: '[시험 정책 2026-10-30] 단계별 환산이 아직 없어 정책값(1시간 창당 수용 단위) 하나를 WORKFORCE 단계 1개로 돌려준다'
          items:
            type: object
            properties:
              stage: { type: string, enum: [PICKING, PACKING, STORAGE, WORKFORCE] }
              rawCapacity: { type: integer }
              convertedUnits: { type: integer }
        activeRestrictions: { type: array, items: { type: string }, description: '0.3.0 — 이 창에 걸린 활성 제한 ID' }
    CapacityHold:
      type: object
      properties:
        holdId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        window: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { type: string, enum: [HELD, CONFIRMED, RELEASED, EXPIRED] }
        units: { type: integer }
        expiresAt: { type: [string, 'null'], format: date-time }
        releaseReason: { type: [string, 'null'] }
    ReceivingWindow:
      type: object
      properties:
        windowId: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        maxLoadUnitsPerArrival:
          type: integer
          description: 1회 입고 상한 (가정)
        totalLoadUnits: { type: integer }
        reservedLoadUnits: { type: integer }
        bayCount: { type: integer }
        state: { type: string, enum: [OPEN, FULL, CLOSED] }
    AssignTaskRequest:
      type: object
      required: [mfcId, taskId, taskType, workerId]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        taskId: { type: string, maxLength: 96 }
        taskType: { $ref: '#/components/schemas/TaskType', description: '표시·집계용(작업 정본은 fulfillment/inbound). 0.5.2 — 업무 유형 목록과 같게(RETURN 포함 — 집품 뒤 취소 복귀 작업이 배정되지 않던 것, 2026-11-08 LAN E2E 에서 발견)' }
        workerId: { type: string, maxLength: 64, description: 작업자 = 운영자 ID(작업자 로그인 BR-02 결정 전 잠정). 이 센터에 등록된 작업자여야 한다(0.4.0) }
        temperatureZone: { $ref: '#/components/schemas/TemperatureZone', description: '(0.4.0) 작업 구역 온도대 — 주면 그 자격을 검사' }
        reason: { type: string, maxLength: 200 }
    Assignment:
      type: object
      properties:
        assignmentId: { type: string }
        mfcId: { type: string }
        taskId: { type: string }
        taskType: { type: string }
        workerId: { type: string }
        assignmentVersion: { type: integer }
        state: { type: string, enum: [ACTIVE, SUPERSEDED, RELEASED] }
        planId: { type: [string, 'null'], description: 수동 배정은 null }
        assignedBy: { type: [string, 'null'] }
        assignedAt: { type: string, format: date-time }
        source: { type: [string, 'null'], enum: [MANUAL, PLAN, SYSTEM, null], description: '(0.6.0) 배정 출처 — SYSTEM = 다음 작업 받기' }
        warnings: { type: array, items: { type: string }, description: '(0.4.0) 막지 않는 경고 — OFF_SHIFT(등록 근무 밖)' }
        detail:
          oneOf:
            - { $ref: '#/components/schemas/NextTaskDetail' }
            - { type: 'null' }
          description: '(0.9.1) 다음 작업 받기 응답에만 — 받은 작업의 상세. 다른 응답은 null'
        workerEligibility:
          type: [string, 'null']
          description: |
            (0.5.1, 조회 때 계산) 이 배정의 작업자가 **지금도** 맡을 수 있는가. null = 적격. 아니면 WORKER_NOT_REGISTERED·WORKER_NOT_ACTIVE·DUTY_NOT_ALLOWED·ZONE_NOT_QUALIFIED.
            배정 뒤 정지·퇴사·업무 변경이 있어도 배정은 지우지 않는다 — fulfillment 가 작업 시작 때 이 값으로 시작을 거절한다(2026-11-08 검토 반영 #29·#30).
    NextTaskDetail:
      type: object
      description: (0.9.1) PDA 가 다음 작업 받기 한 번으로 화면을 그리게 — 정본은 각 서비스(작업·이동 지시) 상세
      properties:
        available: { type: boolean, description: 상세를 읽었나(false 면 나머지는 비어 있음) }
        promisedReadyAt: { type: [string, 'null'], format: date-time, description: 출하 약속(주문 작업) }
        urgent: { type: boolean, description: 긴급 이동 }
        packingLocations: { type: array, items: { type: string }, description: PACK — 집품분이 놓인 포장 위치 }
        locationCodes: { type: array, items: { type: string }, description: '(0.24.0) CYCLE_COUNT — 셀 칸(계획 실사는 칸 하나). 다른 작업은 빈 배열' }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: [string, 'null'], description: '(0.24.0) RETURN_RECEIPT 의 반납 대기 줄은 배송 사건에 상품 코드가 없던 반납이면 null — 반입 때 점원이 상품을 정한다' }
              productName: { type: [string, 'null'] }
              lotId: { type: [string, 'null'] }
              expiresOn: { type: [string, 'null'], format: date }
              qty: { type: integer, description: 남은 양 }
              fromLocation: { type: [string, 'null'], description: '집을 칸(PICK 배정 칸 우선·RETURN 포장 위치·이동 출발 칸)' }
              toLocation: { type: [string, 'null'], description: 놓을 칸(RETURN 추천 칸·이동 도착 칸) }
              notice: { type: [string, 'null'], description: '화면 안내(예: "어느 칸에서도 못 찾음 — 센터 관리자 확인")' }
    AssignmentPlan:
      properties:
        planId: { type: string }
        inputHash:
          type: string
          nullable: true
          description: '(0.12.0) 계산 입력 JSON 의 SHA-256 — `GET /assignment-plans/{planId}/input`. 보관 상한으로 지워졌으면 null'
        mfcId: { type: string }
        state:
          type: string
          enum: [PROPOSED, COMMITTED, NO_SOLUTION, STALE, UNDETERMINED, INVALID]
          description: '(0.9.4) 원문 WK-09 — 시간 안에 해를 못 찾음(solver UNKNOWN, 불가능 증명 아님) = UNDETERMINED, 모델 입력 오류 = INVALID, 불가능 증명 = NO_SOLUTION. 확정은 PROPOSED 만'
        solverStatus: { type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID, NOT_RUN] }
        horizonStart: { type: string, format: date-time }
        horizonMinutes: { type: integer }
        items:
          type: array
          description: 추천 배정(시작 순)
          items:
            type: object
            properties:
              taskId: { type: string }
              taskType: { type: string }
              taskVersion: { type: integer }
              workerId: { type: string }
              dutyVersion: { type: integer }
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
              lateMinutes: { type: integer, description: promisedReadyAt 보다 늦게 끝나는 분(0 이상) }
        unassigned:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string }
              taskType: { type: string }
              reason: { type: string, enum: [NO_ELIGIBLE_WORKER, NO_TIME, CONFIG_REQUIRED, UNDETERMINED], description: '(0.9.4) UNDETERMINED = 계산이 시간 안에 판단 못 함' }
        objective:
          type: object
          properties:
            unassignedCount: { type: integer }
            lateMinutes: { type: integer }
            maxWorkerLoadMinutes: { type: integer }
            objectiveValue: { type: integer, format: int64 }
            wallTimeMs: { type: integer }
        staleReasons: { type: array, items: { type: string } }
        settings:
          type: object
          description: |
            (0.5.1) 이 계산에 쓴 설정 — 임시 구현값(운영 정책 아님): taskMinutes(유형별 분, 규모 설계 가정), weights(목적 가중치, Q-08 전),
            packingStations, timeLimitMs. 같은 계획을 나중에 봐도 어떤 값으로 계산했는지 안다.
          additionalProperties: true
        availabilityUnverifiedWorkers:
          type: array
          description: '(0.5.1) 근무를 등록하지 않은 작업자 — (0.9.3) 센터 직원 근무 시간표(STAFF) 안에서만 계산했다(사용자 결정 2026-11-09 풀타임 = 센터 운영시간). 시간표가 없으면 계산 422 CONFIG_REQUIRED'
          items: { type: string }
        limitations:
          type: array
          description: '(0.5.1) 이 추천의 알려진 한계 — IN_PROGRESS_FULL_DURATION(진행 중 작업 남은 시간 모름, 전체 시간으로 막음) / (0.9.4) IN_PROGRESS_ESTIMATED_BY_PROGRESS(남은 수량 비율로 추정), NO_TRAVEL_TIME(동선 없음), FIXED_TASK_MINUTES(수량 무관 고정 분), MOVES_NOT_INCLUDED, (0.9.4) RULE_BASED_FALLBACK(엔진이 시간 안에 해를 못 내 규칙 기반 해). (0.11.0) TRAVEL_ESTIMATED·TRAVEL_ESTIMATE_PARTIAL — 설정이 있으면 NO_TRAVEL_TIME·FIXED_TASK_MINUTES 대신. (0.9.4) ZONE_NOT_CHECKED 는 뺐다 — MFC 는 온도대 자격을 쓰지 않는다(설계)'
          items: { type: string }
        assignments: { type: array, description: 확정 뒤 만든 배정, items: { $ref: '#/components/schemas/Assignment' } }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        committedBy: { type: [string, 'null'] }
        committedAt: { type: [string, 'null'], format: date-time }
    OperationRestriction:
      type: object
      properties:
        restrictionId: { type: string }
        mfcId: { type: string }
        restrictionType: { type: string, enum: [INTAKE_STOP, CAPACITY_REDUCE] }
        state: { type: string, enum: [ACTIVE, LIFTED] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        approvalRef: { type: string }
        liftApprovalRef: { type: [string, 'null'] }
        reason: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        reducedCapacityUnits: { type: [integer, 'null'] }
        affectedOrderIds: { type: array, items: { type: string } }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
