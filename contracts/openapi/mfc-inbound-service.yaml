openapi: 3.1.0
info:
  title: mfc-inbound-service
  version: 0.27.0
  description: |
    0.27.0(2026-11-27, 요청 CO-3 ① — cdc-outbound 0.35.0): DC 에 인수된 공급 요청 TRF(출발 전)의 관리자 종결은 DC 미출발 취소가 먼저 — 취소되면 CLOSED, 피킹 시작 등 DC 거절은 409(DC 코드), 결과 불명 503.
    0.26.0(2026-11-27, mfc 시뮬 R-54): CDC 출발(TOUT)을 받지 못한 예정도 센터 관리자 종결(`closures`) — CDC 에는 알리지 않는다(`closure.cdcNotifyRequired` false).
    0.24.1(2026-11-27): 보급 DC 이관 호출(cdc-outbound transfer-intakes)의 읽기 시간 제한 15초(기본 5초 — 인수·할당이 길면 UNKNOWN_RESULT 로 재시도 1분 늦던 것). API 모양은 그대로.
    MFC 입고 작업(RECEIVE/INSPECT/PUTAWAY Task)·InboundPromise(TRF·TOUT·ETA 투영)·수령 사실·수령 차이·회수품 반입·로컬 공급 요청(WK-14)의 정본. (docs/architecture/service-map.md §5)
    비정본: 수량(mfc-inventory에 ConfirmReceipt 요청 후 commitId 수신), 수령창·수용량(mfc-capacity), 품질 판정(mfc-quality), 공급 승인(replenishment).
    (0.23.0, 2026-11-26 ADR-0091 — 사용자 "자동보충 만들어" → "추천 자동 발주 + 승인") ① 자동 발주 초안: 매일(06:00 Asia/Seoul, `pmart.inbound.auto-supply-enabled`) 센터마다
      최근 28일에 판 SKU 의 발주 추천 수량으로 공급 요청 SUBMITTED(`submittedBy` SYSTEM, `recommendationRef` AUTO-<센터>-<날짜>, 하루 한 번, 미해결 요청 SKU 는 뺌). 시험·수동 실행 `POST /internal/auto-supply-runs`.
      ② (R-27, DC 시뮬레이터 2026-11-26) 승인(그대로 센터 관리자)되면 보급 DC(`pmart.inbound.supplying-cdc`)가 정해진 경우 MFC 초기 입고(RCV-SR)를 만들지 않고 이관(TRF) 요청을
      cdc-outbound `/internal/transfer-intakes` 로 보내고(trfVersion 1, approvalRef = 요청 ID, deadlineMeaning READY, dueAt = requestedReadyAt — 지났으면 승인 + 1일,
      conditions TEMPERATURE_ZONE) 입고 예정(EXPECTED, fromCdc)을 바로 만든다. **온도대(mfc-inventory SKU 사본 storageType)가 섞이면 TRF 를 온도대마다 나눈다**
      (`transfers`, 모르는 SKU 가 있으면 승인 422 `STORAGE_TYPE_UNKNOWN`, SKU 사본 조회 실패는 503). 보급 DC 가 없으면 예전처럼 `linkedReceiptId`(initial_stock_load).
    (0.22.0, 2026-11-26 요청 MI-5 — 사용자 "구현해"·"전부 여기서") CDC 이관 입고 종결 — 재고 반영(TIN_POSTED)이면 자동 종결(수령은 TRF 하나에 한 번), 오지 않은 이관은 센터 관리자
      `POST /inbound-promises/{trfId}/closures`(→ CLOSED). 종결은 cdc-inventory `POST /internal/transit-closures` 로 알린다(트랜잭션 밖·재시도). 예정 응답 `closure`.
    InboundPromise: EXPECTED→RECEIVING→TIN_POSTED (0.22.0 EXPECTED·RECEIVING→CLOSED 관리자 종결). SupplyRequest(로컬): DRAFT→SUBMITTED→ACKNOWLEDGED / WITHDRAWN, (0.21.0) SUBMITTED→APPROVED / REJECTED(센터 관리자).
    (0.8.0) 입고 예정(`/inbound-promises/*`, CDC→MFC 송장 TRF)의 TRF 규칙(작업 ID·라벨·차이 사유)은 클라이언트 BR-53(2026-11-13)에서 정했고 0.16.0 구현이 그대로 따른다.
    현장 표시용 상품명(`productName` — 상품 관리용 명칭)·바코드(`barcodes`)는 mfc-inventory SKU 사본에서 채운다. 모르면 null·빈 배열(목록은 실패하지 않는다).
    (0.9.0, 클라이언트 BR-52 R2·R19-1) 이동 지시(`MoveOrder`)에도 productName·barcodes. 품질검사·적치 작업은 mfc-capacity 다음 작업 받기 후보 —
    배정(`AssignmentPublished`)이 오면 `assigneeId` 를 기록하고, 담당이 있으면 담당만 실행한다(409 `NOT_ASSIGNEE`, 이동 지시와 같음).
    서비스 간 조회(mfc-capacity)는 `withLabels=false` 로 상품명·바코드 조회를 건너뛴다(동기 호출 2 hop).
    0.10.0(2026-11-17, 작업자 오늘 업무 내역 — 요청 F-7 R3): `GET /internal/work-activities`(입고 수령·품질검사·적치·이동·회수품 반입 — mfc-capacity 가 모은다).
    0.11.0(2026-11-17, PDA 품질검사 판정 기준 — mfc-app BR-52 R18): `InboundTask.storageType·minRemainingDays·maxDaysSinceManufacture`(mfc-inventory SKU 사본 0.25.0).
    0.12.0(2026-11-18, 센터 관리자 웹 목록 — 요청 MB-1): `GET /supply-requests`·`GET /return-receipts` 목록, `GET /initial-stock-loads` 에 mfcId·state·쪽(approvalId 선택).
    0.13.0(2026-11-19, 반납 도착 대기 — 요청 MI-1·MI-2·MQ-1): `ReturnDelivered`(delivery.delivery.v1) 구독 → 센터별 **반납 도착 대기** `GET /return-arrivals`(고객 반품 CLAIM_RETURN·오배송 회수 MISDELIVERY_RECOVERY·전달 실패 반납 FAILED_DELIVERY_RETURN). 반입 `POST /return-receipts` 에 `arrivalId` — 클레임·회수 ID·주문·주문 줄 번호를 대기 건에서 채우고(줄 생략 가능), 반입하면 대기에서 빠진다. claim 이 없는 반납(오배송·전달 실패)도 반입(claimId 선택). `ReturnItemReceived` 에 purpose·caseId·originDeliveryId·arrivalId, 줄 orderLineId.
    0.14.0(2026-11-19, [LAN 시험 전용] 시험 입고 예정 — 요청 MI-3·MFC 시뮬레이터 R-23): `POST /dev-initial-stock-loads` — 설정 `pmart.inbound.dev-arrivals.enabled` 가 켜진 곳에서만(그 밖 404). INITIAL_STOCK 승인이 만드는 것과 같은 입고 예정(EXPECTED, approvalId `DEV-…`) 하나 → 그 뒤는 지금 흐름 그대로(현장 수령 → 품질검사 → 적치). 정식 입고가 생기면 없앤다.
    0.15.0(2026-11-20, PDA BR-52 R12·R18·R19 — mfc-app): 회수품 검수 대기 `GET /return-receipts?inspectionState=PENDING`(오래된 순 — state 를 비우면 재고 반영 APPLIED 만), 반입·반납 대기 줄 `temperatureZone`(SKU 사본 보관 유형 — 조회 때),
      품질검사 결과 줄 `quarantineReason`·`evidenceRef`(격리 줄만 — 증빙 사진은 mfc-quality `POST /quality-evidence-photos`), 적치 작업 단건 `suggestedToLocations`(mfc-inventory placement-suggestions),
      현장 예외 보고 `POST /move-orders/{moveId}/exceptions`·`POST /inbound-tasks/{taskId}/exceptions`(적치)·목록 `GET /task-exceptions` — 기록만(재고·작업 상태는 그대로).
    0.16.0(2026-11-20, 입고 예정 구현 — 사용자 결정 "먼저 만들어"): `/inbound-promises/*` 501 해제. 원천 사건 replenishment `TransferApproved`·`TransferChanged`·`TransferCancelled`
      (scm.replenishment.v1 — trfVersion 이 지금보다 크면만 반영), cdc-inventory `TransferDeparted`(cdc.inventory.v1 — 실물 사실, 출발 줄이 예정 수량), cdc-outbound
      `TransferShipmentManifestIssued`(cdc.outbound.v1 — LPN 목록 `packages`). **이 사건을 내는 서비스가 아직 없어 실서버 목록은 비어 있다.** 도착 등록 → `InboundArrivalRecorded`,
      수령 → mfc-inventory ConfirmReceipt(Idempotency-Key = receiptId) → 수령 줄마다 품질검사(INSPECT) 작업 → 적치(PUTAWAY) — 초기 보유 반입과 같은 작업 흐름(`/inbound-tasks?receiptId=`).
      예정과 수량이 다르면 `ReceiptDiscrepancyReported`. `InboundPromise` 에 fromCdc·trfVersion·deadlineMeaning·departedAt·shipmentManifestId·cancelReason·packages, 줄 expiryDate·temperatureZone, `Receipt.rejectReason`.
    0.17.0(2026-11-20, 사용자 결정 2026-11-20 3~6 — 요청 IV-6·PDA BR-52 R19-5·R19-7 후속): ① 반입·반납 대기 줄 `fresh`(온도대 CHILLED·FROZEN = true, AMBIENT = false, 모르면 null).
      ② 격리 이동 작업 `taskType: QUARANTINE_MOVE`(`origin` INSPECTION·RETURN·EXCEPTION) — 품질검사 격리 줄은 그 검수자, 회수품 검수 폐기(DISPOSE) 줄은 반입한 사람, 이동·적치 예외의
      파손·변질은 보고한 사람에게 미리 배정(`assigneeId`). 실행 `POST /inbound-tasks/{taskId}/quarantine-moves`(도착 = 격리 구역, mfc-inventory QUARANTINE_MOVE), 단건 `suggestedToLocations` = 격리 구역 칸.
      ③ 현장 예외가 재고에 반영된다(PICK 결품처럼): SHORT·BLOCKED = 분실 조사 보류, DAMAGED·SPOILED = 격리 + 격리 이동 작업. 이동·보충은 아직 집지 않은 몫(지시 수량 줄임), 적치는 작업 잔량(`exceptedQty`).
      `qty` 를 생략하면 남은 양 전부. `TaskException` 에 `applyStatus`·`inventoryCommitId`·`quarantineTaskId`·`rejectReason`.
      ④ 해제된 격리품 적치(`origin: RELEASE`) — mfc-quality `QualityDecisionMade`(RELEASE) 마다 그 LOT 이 아직 적치 전(NORMAL·UNSTOWED)으로 남은 칸에서 PUTAWAY 작업(사건 줄마다 한 번).
    0.18.0(2026-11-20, 사용자 결정 2026-11-20 B — mfc-inventory 0.37.0 위): 수령장(적치 전) 분실 조사 보류를 센터 관리자가 재고 정정(`holdResolutions`)으로 정리하면
      mfc-inventory `StockHoldResolved`(mfc.inventory.v1) 의 찾은 양(foundQty)마다 그 칸·LOT 에서 **적치(PUTAWAY) 작업**(`origin: HOLD_FOUND`) — 보류를 만든 적치 예외가 이 서비스 것이면
      그 작업의 `receiptId` 를 이어받고(아니면 정정 요청 키), 담당 없음(다음 작업 받기로 배정). 사건 줄마다 한 번. 못 찾은 양은 재고에서 빠져 작업이 없다.
      회수품 검수 재판매(RESALE = 정상 판정)는 0.7.0 부터 이미 적치 작업(반품 위치 → 선반)이다 — 바뀐 것 없음.
    0.19.0(2026-11-21, 보충재고 칸 — MFC 시뮬레이터 R-30, 사용자 결정 2026-11-20 "선반칸이 가득차면 남는 건 입고 창고에", mfc-inventory 0.44.0 위): READY 적치 작업 단건에 `suggestedPlacements[{locationCode, qty}]`(나눠 넣기 — 그 상품 선반에 들어가는 만큼 → 기타 칸 → 보충재고 칸)·`suggestedUnplacedQty`(다 못 넣은 양 — 입고칸에 둔 채 작업을 열어 둔다. 공간이 없는 것이지 잃어버린 것이 아니므로 적치 예외 보고 대상이 아니다). 적치 실행은 그대로(칸마다 한 번씩 putaways). 추가만.
    0.20.0(2026-11-21, 작업자 도면 위치 — mfc-backoffice 요청): `GET /internal/worker-last-locations?mfcId&since` — 작업자마다 마지막 스캔 칸(적치·격리 칸·품질검사 칸·수령 칸·이동 출발/도착 칸)과 시각. mfc-capacity 가 모은다. 추가 경로만.
    0.21.0(2026-11-24, 센터 발주 승인·발주 수량 추천 — 요청 MI-4, MFC 시뮬레이터 R-48, 사용자 결정 "B"): SCM(replenishment·demand-planning)이 생기기 전 **임시로 센터 안에서**.
      ① 공급 요청(여러 줄)을 그 센터 MFC_SUPERVISOR 가 승인 `POST /supply-requests/{id}/approvals`(줄별로 줄이기 = 부분 승인 — 사유 필수) 또는 거절 `…/rejections`(사유 필수).
      승인되면 승인 수량 0 초과 줄로 **입고 예정(EXPECTED)** 하나 — `GET /initial-stock-loads?mfcId=&state=EXPECTED` 의 그 모양(`approvalId` = supplyRequestId, `linkedReceiptId`), 수령·품질검사·적치는 지금 흐름 그대로.
      승인은 approval-service 를 거치지 않는다(Q-15 는 SCM 전까지 센터 관리자 — 센터 안에서 끝낸다).
      ② 발주 수량 추천 `GET /supply-recommendations?mfcId&storageType&sku` — S = d × (R + L) + SS, IP = 판매 가능 A + 입고 예정, Q = 올림(max(0, S − IP), 발주 배수) ≥ 최소 발주량.
      d = 센터 안 인계 실적(mfc-inventory `PackageHandedOverPosted`) 이동평균(임시 — demand-planning 이 생기면 그 예측). R·L·SS·배수·최소 발주량은 공급 정책 표(센터·온도대, 없으면 전 센터 기본)이고
      값이 없으면 추천하지 않고 `reason`(0·무제한으로 채우지 않는다). 시작값(사용자 확인 2026-11-24, 승인 전 — 운영값 아님): R 1일·L 1일·SS 1일치·배수 1·최소 1, 이동평균 28일·최소 이력 7일.
    0.21.1(2026-11-24, 버그 — LAN 에서 `GET /supply-recommendations` 가 늘 500): mfc-inventory `/internal/availability` 의 `asOf` 를 계약대로 AsOf 객체(`{asOf, sourceVersion, freshness}`)의 `asOf` 로 읽는다(전에는 문자열로 읽어 실패). 계약 모양은 그대로.
    0.24.0(2026-11-27, 운송 도착 → 입고 예정 자동 도착 — 사용자 "DC 에서 MFC 도착을 누르면 MFC 에 도착이 떠야"): transport-execution `StopArrived`(tms.trip.v1, 요청 TE-1)를 구독해 trfIds 마다 그 센터 입고 예정이 EXPECTED 면
      RECEIVING(`arrivedAt` = 사건 도착 시각, `tripId`, 기록자 `SYSTEM:transport-execution`) + `InboundArrivalRecorded`(행위자 SYSTEM). 현장 도착 등록 `POST …/arrivals` 는 그대로(이미 RECEIVING 이면 409). API 모양은 그대로.
    0.25.0(2026-11-27, TRF·Wave 화면 번호 — mfc 시뮬 R-52, 사용자 "TRF·WAVE 식별값 말고 T286575 W6307 로"): `InboundPromise`·`SupplyRequest.transfers[]` 에 `trfNumber`·`waveId`·`waveNumber`(정본 cdc-outbound,
      표시용 사본 — 모르면 null). 출발 매니페스트·출발 사건에 실려 오면 그 값, 공급 요청 TRF 는 DC 인수 직후, 끝나지 않은 예정은 상세(`GET /inbound-promises/{trfId}`)를 열 때 비어 있으면 cdc-outbound 인수 조회로 채운다(예정 version 은 안 바뀜). 추가만.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: moves, description: '재고 위치 이동 지시·실행(IV-03, 0.5.0)' }
  - { name: inbound-tasks, description: 입고 작업(품질검사·적치) — 현장 실행 사실 → mfc-inventory 반영(IV-13) }
  - { name: inbound-promises, description: 입고 예정·도착·수령 }
  - { name: supply-requests, description: 로컬 공급 요청 WK-14 }
  - { name: return-receipts, description: 회수품 실물 반입 }
  - { name: internal, description: 서비스 간 (초기 보유 반입) }
  - { name: initial-stock-loads, description: 초기 보유 반입 결과 (운영자 조회) }

paths:
  /inbound-promises:
    get:
      tags: [inbound-promises]
      summary: 입고 예정 조회 (센터·일자·상태)
      description: |
        (0.16.0) 그 센터 운영자(다른 센터 403). `state` 를 비우면 끝나지 않은 것(EXPECTED·RECEIVING). `date` = 예정 도착(plannedArrivalAt, 없으면 출발 시각)의 Asia/Seoul 날짜.
        예정 도착이 이른 순 → trfId 순. `page.nextCursor` 를 다음 `cursor` 로. 원천 사건(replenishment·cdc)이 없으면 빈 목록이다.
      operationId: listInboundPromises
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: date, in: query, schema: { type: string, format: date, description: Asia/Seoul 예정 도착일 } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/InboundPromiseState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundPromise' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /inbound-promises/{trfId}:
    get:
      tags: [inbound-promises]
      summary: 입고 예정 상세 (도착·수령·TIN 반영 상태)
      operationId: getInboundPromise
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundPromise' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /inbound-promises/{trfId}/arrivals:
    post:
      tags: [inbound-promises]
      summary: 도착 등록 (차량 도착·하차 시작, InboundArrivalRecorded)
      description: |
        TMS 인계 증빙(TransportHandoverEvidenceRecorded)과 연결한다. EXPECTED→RECEIVING.
        (0.8.0) 송장(TRF) 라벨 스캔 값 = `TRF:{trfId}:{version}`(라벨 스캔 형식 `{유형}:{id}:{버전}` — 포장 `PKG:` 와 같은 규칙). 맞는 송장인지는
        `trfId` 만 비교한다(버전은 라벨 인쇄 때 값이라 지금 예정 version 과 다를 수 있다). 라벨 인쇄는 출발 센터(CDC) 쪽 몫이다.
        (0.16.0) 그 센터 운영자. EXPECTED 일 때만(아니면 409 INVALID_STATE — 취소·이미 도착), `X-Expected-Version` 이 다르면 409 VERSION_CONFLICT.
        기록자는 토큰 사용자(본문 `recordedBy` 는 쓰지 않음). 202 resultId = trfId, version = 바뀐 예정 version. TMS 인계 증빙 연결은 `evidenceRef` 값을 남기기만 한다.
      operationId: recordArrival
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arrivedAt]
              properties:
                arrivedAt: { type: string, format: date-time }
                tripId: { type: string }
                unloadingBayReservationId: { type: string }
                evidenceRef: { type: string, description: TMS 인계 증빙 참조 }
                recordedBy: { type: string }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /inbound-promises/{trfId}/closures:
    post:
      tags: [inbound-promises]
      summary: (0.22.0, MI-5) 입고 종결 — 오지 않은 CDC 이관을 "더 받을 것 없음"으로 (센터 관리자)
      description: |
        그 센터 MFC_SUPERVISOR(아니면 403). EXPECTED·RECEIVING 이고 재고 반영 전 수령이 없을 때만 — 아니면 409 INVALID_STATE.
        (0.26.0, R-54) CDC 출발(TOUT — `departureId`)을 받지 못한 예정(시험 송장·출발 전 멈춘 TRF)도 종결한다 — 이때는 CDC 에 알리지 않는다(`closure.cdcNotifyRequired` false).
        (0.27.0, CO-3 ①) 그 예정이 공급 요청 TRF(ADR-0091)면 먼저 cdc-outbound 미출발 취소(FULL, 피킹 시작 전만)를 부른다 — 취소됨(또는 DC 에 없음)일 때만 CLOSED(`closure.cdcCancelRequestId`).
        DC 거절은 409 + DC 코드 그대로(PICKING_STARTED — 물건이 오니 받아야 함, INVALID_STATE·ALLOCATION_IN_PROGRESS·CANCELLATION_IN_PROGRESS·VERSION_CHANGE_IN_PROGRESS, CDC_CANCEL_REJECTED = DC 재고 거절),
        결과 불명 503 UNKNOWN_RESULT(같은 Idempotency-Key 로 다시), DC 장애 503 DEPENDENCY_UNAVAILABLE. 아직 DC 에 못 보낸 이관은 보내지 않게 멈춘다.
        사유 필수(400). 예정은 CLOSED(더 수령하지 않음) — 재고 반영(TIN_POSTED)된 예정은 이 API 없이 자동 종결된다.
        종결은 cdc-inventory `POST /internal/transit-closures`(TRF 하나에 한 번)로 바로 알리고, 실패하면 1분부터 두 배(최대 30분)로 다시 보낸다(응답 `closure.cdcNotifiedAt`).
        CDC 는 이 기록이 있어야 남은 미정산을 운송 손실로 닫는다. 같은 Idempotency-Key 는 같은 결과. 202 resultId = trfId, version = 바뀐 예정 version.
      operationId: closeInboundPromise
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-26'
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, description: 종결 사유(예 차량 사고로 미도착) }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /inbound-promises/{trfId}/receipts:
    post:
      tags: [inbound-promises]
      summary: 수령 등록 → mfc-inventory ConfirmReceipt (정상/격리/미판정 수량)
      description: |
        receiptId를 발급하고 mfc-inventory.ConfirmReceipt 로 TIN을 요청한다. 수량 성공은 inventory commitId로만 확정.
        예정 수량과 차이가 있으면 ReceiptDiscrepancyReported 발행(case 구독). 응답 불명이면 UNKNOWN_RESULT, GET …/receipts/{receiptId}로 해소.
        (0.16.0 구현) 그 센터 운영자. RECEIVING(도착 등록 뒤)이고 출발(TOUT, `departureId`)을 받은 예정만 — 아니면 409 INVALID_STATE(TOUT 보다 수령이 먼저면 원출발 확인 대기, IV-02).
        진행 중 수령(재고 반영 전)이 있으면 409 INVALID_STATE. 줄마다 `toLocationCode`(수령 위치) 필수, SKU 는 그 예정에 있는 것만, SKU 별 인수 합(정상+격리+보류)은
        출발 수량 이하(초과분은 정상 TIN 에 넣지 않는다 — IV-02, 400). `lotId`(CDC LOT 표기 → inventory sourceLotRef)를 비우면 그 SKU 의 출발 LOT 이 하나일 때 그 값·소비기한으로 채운다.
        응답 status: APPLIED(재고 반영 — 예정 TIN_POSTED, 수령 줄마다 **품질검사(INSPECT) 작업**(정상+보류 수량) → 검사 뒤 **적치(PUTAWAY) 작업** — 초기 보유 반입과 같은 작업 흐름,
        `GET /inbound-tasks?mfcId=&receiptId=`), REJECTED(재고 거절 — 예정은 RECEIVING 그대로, 고쳐서 새 키로 다시), UNKNOWN_RESULT(같은 Idempotency-Key 로 다시 보내면 같은 receiptId 로 재시도).
        격리 수량은 inventory 에서 바로 격리(QUARANTINED)라 품질검사 작업을 만들지 않는다. 차이(discrepancies)는 SKU 별 출발 수량 ≠ 인수 합인 줄 — 사유는 그 SKU 줄의 `discrepancyReason`, 없으면 NOT_RECEIVED·SHORT.
      operationId: recordReceipt
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordReceiptRequest' }
      responses:
        '202':
          description: 접수 (resultId = receiptId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: INVALID_STATE (도착 미등록·이미 TIN_POSTED) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /inbound-promises/{trfId}/receipts/{receiptId}:
    get:
      tags: [inbound-promises]
      summary: 수령 결과 조회 (inventory 반영 상태·commitId·차이)
      operationId: getReceipt
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: trfId, in: path, required: true, schema: { type: string } }
        - { name: receiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /supply-requests:
    get:
      tags: [supply-requests]
      summary: '[운영자] 공급 요청 목록 (0.12.0, MB-1)'
      description: |
        센터 관리자 웹 입고 > 공급 요청. 그 센터 운영자(단건과 같다). `state` 반복, 비우면 끝나지 않은 것(DRAFT·SUBMITTED·ACKNOWLEDGED) — 철회(WITHDRAWN)·(0.21.0) 승인(APPROVED)·거절(REJECTED)은
        state 로 고를 때만. 최근 제출 순, 커서 = 마지막 supplyRequestId, size ≤ 200. 항목은 단건과 같다.
      operationId: listSupplyRequests
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [DRAFT, SUBMITTED, ACKNOWLEDGED, WITHDRAWN, APPROVED, REJECTED] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SupplyRequest' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [supply-requests]
      summary: 로컬 공급 요청 제출 WK-14 (SupplyRequestSubmitted → replenishment)
      description: 승인은 replenishment-service. 본 서비스는 요청 원장만 보유. 제출 즉시 SUBMITTED, replenishment 수신 확인 시 ACKNOWLEDGED.
      operationId: createSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyRequestBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRequest' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /supply-requests/{supplyRequestId}:
    get:
      tags: [supply-requests]
      summary: 공급 요청 조회
      operationId: getSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: supplyRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [supply-requests]
      summary: 공급 요청 변경 (SUBMITTED 이전 또는 ACKNOWLEDGED 전까지, 새 버전)
      operationId: updateSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: supplyRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyRequestBody' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRequest' }
        '409':
          description: INVALID_STATE (ACKNOWLEDGED 이후 변경 불가 → 철회 후 재요청) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /supply-requests/{supplyRequestId}/withdrawals:
    post:
      tags: [supply-requests]
      summary: 공급 요청 철회 (→ WITHDRAWN)
      operationId: withdrawSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: supplyRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (이미 이관 승인됨 → replenishment에서 취소)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /supply-requests/{supplyRequestId}/approvals:
    post:
      tags: [supply-requests]
      summary: '[센터 관리자] 공급 요청 승인 (0.21.0, MI-4) — SUBMITTED → APPROVED + 입고 예정(EXPECTED)'
      description: |
        그 센터 MFC_SUPERVISOR(요청한 사람이어도 된다 — Q-15 는 SCM 전까지 센터 관리자). `lines` 에 없는 줄은 요청 수량 그대로 승인, 있으면 0 ~ 요청 수량.
        하나라도 요청보다 줄이면(부분 승인) `note`(사유) 필수. 모든 줄이 0 이면 거절(`…/rejections`)로 한다 — 400.
        승인 수량 0 초과 줄로 입고 예정 하나(`linkedReceiptId` — `GET /initial-stock-loads?approvalId={supplyRequestId}`)를 같은 트랜잭션에서 만든다.
      operationId: approveSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: supplyRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [sku, approvedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      approvedQty: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 500, description: 승인 메모 — 부분 승인이면 필수(줄인 사유) }
      responses:
        '200':
          description: 승인됨(같은 키·같은 본문 재요청은 같은 결과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRequest' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (SUBMITTED 가 아님) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: (0.23.0, R-27) STORAGE_TYPE_UNKNOWN — 보급 DC 이관인데 보관 온도대를 모르는 SKU 가 있음(TRF 를 온도대별로 나눌 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: (0.23.0) mfc-inventory SKU 사본 조회 실패(온도대를 알 수 없음) — 다시 시도
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /supply-requests/{supplyRequestId}/rejections:
    post:
      tags: [supply-requests]
      summary: '[센터 관리자] 공급 요청 거절 (0.21.0, MI-4) — SUBMITTED → REJECTED'
      operationId: rejectSupplyRequest
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: supplyRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 거절됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (SUBMITTED 가 아님) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /supply-recommendations:
    get:
      tags: [supply-requests]
      summary: '[운영자] 발주 수량 추천 (0.21.0, MI-4 — 임시, SCM 전)'
      description: |
        그 센터 운영자. SKU 마다 추천 수량과 근거. 저장하지 않는 조회(부를 때마다 계산 — `calculatedAt`).
        S = d × (R + L) + SS(SS = d × safetyDays), IP = availableQty(mfc-inventory A = E − R, 예약 차감) + expectedQty(입고 예정 — 초기 보유·승인된 발주의 EXPECTED, TRF 의 EXPECTED·RECEIVING),
        shortfallQty = max(0, S − IP), recommendedQty = 발주 배수로 올림, 0 보다 크면 최소 발주량 이상. 승인 전 요청(SUBMITTED)은 IP 에 넣지 않고 `pendingRequestedQty` 로만 보인다.
        d = 어제(Asia/Seoul)까지 `historyDays` 일 동안의 인계 실적 합 ÷ historyDays — historyDays = min(이동평균 기간, 센터 첫 인계일부터 어제까지). 품절 날을 빼지 않는다(임시 — 품절 판정은 demand-planning).
        추천하지 않을 때 `recommendedQty` null + `reason`. `storageType` 을 주면 그 온도대 SKU 만(온도대를 모르는 SKU 는 STORAGE_TYPE_UNKNOWN 으로 남긴다). 재고 서비스가 응답하지 않으면 503.
      operationId: listSupplyRecommendations
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: storageType, in: query, schema: { type: string, enum: [AMBIENT, CHILLED, FROZEN] } }
        - name: sku
          in: query
          required: true
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 100, items: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplyRecommendations' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /return-receipts:
    get:
      tags: [return-receipts]
      summary: '[운영자] 회수품 반입 목록 (0.12.0, MB-1)'
      description: |
        센터 관리자 웹 입고 > 회수품 반입. 그 센터 운영자(단건과 같다). `from`·`to`(반입 시각 [from, to), 둘 다 선택), `state`(재고 반영 상태, 비우면 전부).
        최근 반입 순, 커서 = 마지막 returnReceiptId, size ≤ 200. 항목은 단건과 같다(검수 상태 inspectionState 포함).
      operationId: listReturnReceipts
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT] } }
        - name: inspectionState
          in: query
          required: false
          schema: { type: string, enum: [PENDING, INSPECTED] }
          description: |
            (0.15.0, PDA BR-52 R12) 검수 상태로 거른다. 주면 **오래된 반입 순**(검수 대기 큐 — 커서도 그 순서). `state` 를 비우면 재고 반영된(APPLIED) 반입만 —
            mfc-quality 가 검수할 수 있는 것은 반영된 반입뿐이다(`ReturnItemReceived`). 검수 대기 = `inspectionState=PENDING`.
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReturnReceipt' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [return-receipts]
      summary: 회수품 실물 반입 등록 (→ mfc-inventory H+q·Q+q, ReturnItemReceived → quality 검수 대기)
      description: |
        0.7.0(2026-11-08, IV-10 — 사용자: "환불 격리로 뒀다가 품질 검수, 적격이면 재배치"). 회수품은 반품 위치(toLocationCode, RETURN 구역)에
        **격리(QUARANTINED)로만** 들어간다(판매 가능 아님, IV-10 "실제 인수는 격리 증가"). inventory 수령(receiptId = returnReceiptId, trfId = claimId,
        departureId = returnPickupId, quarantinedQty = qty)이 반영되면 `ReturnItemReceived`(줄별 inventory lot·위치) → mfc-quality 회수품 검수.
        검수 RESALE 분은 `ReturnInspected` 를 받아 적치(PUTAWAY) 작업을 만든다(진열 규칙대로 선반에 재배치). LOT: sourceLotRef(없으면 `RET-<claimId>`)·
        expiryDate 로 추적 LOT. 그 센터 운영자(작업자·센터 관리자). 같은 Idempotency-Key 는 같은 반입. 결과: APPLIED / REJECTED(재고 거절) / UNKNOWN_RESULT(같은 키로 다시).
      operationId: recordReturnReceipt
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, toLocationCode]
              description: |
                (0.13.0) `arrivalId`(반납 도착 대기 건)를 주면 claimId·returnPickupId·orderId·주문 줄 번호를 그 건에서 채운다 — 본문에 같이 주면 같아야 한다(다르면 400).
                `lines` 를 생략하면 대기 건의 줄 그대로(상품 코드가 없는 줄이 있으면 400 — 줄을 보낸다). 줄에 orderLineId 가 없으면 같은 상품의 대기 줄에서 차례로 채운다
                (같은 상품이 두 주문 줄이면 수량대로 나눈다 — MQ-1). 이미 반입된 대기 건은 409 `ARRIVAL_ALREADY_RECEIVED`(재고 거절된 반입이면 다시 받을 수 있다).
                `arrivalId` 가 없으면 예전처럼 claimId·returnPickupId·lines 필수(400).
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                toLocationCode: { type: string, description: '반품 위치(RETURN 구역, 예 RTN-A-01) — 격리로 들어감' }
                arrivalId: { type: string, description: '(0.13.0) 반납 도착 대기 건 — GET /return-arrivals 의 arrivalId(= 회수 배송 ID)' }
                claimId: { type: string, description: '고객 반품 클레임. arrivalId 없으면 필수, 오배송·전달 실패 반납은 없음' }
                returnPickupId: { type: string, description: 'delivery 회수 ID (ReturnDelivered). arrivalId 없으면 필수' }
                orderId: { type: string }
                receivedAt: { type: string, format: date-time }
                receivedBy: { type: string }
                lines:
                  type: array
                  minItems: 1
                  description: 'arrivalId 가 있으면 생략 가능(대기 건 줄 그대로)'
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      orderLineId: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      sourceLotRef: { type: string, maxLength: 64, description: '상품 표기 LOT(없으면 RET-<claimId>)' }
                      expiryDate: { type: string, format: date, description: 소비기한(재판매 때 출하 기준 판정에 쓴다) }
                      conditionNote: { type: string, maxLength: 200 }
                      evidenceRef: { type: string }
      responses:
        '202':
          description: 접수 (resultId = returnReceiptId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /return-arrivals:
    get:
      tags: [return-receipts]
      summary: 반납 도착 대기 목록 (0.13.0, MI-2)
      description: |
        라이더가 MFC 에 반납한 회수품(`ReturnDelivered` — 고객 반품·오배송 회수·전달 실패 반납). 그 센터 운영자. 기본 `state=WAITING`(아직 반입 안 함, 오래된 순).
        고르면 `POST /return-receipts` 에 `arrivalId` 로 반입 → 대기에서 빠진다. 상품명은 표시용(조회 실패면 null).
      operationId: listReturnArrivals
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [WAITING, RECEIVED, ALL], default: WAITING } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReturnArrival' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /return-receipts/{returnReceiptId}:
    get:
      tags: [return-receipts]
      summary: 회수품 반입 조회 (inventory commitId·검수 상태)
      operationId: getReturnReceipt
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: returnReceiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnReceipt' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/initial-stock-loads:
    post:
      tags: [internal]
      summary: '[backoffice→inbound] 1차 초기 보유 반입 (오픈 시 초기 재고, approvalRef 필수)'
      description: |
        TRF 없이 센터 초기 재고를 반입한다. 내부적으로 receiptId를 발급해 mfc-inventory.ConfirmReceipt 로 전기한다.

        **미구현(501)**: 초기 보유 반입은 이 경로가 아니라 approval-service 의 INITIAL_STOCK 승인(ApprovalDecided, 토픽
        platform.approval.v1, targetService=mfc-inbound-service)으로 들어온다(결정 D2, 2026-10-30). 승인 행 attributes =
        `{ mfcId, sku, qty }`. 승인된 내용은 센터별 **입고 예정(EXPECTED)** 이 된다(2026-11-07 사용자 결정, ADR-0040 3단계 —
        승인만으로 재고를 만들지 않는다). 현장이 `POST /initial-stock-loads/{receiptId}/receipts` 로 실제 수령 수량·수령 위치를 넣으면
        PENDING → mfc-inventory ConfirmReceipt(trfId = INITIAL-<approvalId>, departureId = INITIAL, normalQty = 수령 수량)로 전기하고(APPLIED)
        품질검사(INSPECT) 작업을 만든다. 결과는 아래 조회 경로로 확인한다.
      operationId: loadInitialStock
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, approvalRef, lines]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                approvalRef: { type: string }
                loadedAt: { type: string, format: date-time }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lotId: { type: string }
                      expiryDate: { type: string, format: date }
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      toLocationCode: { type: string }
      responses:
        '202':
          description: 접수 (resultId = receiptId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / INVALID_STATE (센터가 초기 반입 단계 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/auto-supply-runs:
    post:
      tags: [internal]
      summary: '[서비스·시험] (0.23.0, ADR-0091) 자동 발주 초안 바로 실행'
      description: |
        매일 06:00 주기 작업과 같은 일을 지금 한다(꺼져 있어도 실행). `mfcId` 를 주면 그 센터만, 비우면 인계 실적이 있는 모든 센터.
        센터·날짜마다 한 번이라 같은 날 다시 부르면 만들지 않는다. 응답 = 이번에 만든 공급 요청 ID.
      operationId: runAutoSupply
      x-added-in: '2026-11-26'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
      responses:
        '200':
          description: 만든 요청
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplyRequestIds: { type: array, items: { type: string } }

  /internal/initial-stock-loads/{receiptId}:
    get:
      tags: [internal]
      summary: '[서비스] 초기 보유 반입 결과 조회 (receiptId)'
      operationId: getInitialStockLoad
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitialStockLoad' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /initial-stock-loads/{receiptId}/receipts:
    post:
      tags: [initial-stock-loads]
      summary: '[운영자·현장] 초기 보유 입고 예정의 실제 수령 — 상품·수량 확인, 수령 위치'
      description: |
        입고(수령)는 상품·수량만 확인한다. LOT·소비기한은 품질검사에서 나눈다(사용자 확인 2026-11-07).
        EXPECTED 인 기록만. SKU 는 승인된 줄이어야 하고 수령 수량 ≤ 승인 수량(초과 실물은 정상 수령에 합산하지 않는다, IV-02). 승인 줄 중
        빠진 SKU 는 0 으로 본다(미도착 — 차이로 남는다). 합계 0 이면 400. 접수되면 PENDING → 전기 작업이 mfc-inventory 에 수령을 전기하고
        수령 줄마다 품질검사 작업(INSPECT)을 만든다. 쓰기는 그 센터의 운영자.
      operationId: receiveInitialStock
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toLocationCode, lines]
              properties:
                toLocationCode: { type: string, maxLength: 64, description: 수령 위치(mfc-location 수령 구역) }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, receivedQty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      receivedQty: { type: integer, minimum: 0 }
      responses:
        '202':
          description: 접수 (resultId = receiptId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (EXPECTED 아님) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /inbound-tasks:
    get:
      tags: [inbound-tasks]
      summary: '[운영자·현장] 입고 작업 목록 (품질검사·적치)'
      operationId: listInboundTasks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { type: string, enum: [READY, COMPLETED] } }
        - { name: taskType, in: query, schema: { type: string, enum: [INSPECT, PUTAWAY, QUARANTINE_MOVE] } }
        - { name: receiptId, in: query, schema: { type: string } }
        - { name: withLabels, in: query, schema: { type: boolean, default: true }, description: '(0.9.0) false 면 productName·barcodes 를 채우지 않는다(서비스 간 조회용 — mfc-inventory 호출 생략)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InboundTask' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /inbound-tasks/{taskId}:
    get:
      tags: [inbound-tasks]
      summary: '[운영자·현장] 입고 작업 단건 (0.8.0)'
      operationId: getInboundTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: withLabels, in: query, schema: { type: boolean, default: true }, description: '(0.9.0) false 면 productName·barcodes 를 채우지 않는다(서비스 간 조회용 — mfc-inventory 호출 생략). (0.15.0) false 면 suggestedToLocations 도 빈 배열' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTask' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /inbound-tasks/{taskId}/inspections:
    post:
      tags: [inbound-tasks]
      summary: '[현장] 품질검사 결과 — 정상/격리 판정과 LOT 분리(제조 LOT 표기·소비기한)'
      description: |
        결과 줄마다 수량·판정(NORMAL/QUARANTINED)과, 확인한 제조 LOT 표기·소비기한을 넣는다(같은 표기·기한은 같은 LOT). 합계 ≤ 작업 잔량.
        현장 사실을 먼저 기록(CAPTURED)하고 mfc-inventory INSPECT 로 반영한다(IV-13). 반영되면(APPLIED) 정상 LOT 마다 적치(PUTAWAY)
        작업을 만든다. 거절이면 REJECTED(작업 잔량 그대로), 응답 불명이면 503 UNKNOWN_RESULT — 같은 Idempotency-Key 로 다시 보내면 같은
        실행 ID 로 다시 반영한다(inventory 가 한 번만 반영).
        (0.9.0) 담당(`assigneeId`)이 있으면 담당만 — 아니면 409 `NOT_ASSIGNEE`.
        (0.15.0) 부분 등록 허용 — 합계가 잔량과 같을 필요는 없다(남은 양은 작업이 READY 로 남는다). 판정 기준(`minRemainingDays`·`maxDaysSinceManufacture`·온도) 미달 줄의 NORMAL 은
        **서버가 거절하지 않는다** — 기준 미달 LOT 은 재고에 들어가도 예약·출하 적격 판정(같은 기준)에서 빠진다. 격리 강제는 PDA 몫(BR-52 R18 회신 2026-11-20).
        이 판정은 mfc-inbound → mfc-inventory INSPECT 로 바로 반영되고 mfc-quality 를 거치지 않는다(품질 판정 사건 없음). 격리분의 해제·폐기는 mfc-quality 판정(`/quality-decisions` RELEASE·`/disposal-approvals`).
      operationId: inspectInboundTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [qty, resultQuality]
                    properties:
                      qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
                      resultQuality: { type: string, enum: [NORMAL, QUARANTINED] }
                      sourceLotRef: { type: string, maxLength: 128 }
                      expiryDate: { type: string, format: date }
                      manufactureDate: { type: string, format: date, description: '검수에서 확인한 제조일(0.4.0, ADR-0041). 오늘(Asia/Seoul) 이후·소비기한 이후면 400. "N일 이내 제조" 보장 상품은 제조일이 있어야 주문에 배정된다' }
                      quarantineReason:
                        type: string
                        enum: [EXPIRY, MANUFACTURE, DAMAGED, TEMPERATURE, OTHER]
                        description: |
                          (0.15.0, PDA BR-52 R18-2) 격리 사유 — QUARANTINED 줄만(NORMAL 줄에 주면 400). 선택(서버는 강제하지 않는다 — PDA 가 격리에 사유·사진을 받는다).
                          EXPIRY 소비기한 기준 미달, MANUFACTURE 제조 후 경과일 초과, DAMAGED 파손·포장 이상, TEMPERATURE 온도 이탈, OTHER 그 밖. 실행 기록에 남는다(재고 반영 값은 아님).
                      evidenceRef:
                        type: string
                        maxLength: 64
                        description: '(0.15.0, R18-2) 증빙 사진 — mfc-quality `POST /quality-evidence-photos` 가 준 `evidenceRef`(EVQ-…). QUARANTINED 줄만(NORMAL 이면 400). 이 서비스는 참조만 저장한다(사진 확인은 하지 않음)'
      responses:
        '200':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTaskExecution' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /inbound-tasks/{taskId}/putaways:
    post:
      tags: [inbound-tasks]
      summary: '[현장] 적치 — 선반 위치·수량(이때부터 판매 가능)'
      description: |
        수량 ≤ 작업 잔량. 목적지 검사(등록·ACTIVE·선반/피킹 구역·온도대 = 보관 유형)는 mfc-inventory 가 한다. 처리 방식은 품질검사와 같다
        (CAPTURED → APPLIED / REJECTED / UNKNOWN_RESULT). 잔량이 0 이 되면 작업 COMPLETED.
        (0.9.0) 담당(`assigneeId`)이 있으면 담당만 — 아니면 409 `NOT_ASSIGNEE`.
      operationId: putawayInboundTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toLocationCode, qty]
              properties:
                toLocationCode: { type: string, maxLength: 64 }
                qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTaskExecution' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /inbound-tasks/{taskId}/quarantine-moves:
    post:
      tags: [inbound-tasks]
      summary: '[현장] 격리 이동 — 격리품을 격리 구역 칸으로 (0.17.0, IV-6)'
      description: |
        사용자 결정 2026-11-20: 격리품은 상온·냉장·냉동 각 격리 구역에 둔다. 하는 사람 — 회수품은 반입한 사람, 입고 결함은 찾은 검수자, 현장 예외의 파손·변질은 보고한 사람(작업 `assigneeId` 로 미리 배정).
        수량 ≤ 작업 잔량. 도착 검사(등록·ACTIVE·구역 QUARANTINE·온도대 = 보관 유형)는 mfc-inventory 가 한다(아니면 409 LOCATION_ZONE_MISMATCH·TEMPERATURE_ZONE_MISMATCH).
        처리 방식은 적치와 같다(CAPTURED → APPLIED / REJECTED / UNKNOWN_RESULT). 옮긴 뒤에도 mfc-quality 해제·폐기는 그대로 된다(재고가 격리 구역을 따라간다).
      operationId: quarantineMoveInboundTask
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toLocationCode, qty]
              properties:
                toLocationCode: { type: string, maxLength: 64, description: 격리 구역 칸(예 QRT-C-01) }
                qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InboundTaskExecution' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /inbound-tasks/{taskId}/exceptions:
    post:
      tags: [inbound-tasks]
      summary: '[현장] 적치 예외 보고 — 출발 칸에 없음·모자람·파손·변질·칸 못 씀 (0.15.0, PDA BR-52 R19-7)'
      description: |
        PICK 결품 보고(`shortage.reason`)와 같은 사유 값. (0.17.0, 사용자 결정 2026-11-20) **재고에 반영한다** — 작업의 출발 칸(적치 전 NORMAL·UNSTOWED)에
        SHORT·BLOCKED = 분실 조사 보류(그 양은 적치 못 함), DAMAGED·SPOILED = 격리 + 보고한 사람에게 격리 이동 작업(`quarantineTaskId`). 작업 잔량에서 그 양을 빼(`exceptedQty`) 0 이면 COMPLETED.
        `qty` 생략 = 남은 양 전부, 남은 양 초과 409 TASK_QTY_EXCEEDED. 재고 거절은 그 코드로(409·422), 결과 모름은 503/UNKNOWN_RESULT — 같은 Idempotency-Key 로 다시.
        적치(PUTAWAY) 작업의 READY 일 때만(품질검사 작업은 격리 판정으로 — 409 INVALID_STATE). 담당이 있으면 담당만(409 `NOT_ASSIGNEE`). 그 센터 운영자.
        센터 관리자는 `GET /task-exceptions` 로 본다.
      operationId: reportInboundTaskException
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExceptionRequest' }
      responses:
        '201':
          description: 반영됨(같은 Idempotency-Key 는 같은 기록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskException' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /task-exceptions:
    get:
      tags: [moves]
      summary: '[운영자] 현장 예외 보고 목록 — 이동·보충·적치 (0.15.0, PDA BR-52 R19-7)'
      description: 그 센터 운영자. 최근 보고 순, 커서 = 마지막 exceptionId, size ≤ 200. `from`·`to` 는 보고 시각 [from, to).
      operationId: listTaskExceptions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskException' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /dev-initial-stock-loads:
    post:
      tags: [initial-stock-loads]
      summary: '[LAN 시험 전용] 승인 없이 시험 입고 예정 하나 (0.14.0, MI-3)'
      description: |
        MFC 시뮬레이터가 실서버로 주문·가상 작업자를 계속 돌리면 재고가 바닥난다 — 재고를 채우는 시험 입구(요청 MI-3, 시뮬레이터 R-23 "정식 구현은 아니고 mfc 재고를 채우는 기능만").
        **설정 `pmart.inbound.dev-arrivals.enabled=true` 인 곳에서만**(LAN). 꺼져 있으면 404 NOT_FOUND — 운영 설정에는 넣지 않는다.
        만드는 것 = INITIAL_STOCK 승인이 만드는 것과 같은 **입고 예정(EXPECTED)** 하나(approvalId `DEV-<8자리>`). 재고는 지금 흐름 그대로:
        현장 수령 `POST /initial-stock-loads/{receiptId}/receipts`(그 센터 운영자 — 가상 작업자 토큰 가능) → 품질검사 → 적치. 조정(`/internal/adjustments`)으로 넣지 않는다(seed 원칙 D2).
        그 센터 운영자. 줄 1~40, SKU 당 1~500, 같은 SKU 두 번 400, mfc-inventory SKU 사본에 없는 SKU 400 `UNKNOWN_SKU`(details 에 SKU). 같은 Idempotency-Key = 같은 입고 예정.
      operationId: createDevInitialStockLoad
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, lines]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                lines:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      qty: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '201':
          description: 입고 예정(EXPECTED) — 현장 수령을 기다린다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitialStockLoad' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /initial-stock-loads:
    get:
      tags: [initial-stock-loads]
      summary: '[운영자] 초기 보유 반입 결과 조회 (INITIAL_STOCK 승인 ID 로)'
      description: |
        INITIAL_STOCK 승인 하나는 센터(mfcId)별 반입 기록 하나 이상이 된다. 승인 내용이 올바르지 않으면 반입 기록 하나가 REJECTED(사유)로 남는다.
        승인 이벤트 수신 전이면 items 가 비어 있다(404 아님). 운영자 토큰이면 조회할 수 있다.
        (0.12.0, MB-1 — 센터 관리자 웹 입고 > 초기 보유 수령 대기) `mfcId` 로 찾으면 그 센터 운영자만, `state` 반복·비우면 끝나지 않은 것(EXPECTED·PENDING),
        만든 순(오래된 것부터), 커서 = 마지막 receiptId, size ≤ 200. approvalId 로 찾을 때는 예전대로(쪽 없음, state 무시).
      operationId: listInitialStockLoads
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: approvalId, in: query, required: false, schema: { type: string }, description: '승인 ID 로(예전 방식) — 운영자면 조회' }
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' }, description: '(0.12.0, MB-1) 센터로 — 그 센터 운영자. approvalId 나 mfcId 중 하나는 필수(없으면 400)' }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [EXPECTED, PENDING, APPLIED, REJECTED] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InitialStockLoad' } }
                  nextCursor: { type: [string, 'null'], description: '(0.12.0) mfcId 로 찾을 때만' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /move-orders:
    get:
      tags: [moves]
      summary: 재고 이동 지시 목록 (IV-03, 0.5.0)
      description: 그 센터 운영자. 기본은 진행 중(ACTIVE·CANCEL_PENDING).
      operationId: listMoveOrders
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: state, in: query, schema: { type: string, enum: [ACTIVE, CANCEL_PENDING, COMPLETED, CANCELLED] } }
        - { name: withLabels, in: query, schema: { type: boolean, default: true }, description: '(0.9.0) false 면 productName·barcodes 를 채우지 않는다(서비스 간 조회용 — mfc-inventory 호출 생략)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MoveOrder' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [moves]
      summary: 재고 이동 지시 — 센터 관리자 (IV-03, 0.5.0)
      description: |
        2026-11-08 사용자 결정: MFC 선반 간 재고 이동은 **센터 관리자가 지시**하고 작업자가 두 단계(출발 칸 → 카트 → 도착 칸)로 실행한다(CDC 는 시스템 지시).
        그 센터 MFC_SUPERVISOR. mfc-inventory 이동 배정(출발 물량·도착 공간, 칸당 한 상품·한 상품 한 자리·용량)을 먼저 잡고 지시를 남긴다 — 거절은 inventory 의 코드 그대로.
        같은 Idempotency-Key 는 같은 이동(moveId 가 키에서 정해진다).
      operationId: createMoveOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, sku, lotId, fromLocation, toLocation, qty]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { type: string }
                lotId: { type: string }
                fromLocation: { type: string }
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 200 }
                urgent: { type: boolean, description: '(0.7.1) 긴급 — 다음 작업 받기에서 자동 보충과 같은 순위(사용자 결정 2026-11-08). 기본 false' }
      responses:
        '201':
          description: 지시됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /move-orders/{moveId}:
    get:
      tags: [moves]
      summary: 재고 이동 지시 한 건 (0.5.0)
      operationId: getMoveOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - { name: withLabels, in: query, schema: { type: boolean, default: true }, description: '(0.9.0) false 면 productName·barcodes 를 채우지 않는다(서비스 간 조회용 — mfc-inventory 호출 생략)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /move-orders/{moveId}/pickups:
    post:
      tags: [moves]
      summary: 집어 올리기 — 출발 칸 → 카트 (작업자, 0.5.0)
      description: 그 센터 MFC_WORKER·MFC_SUPERVISOR. 카트 식별번호(CART 위치 코드)를 찍는다. 같은 Idempotency-Key 는 한 번(inventory 실행 ID).
      operationId: pickUpMoveOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartLocation, qty]
              properties:
                cartLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /move-orders/{moveId}/drops:
    post:
      tags: [moves]
      summary: 내려놓기 — 카트 → 도착 칸(취소 뒤에는 출발 칸으로 되돌리기) (작업자, 0.5.0)
      operationId: dropMoveOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toLocation, qty]
              properties:
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /move-orders/{moveId}/cancellations:
    post:
      tags: [moves]
      summary: 이동 지시 취소 — 센터 관리자 (0.5.0)
      description: 집지 않은 몫만 풀린다. 카트에 남은 물건은 내려놓아야 끝난다(CANCEL_PENDING → CANCELLED).
      operationId: cancelMoveOrder
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 취소됨(또는 카트 정리 대기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveOrder' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
  /move-orders/{moveId}/exceptions:
    post:
      tags: [moves]
      summary: '[현장] 이동·보충 예외 보고 — 출발 칸에 없음·모자람·파손·변질·칸 못 씀 (0.15.0, PDA BR-52 R19-7)'
      description: |
        PICK 결품 보고(`shortage.reason`)와 같은 사유 값. (0.17.0, 사용자 결정 2026-11-20) **재고에 반영한다** — 아직 집지 않은 몫에서(mfc-inventory 이동 예외):
        지시 수량 −q, 출발 칸에 SHORT·BLOCKED = 분실 조사 보류(실사가 정리), DAMAGED·SPOILED = 격리 + 보고한 사람에게 격리 이동 작업(`quarantineTaskId`). 남은 것을 다 옮겼으면 COMPLETED, 아무것도 안 집었으면 CANCELLED.
        `qty` 생략 = 아직 집지 않은 양 전부, 초과 409 MOVE_QTY_EXCEEDED. 카트 위 물건의 파손은 내려놓은 뒤 품질 격리로. 재고 거절은 그 코드로, 결과 모름은 503 — 같은 Idempotency-Key 로 다시.
        ACTIVE 지시만(409 INVALID_STATE). 그 센터 MFC_WORKER·MFC_SUPERVISOR, 담당이 있으면 담당 또는 카트에 실은 사람만(409 `NOT_ASSIGNEE`).
      operationId: reportMoveOrderException
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExceptionRequest' }
      responses:
        '201':
          description: 반영됨(같은 Idempotency-Key 는 같은 기록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskException' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/work-activities:
    get:
      tags: [work-activities]
      summary: '[mfc-capacity→mfc-inbound] 작업자 한 명의 처리 내역(기간) — 요청 F-7 R3'
      description: |
        mfc-capacity 작업자 "오늘 업무 내역"(`GET /mfcs/{mfcId}/workers/{workerId}/activities`)이 모으는 이 서비스 몫. 내부 호출(토큰 없음, ADR-0026).
        이 서비스 원장에서 그 센터·그 운영자가 [from, to) 에 처리한 것: RECEIVE(입고 수령)·INSPECT·PUTAWAY(입고 작업 실행)·MOVE(이동·보충 — 집어 올린 사람, 시각 = 마지막 변경)·RETURN_RECEIPT(회수품 반입).
        시각 순. 기간은 최대 48시간(넘으면 400), 최대 500건.
      operationId: listWorkActivities
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: operatorId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkActivity' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/worker-last-locations:
    get:
      tags: [work-activities]
      summary: '[mfc-capacity→mfc-inbound] 작업자마다 마지막으로 스캔한 칸 — 작업자 도면 위치'
      description: |
        mfc-capacity `GET /mfcs/{mfcId}/worker-positions`(센터 도면 작업자 위치, 2026-11-21 mfc-backoffice 요청)가 모으는 이 서비스 몫. 내부 호출(토큰 없음, ADR-0026).
        그 센터에서 `since` 이후 처리 기록이 있는 작업자마다 가장 늦은 한 건의 칸(위치 코드)·시각 — 입고 작업 실행(적치·격리 이동은 놓은 칸 toLocationCode, 품질검사는 작업 칸), 입고 수령(수령 칸), 이동·보충(내려놓았으면 도착 칸, 집기만 했으면 출발 칸).
        실내 측위가 아니라 "마지막으로 칸을 스캔한 자리"다. 칸이 없는 기록은 빠진다. 최대 500명.
      operationId: listWorkerLastLocations
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: since, in: query, required: true, schema: { type: string, format: date-time }, description: '이 시각 이후 기록만(최대 24시간 전)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkerLastLocation' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    WorkerLastLocation:
      type: object
      description: '작업자 한 명의 마지막 스캔 칸(작업자 도면 위치) — mfc-capacity 가 여러 서비스 것을 모은다(같은 모양)'
      required: [workerId, locationCode, activityType, at]
      properties:
        workerId: { type: string, description: 운영자(작업자) ID }
        locationCode: { type: string, description: 마지막으로 스캔한 칸 코드 }
        activityType: { type: string, description: '그 기록의 처리 종류(work-activities 와 같은 값)' }
        at: { type: string, format: date-time }
    ReturnReceipt:
      type: object
      description: '회수품 반입(0.7.0) — 단건·목록(0.12.0) 같은 모양'
      properties:
        returnReceiptId: { type: string }
        claimId: { type: [string, 'null'], description: '(0.13.0) 오배송·전달 실패 반납은 null' }
        returnPickupId: { type: string }
        mfcId: { type: string }
        purpose: { $ref: '#/components/schemas/ReturnPurpose' }
        caseId: { type: [string, 'null'] }
        originDeliveryId: { type: [string, 'null'] }
        arrivalId: { type: [string, 'null'], description: '(0.13.0) 반납 도착 대기 건에서 받았으면' }
        inventoryApplyStatus: { type: string, enum: [SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        inspectionState: { type: string, enum: [PENDING, INSPECTED] }
        receivedAt: { type: string, format: date-time }
        orderId: { type: [string, 'null'] }
        toLocationCode: { type: string }
        receivedBy: { type: string }
        rejectReason: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            properties:
              orderLineId: { type: [string, 'null'] }
              sku: { type: string }
              qty: { type: integer }
              lotId: { type: [string, 'null'], description: inventory lotId(반영 뒤) }
              conditionNote: { type: [string, 'null'] }
              productName: { type: [string, 'null'], description: '(0.15.0) 표시용 사본(상품 관리용 명칭). 모르면 null' }
              temperatureZone: { type: [string, 'null'], description: '(0.15.0, PDA BR-52 R12·R18-3) 상품 보관 온도대 AMBIENT·CHILLED·FROZEN — mfc-inventory SKU 사본(상품 보관 유형), 조회 때 읽는다. 모르면 null. 회수품 검수 `temperatureZone` 에 그대로' }
              fresh: { type: [boolean, 'null'], description: '(0.17.0, 사용자 결정 2026-11-20) 신선 = 온도대 CHILLED·FROZEN. AMBIENT 면 false, 온도대를 모르면 null' }
        putawayTaskIds: { type: array, items: { type: string }, description: 'RESALE 분 적치 작업' }
    ReturnPurpose:
      type: string
      enum: [CLAIM_RETURN, MISDELIVERY_RECOVERY, FAILED_DELIVERY_RETURN]
      description: '회수 목적(ReturnDelivered.purpose) — 고객 반품 / 확인된 오배송 회수 / 확정된 전달 실패 뒤 반납. 오배송·전달 실패는 claim 이 없어 자동 환불 없음(검수 규칙은 같음 — 신선·냉장·냉동 폐기, 상온 미개봉만 재고 복구)'
    ReturnArrival:
      type: object
      description: '반납 도착 대기 건(0.13.0, MI-2) — 라이더가 MFC 에 반납(ReturnDelivered). 점원이 고르면 반입 본문을 채운다'
      required: [arrivalId, mfcId, purpose, state, lines, arrivedAt]
      properties:
        arrivalId: { type: string, description: '= 회수 배송 ID(returnPickupId)' }
        mfcId: { type: string }
        purpose: { $ref: '#/components/schemas/ReturnPurpose' }
        claimId: { type: [string, 'null'] }
        caseId: { type: [string, 'null'] }
        originDeliveryId: { type: [string, 'null'] }
        orderId: { type: [string, 'null'] }
        riderId: { type: [string, 'null'] }
        state: { type: string, enum: [WAITING, RECEIVED], description: 'WAITING = 아직 반입 안 함(또는 반입이 재고에서 거절됨), RECEIVED = 반입함' }
        returnReceiptId: { type: [string, 'null'], description: RECEIVED 면 그 반입 }
        arrivedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [qty]
            properties:
              orderLineId: { type: [string, 'null'] }
              sku: { type: [string, 'null'], description: '배송 사건에 상품 코드가 없으면 null — 점원이 반입 줄을 보낸다' }
              productName: { type: [string, 'null'] }
              temperatureZone: { type: [string, 'null'], description: '(0.15.0, PDA BR-52 R12) 상품 보관 온도대 AMBIENT·CHILLED·FROZEN(SKU 사본). 상품 코드가 없거나 모르면 null' }
              fresh: { type: [boolean, 'null'], description: '(0.17.0) 신선 = 온도대 CHILLED·FROZEN. 온도대를 모르면 null' }
              qty: { type: integer }
    TaskExceptionRequest:
      type: object
      required: [reason]
      description: '(0.15.0, PDA BR-52 R19-7) 현장 예외 보고 본문'
      properties:
        reason:
          type: string
          enum: [SHORT, DAMAGED, SPOILED, BLOCKED]
          description: |
            PICK 결품 사유와 같은 값. SHORT 출발 칸에 없음·모자람, DAMAGED 파손 발견, SPOILED 변질 발견, BLOCKED 칸을 쓸 수 없음(도착 칸 가득·막힘·접근 불가).
        qty: { type: [integer, 'null'], minimum: 1, description: '해당 수량(모자란 양·파손 양). (0.17.0) 생략하면 남은 양 전부(이동은 아직 집지 않은 양, 적치는 작업 잔량)' }
        locationCode: { type: [string, 'null'], maxLength: 64, description: '문제가 있는 칸(출발 칸·도착 칸·카트). 생략 가능' }
        note: { type: [string, 'null'], maxLength: 200 }
        evidenceRef: { type: [string, 'null'], maxLength: 64, description: '증빙 사진(mfc-quality `POST /quality-evidence-photos` 의 evidenceRef). 참조만 저장' }
    TaskException:
      type: object
      required: [exceptionId, mfcId, targetType, targetId, reason, reportedBy, reportedAt]
      properties:
        exceptionId: { type: string }
        mfcId: { type: string }
        targetType: { type: string, enum: [MOVE, REPLENISH, PUTAWAY], description: 'MOVE 센터 관리자 이동, REPLENISH 자동 보충(이동 지시 kind), PUTAWAY 적치 작업' }
        targetId: { type: string, description: 'moveId 또는 입고 작업 taskId' }
        sku: { type: [string, 'null'] }
        lotId: { type: [string, 'null'] }
        reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED] }
        qty: { type: [integer, 'null'] }
        locationCode: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        evidenceRef: { type: [string, 'null'] }
        reportedBy: { type: string }
        reportedAt: { type: string, format: date-time }
        applyStatus: { type: [string, 'null'], enum: [RECORDED, APPLIED, REJECTED, UNKNOWN_RESULT, null], description: '(0.17.0) 재고 반영 — RECORDED 는 0.17.0 전 기록(기록만)' }
        inventoryCommitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        quarantineTaskId: { type: [string, 'null'], description: '(0.17.0) DAMAGED·SPOILED 면 만든 격리 이동 작업' }
    WorkActivity:
      type: object
      description: '처리 한 건(F-7 R3) — mfc-capacity 가 여러 서비스 것을 모은다(같은 모양)'
      required: [activityType, refId, at]
      properties:
        activityType: { type: string, description: '처리 종류 — 서비스마다 정한 값(경로 설명)' }
        refId: { type: string, description: 실행·실사·판정·이동 ID }
        taskId: { type: [string, 'null'], description: 작업 ID(있으면) }
        sku: { type: [string, 'null'], description: 한 SKU 일 때만 }
        qty: { type: [integer, 'null'], description: 처리 수량(SKU 단위 합) }
        result: { type: [string, 'null'], description: 'APPLIED·REJECTED·UNKNOWN_RESULT·CAPTURED·COMPLETED 등 그 원장의 상태' }
        at: { type: string, format: date-time }
    MoveOrder:
      type: object
      properties:
        moveId: { type: string }
        kind: { type: string, enum: [MOVE, REPLENISH], description: 'MOVE = 센터 관리자 재배치, REPLENISH = 시스템 자동 보충(0.6.0 — createdBy SYSTEM, 실행·취소는 같다)' }
        mfcId: { type: string }
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.9.0) 표시용 사본(상품 관리용 명칭, InboundTask 와 같음). 모르면 null' }
        barcodes: { type: array, items: { type: string }, description: '(0.9.0) 스캔 대조·라벨 재출력용 활성 바코드(선행 0 보존). 모르면 빈 배열' }
        lotId: { type: string }
        fromLocation: { type: string }
        toLocation: { type: string }
        cartLocation: { type: [string, 'null'] }
        qty: { type: integer }
        pickedQty: { type: integer }
        droppedQty: { type: integer }
        onCartQty: { type: integer }
        state: { type: string, enum: [ACTIVE, CANCEL_PENDING, COMPLETED, CANCELLED] }
        reason: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        urgent: { type: boolean, description: (0.7.1) 센터 관리자 긴급 표시 }
        assigneeId: { type: [string, 'null'], description: '(0.7.1) 담당(capacity 배정 투영) — 있으면 담당만 집어 올림' }
        pickedBy: { type: [string, 'null'], description: '(0.7.1) 카트에 실은 사람 — 그 사람만 내려놓음' }
    InboundPromiseState:
      type: string
      description: (0.22.0) CLOSED — 센터 관리자 입고 종결(오지 않은 이관, MI-5)
      enum: [EXPECTED, RECEIVING, TIN_POSTED, CANCELLED, CLOSED]
    InboundPromiseClosure:
      type: object
      description: '(0.22.0, MI-5) 입고 종결 — AUTO(재고 반영 = 더 받을 것 없음)·MANUAL(센터 관리자). cdcNotifiedAt 이 null 이면 CDC 에 아직 못 알림(다시 보내는 중)'
      properties:
        kind: { type: string, enum: [AUTO, MANUAL] }
        closedAt: { type: string, format: date-time }
        closedBy: { type: string, description: 'MANUAL 은 운영자 ID, AUTO 는 SYSTEM' }
        reason: { type: [string, 'null'] }
        cdcNotifiedAt: { type: [string, 'null'], format: date-time }
        cdcUnreconciledQty: { type: [integer, 'null'], description: CDC 가 기록 때 알려 준 미정산 수량(손실 후보) }
        lastError: { type: [string, 'null'], description: 마지막 알림 실패 }
        cdcCancelRequestId: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.27.0, CO-3 ①) DC 미출발 취소 요청 키(cdc-outbound GET /internal/transfer-intakes/{trfId}/cancellations/{requestId}). DC 에 없던 TRF·공급 요청이 아닌 예정이면 null' }
        cdcNotifyRequired: { type: boolean, x-added-in: '2026-11-27', description: '(0.26.0, R-54) CDC 에 알릴 종결인지 — false 면 CDC 출발 없는 예정의 종결이라 알리지 않는다(cdcNotifiedAt 이 계속 null 이어도 "알리는 중"이 아님)' }
    SupplyRequestState:
      type: string
      description: (0.21.0) APPROVED·REJECTED — 센터 관리자 승인·거절(MI-4, SCM 전)
      enum: [DRAFT, SUBMITTED, ACKNOWLEDGED, WITHDRAWN, APPROVED, REJECTED]
    InboundPromise:
      type: object
      properties:
        trfId: { type: string, description: '(0.8.0) mfc-capacity RECEIVE 작업의 taskId = 이 trfId(다음 작업 받기·수동 배정 모두). 송장 라벨은 `TRF:{trfId}:{version}`' }
        departureId: { type: [string, 'null'], description: TOUT departureId }
        mfcId: { type: string }
        fromCdc: { type: [string, 'null'], description: (0.16.0) 출발 센터 }
        trfVersion: { type: [integer, 'null'], description: '(0.16.0) replenishment TRF 버전(승인·변경·취소). 출발 사건만 먼저 왔으면 null' }
        trfNumber: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.25.0, R-52) TRF 화면 번호(예 T286575 — cdc-outbound 정본 사본). 모르면 null — 화면은 trfId 를 대신 내지 않는다' }
        waveId: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.25.0) DC Wave ID(묶이기 전이면 null)' }
        waveNumber: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.25.0) Wave 화면 번호(예 W6307). 묶이기 전·모르면 null' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/InboundPromiseState' }
        plannedArrivalAt: { type: [string, 'null'], format: date-time, description: '(0.16.0) TRF 기한 dueAt — 뜻은 deadlineMeaning. 승인 사건 전이면 null' }
        deadlineMeaning: { type: [string, 'null'], description: '(0.16.0) 기한의 의미 ARRIVAL(도착)·HANDOVER(인계)·READY(사용 준비)' }
        departedAt: { type: [string, 'null'], format: date-time, description: (0.16.0) 실제 출발 시각(TOUT) }
        shipmentManifestId: { type: [string, 'null'], description: (0.16.0) 출발 매니페스트 }
        cancelReason: { type: [string, 'null'], description: (0.16.0) CANCELLED 일 때 replenishment 취소 사유 }
        eta: { type: [string, 'null'], format: date-time, description: TMS TransportEtaUpdated 투영 }
        tripId: { type: [string, 'null'] }
        arrivedAt: { type: [string, 'null'], format: date-time }
        closure: { $ref: '#/components/schemas/InboundPromiseClosure' }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              productName: { type: [string, 'null'], description: (0.8.0) 표시용 사본 }
              barcodes: { type: array, items: { type: string }, description: (0.8.0) 스캔 대조용 활성 바코드 }
              lotId: { type: [string, 'null'], description: '(0.16.0) CDC LOT 표기(출발 줄). 출발 전(승인 수량만)이면 null — inventory lotId 가 아니다' }
              expiryDate: { type: [string, 'null'], format: date, description: (0.16.0) 출발 줄 소비기한 }
              temperatureZone: { type: [string, 'null'], description: '(0.16.0) 보관 온도대 AMBIENT·CHILLED·FROZEN(SKU 사본, 조회 때). 모르면 null' }
              expectedQty: { type: integer, description: (0.16.0) 출발(TOUT) 수량, 출발 전이면 승인 수량(취소분 뺀 값) }
              receivedQty: { type: integer, description: '(0.16.0) 재고 반영된 인수 합(정상+격리+보류)' }
              quarantinedQty: { type: integer, description: (0.16.0) 그중 격리 }
              pendingQty: { type: integer, description: (0.16.0) 그중 미판정 보류 }
        packages:
          type: array
          description: |
            (0.16.0, 클라이언트 BR-53 R17 일부) 출발 매니페스트(없으면 출발 줄)의 LPN 단위 목록 — CDC 가 준 LPN 값 그대로. 박스 바코드 형식(`BOX-…`)·입수·롤테이너 수는
            원천 사건에 없어 넣지 않았다(요청 cdc-outbound CO-2). (0.22.0) CO-2 구현 — 박스 바코드 = lpn 값 그대로, 담긴 롤테이너·팔레트 `parentLpn`. 입수는 아직 없음.
          items:
            type: object
            properties:
              lpn: { type: [string, 'null'], description: '(0.22.0, CO-2) 박스(BOX) LPN — 박스 바코드 원문 = 이 값 그대로(CDC 분류 때 등록한 값)' }
              parentLpn: { type: [string, 'null'], description: '(0.22.0, CO-2) 이 박스가 담긴 롤테이너(RT)·팔레트(PLT) LPN — 매니페스트에 없으면 null' }
              sku: { type: string }
              lotId: { type: [string, 'null'] }
              qty: { type: integer }
              expiryDate: { type: [string, 'null'], format: date }
        receipts: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
        sources:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    RecordReceiptRequest:
      type: object
      required: [lines]
      properties:
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string }
        evidenceRef: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, normalQty, quarantinedQty, pendingQty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              expiryDate: { type: string, format: date }
              normalQty: { type: integer, minimum: 0 }
              quarantinedQty: { type: integer, minimum: 0 }
              pendingQty: { type: integer, minimum: 0 }
              toLocationCode: { type: string, description: '(0.16.0) 수령 위치(입고대) — 서버는 필수로 본다(없으면 400)' }
              discrepancyReason:
                type: string
                enum: [NOT_RECEIVED, SHORT, OVER, DAMAGED, TEMPERATURE]
                description: |
                  (0.8.0) 줄당 하나. **수량 차이(NOT_RECEIVED·SHORT·OVER)가 있으면 그것을 보낸다.** 수량이 맞고 격리(quarantinedQty > 0)가
                  있을 때만 격리 사유(DAMAGED·TEMPERATURE). 격리 수량은 사유와 상관없이 quarantinedQty 로 따로 남는다(IV-02 인수 = 정상 + 격리 + 보류).
    Receipt:
      type: object
      properties:
        receiptId: { type: string }
        trfId: { type: [string, 'null'] }
        departureId: { type: [string, 'null'] }
        mfcId: { type: string }
        inventoryApplyStatus: { type: string, enum: [CAPTURED, SUBMITTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'], description: (0.16.0) REJECTED 일 때 inventory 거절 사유 }
        discrepancies:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              expectedQty: { type: integer }
              receivedQty: { type: integer }
              reason: { type: string }
        receivedAt: { type: string, format: date-time }
        postedAt: { type: [string, 'null'], format: date-time }
    InitialStockLoad:
      type: object
      description: |
        초기 보유 반입(INITIAL_STOCK 승인 → 입고 예정 → 현장 수령 → mfc-inventory ConfirmReceipt). EXPECTED: 승인됨·현장 수령 전,
        PENDING: 전기 대기·재시도 중(inventory 일시 장애 포함), APPLIED: 전기 완료(inventoryCommitId, 품질검사 작업 생성),
        REJECTED: 승인 내용 오류 또는 inventory 의 명시적 거절(rejectReason).
      required: [receiptId, approvalId, state, lines]
      properties:
        receiptId: { type: string, description: 이 서비스가 발급한 수령 ID (mfc-inventory 중복 계상 방지 키) }
        approvalId: { type: string }
        mfcId: { type: [string, 'null'], description: 승인 내용이 올바르지 않아 센터를 정할 수 없으면 null }
        state: { type: string, enum: [EXPECTED, PENDING, APPLIED, REJECTED] }
        receivingLocation: { type: [string, 'null'], description: 현장 수령 위치 }
        receivedAt: { type: [string, 'null'], format: date-time }
        rejectReason: { type: [string, 'null'] }
        inventoryCommitId: { type: [string, 'null'] }
        attempts: { type: integer, description: mfc-inventory 전기 시도 횟수 }
        lastError: { type: [string, 'null'], description: 마지막 일시 실패 사유(재시도 중) }
        lines:
          type: array
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { type: string }
              productName: { type: [string, 'null'], description: '(0.8.0) 표시용 사본. 모르면 null' }
              barcodes: { type: array, items: { type: string }, description: '(0.8.0) 스캔 대조용 활성 바코드' }
              qty: { type: integer, description: 승인 수량 }
              receivedQty: { type: [integer, 'null'], description: 현장 수령 수량(수령 전 null) }
        createdAt: { type: string, format: date-time }
        appliedAt: { type: [string, 'null'], format: date-time }
    InboundTask:
      type: object
      required: [taskId, taskType, mfcId, receiptId, sku, lotId, locationCode, plannedQty, doneQty, state, version]
      properties:
        taskId: { type: string }
        taskType: { type: string, enum: [INSPECT, PUTAWAY, QUARANTINE_MOVE], description: '(0.17.0) QUARANTINE_MOVE = 격리품을 격리 구역으로' }
        origin: { type: [string, 'null'], enum: [INSPECTION, RETURN, EXCEPTION, RELEASE, HOLD_FOUND, null], description: '(0.17.0) 만든 까닭 — 격리 이동: 품질검사 격리(INSPECTION)·회수품 검수 폐기(RETURN)·현장 예외(EXCEPTION), 적치: 격리 해제(RELEASE)·(0.18.0) 수령장 분실 조사 보류에서 찾음(HOLD_FOUND). 그 밖(기존 품질검사·적치·회수품 재판매)은 null' }
        mfcId: { type: string }
        receiptId: { type: string, description: '수령·반입 ID. 현장 예외는 예외 ID, 격리 해제 적치는 품질 판정 ID' }
        parentTaskId: { type: [string, 'null'], description: 적치 작업을 만든 품질검사 작업 }
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.8.0) 표시용 사본(상품 관리용 명칭). 모르면 null' }
        barcodes: { type: array, items: { type: string }, description: '(0.8.0) 스캔 대조용 활성 바코드. 모르면 빈 배열' }
        storageType: { type: [string, 'null'], description: '(0.11.0, mfc-app BR-52 R18) 보관 온도대 AMBIENT·CHILLED·FROZEN — 품질검사 온도 확인. 모르면 null' }
        minRemainingDays: { type: [integer, 'null'], description: '(0.11.0, R18) 정상 판정 최소 잔여일 — 상품 보장, 없으면 보관 유형 기본값(예약·출하 판정과 같은 값). 둘 다 없으면 null — 0·무제한이 아님(PDA 는 기준 미설정으로 막는다)' }
        maxDaysSinceManufacture: { type: [integer, 'null'], description: '(0.11.0, R18) 제조 후 최대 경과일 — 있으면 제조일 필수. 보장 없으면 null' }
        lotId: { type: string, description: mfc-inventory lotId(품질검사 = 수령 LOT, 적치 = 나뉜 LOT) }
        locationCode: { type: string, description: 출발 위치 }
        plannedQty: { type: integer }
        doneQty: { type: integer }
        exceptedQty: { type: integer, description: '(0.17.0) 현장 예외로 뺀 양(잔량 = plannedQty − doneQty − exceptedQty)' }
        state: { type: string, enum: [READY, COMPLETED] }
        version: { type: integer }
        assigneeId: { type: [string, 'null'], description: '(0.9.0) 담당(mfc-capacity 배정 투영) — 있으면 담당만 실행. (0.17.0) 격리 이동은 만들 때 그 사람(검수자·반입자·보고자)으로 미리 정한다' }
        createdAt: { type: string, format: date-time, description: '(0.9.0) 만든 시각 — 다음 작업 받기에서 같은 유형은 먼저 만든 것부터' }
        suggestedToLocations:
          type: array
          items: { type: string }
          description: |
            (0.15.0, PDA BR-52 R19-4) 적치 추천 칸 — mfc-fulfillment RETURN 의 같은 이름 칸과 같다: 그 상품이 이미 있는 칸 → 기타 칸 순, 진열 규칙 통과 칸만(mfc-inventory placement-suggestions, 잔량 기준).
            **READY 적치 작업의 단건 조회**(`GET /inbound-tasks/{taskId}`)에서만 채운다 — 목록·실행 응답·품질검사 작업·`withLabels=false` 는 빈 배열. 조회 실패도 빈 배열. 참고값이다(실제 판정은 적치 때 inventory).
            (0.17.0) READY 격리 이동 작업은 격리 구역 칸(구역 QUARANTINE·온도대 = 보관 유형, 위치 코드 순 — placement-suggestions purpose=QUARANTINE).
            (0.19.0) 전량이 들어가는 칸만 — 그 상품 선반 → 기타 칸 → 보충재고 칸 순(mfc-inventory 0.44.0). 선반이 모자라면 `suggestedPlacements` 를 본다.
        suggestedPlacements:
          type: array
          description: |
            (0.19.0, R-30) 나눠 넣기 — 칸마다 넣을 양(앞이 우선): 그 상품의 일반 선반에 남은 용량만큼 → 기타 칸 → 그 온도대 보충재고 칸(입고창고 팔레트 자리·저온 보충재고, 그 상품이 있는 칸 먼저).
            suggestedToLocations 와 같은 때만 채운다(READY 적치 단건). 격리 이동·조회 실패는 빈 배열.
          items:
            type: object
            required: [locationCode, qty]
            properties:
              locationCode: { type: string }
              qty: { type: integer, minimum: 1 }
        suggestedUnplacedQty:
          type: [integer, 'null']
          description: '(0.19.0, R-30) suggestedPlacements 로 다 못 넣은 양 — 입고칸에 둔 채 작업을 열어 둔다(적치 예외 보고 대상 아님). 나눠 넣기를 안 채운 응답은 null'
    InboundTaskExecution:
      type: object
      required: [executionId, taskId, applyStatus]
      properties:
        executionId: { type: string }
        taskId: { type: string }
        applyStatus: { type: string, enum: [CAPTURED, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        createdTaskIds: { type: array, items: { type: string }, description: '만든 적치 작업. (0.17.0) 품질검사 격리분이면 격리 이동 작업도' }
        task: { $ref: '#/components/schemas/InboundTask' }
    SupplyRequestBody:
      type: object
      required: [mfcId, lines, requestedReadyAt, urgency, reason]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        requestedReadyAt: { type: string, format: date-time, description: 희망 사용준비 시각 }
        urgency: { type: string, enum: [NORMAL, URGENT] }
        reason: { type: string, maxLength: 500 }
        recommendationRef: { type: string, description: ReplenishmentRecommended 참조 }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
    SupplyRequest:
      allOf:
        - $ref: '#/components/schemas/SupplyRequestBody'
        - type: object
          properties:
            supplyRequestId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { $ref: '#/components/schemas/SupplyRequestState' }
            submittedBy: { type: string }
            submittedAt: { type: string, format: date-time }
            acknowledgedAt: { type: [string, 'null'], format: date-time }
            linkedTrfId: { type: [string, 'null'], description: 'replenishment 승인 후 연결. (0.23.0) 보급 DC 이관이면 첫 TRF(온도대가 나뉘면 transfers 전체)' }
            approvedLines:
              type: array
              description: (0.21.0) 승인된 요청만 — 줄마다 요청·승인 수량(승인 0 이면 입고 예정에 없음)
              items:
                type: object
                required: [sku, requestedQty, approvedQty]
                properties:
                  sku: { type: string }
                  requestedQty: { type: integer }
                  approvedQty: { type: integer }
            decidedBy: { type: [string, 'null'], description: (0.21.0) 승인·거절한 센터 관리자 }
            decidedAt: { type: [string, 'null'], format: date-time }
            decisionNote: { type: [string, 'null'], description: (0.21.0) 승인 메모(부분 승인 사유) }
            rejectReason: { type: [string, 'null'], description: (0.21.0) 거절 사유 }
            linkedReceiptId: { type: [string, 'null'], description: '(0.21.0) 승인이 만든 입고 예정 receiptId(GET /initial-stock-loads?approvalId= 이 요청 ID)' }
            transferCdcId: { type: [string, 'null'], description: '(0.23.0, ADR-0091) 승인 뒤 이관을 요청한 보급 DC — 있으면 linkedTrfId 가 입고 예정(/inbound-promises/{trfId})' }
            transferDueAt: { type: [string, 'null'], format: date-time, description: (0.23.0) 이관 도착 기한 }
            transferSentAt: { type: [string, 'null'], format: date-time, description: '(0.23.0) DC 가 이관 요청을 받은 시각 — null 이면 보내는 중(transferError 에 마지막 실패)' }
            transferError: { type: [string, 'null'], description: '(0.23.0) 아직 못 보낸 TRF 의 첫 실패(`<trfId>: <사유>`)' }
            transfers:
              type: array
              description: |
                (0.23.0, R-27) 승인이 만든 이관(TRF) — 온도대마다 하나(cdc-outbound 인수 조건 TEMPERATURE_ZONE 은 하나뿐). 온도대가 하나면 trfId `TRF-<요청 ID>`,
                여럿이면 `TRF-<요청 ID>-<AMBIENT|CHILLED|FROZEN>`. 각 TRF 는 같은 trfId 의 입고 예정(/inbound-promises/{trfId}). 보급 DC 가 없으면 빈 배열.
              items:
                type: object
                required: [trfId, temperatureZone, cdcId, dueAt, lines]
                properties:
                  trfId: { type: string }
                  temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
                  cdcId: { type: string }
                  dueAt: { type: string, format: date-time, description: '희망 사용준비 시각(deadlineMeaning READY) — 이미 지났으면 승인 + supply-due-after' }
                  sentAt: { type: [string, 'null'], format: date-time, description: DC 가 받은 시각(null = 보내는 중) }
                  error: { type: [string, 'null'], description: 마지막 실패 }
                  trfNumber: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.25.0, R-52) TRF 화면 번호 — 같은 trfId 입고 예정의 사본(DC 인수 뒤)' }
                  waveId: { type: [string, 'null'], x-added-in: '2026-11-27' }
                  waveNumber: { type: [string, 'null'], x-added-in: '2026-11-27', description: '(0.25.0) Wave 화면 번호 — 묶이기 전이면 null' }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [sku, qty]
                      properties:
                        sku: { type: string }
                        qty: { type: integer }
    SupplyRecommendations:
      type: object
      required: [mfcId, calculatedAt, salesThrough, items]
      properties:
        mfcId: { type: string }
        calculatedAt: { type: string, format: date-time, description: 계산 기준 시각 }
        availabilityAsOf: { type: [string, 'null'], format: date-time, description: mfc-inventory 가용 수량 기준 시각 }
        salesThrough: { type: string, format: date, description: 인계 실적을 센 마지막 날(어제, Asia/Seoul) }
        items: { type: array, items: { $ref: '#/components/schemas/SupplyRecommendation' } }
    SupplyRecommendation:
      type: object
      required: [sku, expectedQty, pendingRequestedQty, historyDays, missingPolicyFields]
      properties:
        sku: { type: string }
        productName: { type: [string, 'null'] }
        storageType: { type: [string, 'null'] }
        recommendedQty: { type: [integer, 'null'], description: 추천 발주 수량(0 = 지금 필요 없음). 추천하지 않으면 null + reason }
        reason:
          type: [string, 'null']
          description: |
            추천하지 않은 사유. POLICY_MISSING(그 센터·온도대 공급 정책 값 없음 — missingPolicyFields), STORAGE_TYPE_UNKNOWN(SKU 온도대 모름),
            INSUFFICIENT_HISTORY(인계 실적 일수 < 최소 이력), AVAILABILITY_UNKNOWN(재고 서비스가 판매 가능 수량을 주지 않음), SKU_NOT_HANDLED(센터 취급 OFF). 추천하면 null
        missingPolicyFields: { type: array, items: { type: string }, description: POLICY_MISSING 일 때 빈 값(reviewDays·leadDays·safetyDays·orderMultiple·minOrderQty) }
        forecastDailyQty: { type: [number, 'null'], description: d — 예측 일 판매량(인계 이동평균) }
        historyDays: { type: integer, description: d 를 낸 날 수 }
        availableQty: { type: [integer, 'null'], description: 지금 판매 가능 수량 A }
        expectedQty: { type: integer, description: 입고 예정 수량 }
        pendingRequestedQty: { type: integer, description: 승인 전(SUBMITTED) 공급 요청 수량 — IP 에 넣지 않음 }
        inventoryPosition: { type: [number, 'null'], description: IP = availableQty + expectedQty }
        safetyStockQty: { type: [number, 'null'], description: SS = d × safetyDays }
        targetQty: { type: [number, 'null'], description: 목표 재고 S }
        shortfallQty: { type: [number, 'null'], description: max(0, S − IP) — 배수 올림 전 }
        reviewDays: { type: [number, 'null'], description: R }
        leadDays: { type: [number, 'null'], description: L }
        safetyDays: { type: [number, 'null'] }
        orderMultiple: { type: [integer, 'null'] }
        minOrderQty: { type: [integer, 'null'] }
        policySource: { type: [string, 'null'], description: '정책을 찾은 곳 — 센터 ID 또는 "*"(전 센터 기본). 정책 줄이 없으면 null' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
