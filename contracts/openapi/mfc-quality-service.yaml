openapi: 3.1.0
info:
  title: mfc-quality-service
  version: 0.8.0
  description: |
    MFC 품질 판정(PENDING→NORMAL/QUARANTINED)·격리 해제 승인·회수품 검수·폐기 승인·품질 사건·리콜 영향 LOT 추적의 정본. (docs/architecture/service-map.md §5)
    비정본: 수량 반영(mfc-inventory에 quality-postings 요청 후 commitId 수신), 손실 회계 승인(approval-service/본사).
    규칙: RELEASE(격리 해제)는 승인자 필수. 회수품은 상온 미개봉 적격만 RESALE, **신선·냉장·냉동은 항상 DISPOSE**.
    폐기: REQUESTED→APPROVED/REJECTED→(부분 실행)→COMPLETED, 요청자/승인자 분리.

    구현 0.2.0(2026-11-08, IV-09·IV-10): 격리·해제 판정, 폐기 요청·승인·실행. 권한 — 그 센터 운영자 + 역할. 판정·요청·실행 = MFC_WORKER 또는
    MFC_SUPERVISOR, 승인·반려 = MFC_SUPERVISOR(요청자·판정자 본인 아님). 행위자 ID 는 토큰 주체(본문의 decidedBy·actorId 가 다르면 403).
    재고 반영은 mfc-inventory `/internal/quality-postings`(Idempotency-Key = 판정 ID·실행 ID) — 결과 모름은 같은 키로 서버가 다시 보낸다.
    회수품 검수·품질 사건은 아직 501(회수품 반입 원천이 없음).
    0.3.0(2026-11-17, 본사 승인 번호 실제 확인 — 요청 AP-1, 사용자 Q-11 "추천대로"·격리 해제도 "같은 기준"): 폐기 승인·격리 해제 승인에 본사 승인 기준.
      격리 해제 승인 본문에 `approvalRef`. kind DISPOSAL(ref = 폐기 요청 ID)·QUALITY_RELEASE(ref = 품질 판정 ID).
    0.4.0(2026-11-17, 작업자 오늘 업무 내역 — 요청 F-7 R3): `GET /internal/work-activities`(격리·해제 판정·폐기 실행·회수품 검수 — mfc-capacity 가 모은다).
    0.5.0(2026-11-18, 센터 관리자 웹 목록 — 요청 MB-1): `GET /quality-decisions`·`/disposal-approvals`·`/return-inspections`(mfcId·state·커서, 기본 끝나지 않은 것, 오래된 순).
    0.6.0(2026-11-18·19, 품질 사고 MB-2 1차 — 사용자 결정 2026-11-19): `GET /quality-incidents`(items·nextCursor, 기본 OPEN·DECIDED 오래된 순)·단건 구현, 직접 등록 `POST /quality-incidents`(센터 관리자), 닫기 `POST /quality-incidents/{id}/closures`(영향 LOT 모두 처리 뒤만 — 409 LOTS_NOT_RESOLVED), 자동 열기 = 결품 보고 LineShortageReported reason DAMAGED(같은 센터·LOT 의 열린 자동 파손 사고에 묶음). 상태 OPEN → DECIDED(영향 LOT 모두 격리 해제 APPLIED 또는 폐기 승인) → CLOSED. 판정은 `incidentId`(판정 요청 칸) 또는 같은 센터·LOT·사고 뒤 판정으로 잇는다. IncidentKind 에 SPOILAGE(변질).
    0.7.0(2026-11-19, 반납 도착 대기 — 요청 MI-1·MQ-1): 회수품 검수 `claimId` 선택(반입에서 — 주면 같아야 함, 다르면 400). 오배송 회수·전달 실패 반납(claim 없음)도 같은 규칙으로 검수 — `ReturnInspected` 에 purpose·caseId·originDeliveryId(claimId 는 고객 반품일 때만, 자동 환불은 claim 이 있을 때만). 검수 줄 orderLineId 를 주지 않으면 반입 줄의 주문 줄 번호로 채운다(같은 상품 두 주문 줄이면 수량대로 나눔) → `ReturnInspected.lines[].orderLineId`.
    0.8.0(2026-11-19, 품질 사고 고객 영향 — MB-2 2차 R6): `affectedOrderCount` = 영향 LOT 이 라이더에게 인계된(고객에게 나간) 주문 수 — mfc-inventory `/internal/lot-orders` 로 새 사고·LOT 추가 때 곧, 열린 사고는 5분마다 다시 센다(아직 안 셌으면 null). 바뀌면 `QualityIncidentImpactAssessed`(mfc.quality.v1) — case-service 가 고객 사건을 열고 `caseId` 를 채운다(case 쪽은 요청 중 — 그 전엔 caseId null).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: decisions, description: 격리·해제 판정 }
  - { name: return-inspections, description: 회수품 검수 }
  - { name: disposals, description: 폐기 승인 }
  - { name: incidents, description: 품질 사건 }

paths:
  /quality-decisions:
    get:
      tags: [decisions]
      summary: '격리·해제 판정 목록 — 해제 승인 대기 등 (0.5.0, MB-1)'
      description: |
        센터 관리자 웹 품질 > 해제 승인 대기(REQUESTED = 해제 요청이 승인을 기다림).
        그 센터 운영자(조회 권한 = 단건과 같다). `state` 반복, 비우면 끝나지 않은 것(REQUESTED·SUBMITTED·UNKNOWN_RESULT) — 끝난 것은 state 로 고를 때만.
        오래된 것부터(대기 큐), 커서 = 마지막 항목 ID(`nextCursor`), size ≤ 200. 항목은 단건 응답과 같다.
      operationId: listQualityDecisions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [REQUESTED, SUBMITTED, APPLIED, UNKNOWN_RESULT, REJECTED, DECLINED] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QualityDecision' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [decisions]
      summary: 품질 판정 등록 (QUARANTINE / RELEASE) → mfc-inventory quality-postings, QualityDecisionMade
      description: |
        QUARANTINE 은 검수자 단독 가능. RELEASE 는 approverId 필수이며 decidedBy ≠ approverId.
        수량 반영 성공은 inventory commitId 로만 확정. 영향 예약은 inventory 가 BLOCKED 처리하고 ReservationBlocked 를 발행한다.
        구현 0.2.0: QUARANTINE 은 바로 재고 반영(status APPLIED / UNKNOWN_RESULT / REJECTED). RELEASE 는 **요청만**(status ACCEPTED, 판정 REQUESTED) —
        본문의 approverId 로 승인을 대신하지 않는다(요청·승인 분리, MFC Q-11). 승인은 다른 운영자가 POST …/{id}/approvals.
        decidedBy 는 토큰 주체와 같아야 한다(생략 가능). 줄마다 lotId·locationCode 필수, workState STORED(기본)/UNSTOWED.
      operationId: createQualityDecision
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityDecisionRequest' }
      responses:
        '202':
          description: 접수 (resultId = qualityDecisionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: VALIDATION_FAILED / INSUFFICIENT_STOCK (재고 거절은 본문 status REJECTED 로도 옴)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /quality-decisions/{qualityDecisionId}/approvals:
    post:
      tags: [decisions]
      summary: '[0.2.0] 격리 해제(RELEASE) 승인·반려 — 승인이면 재고 반영'
      description: |
        MFC_SUPERVISOR, 판정 요청자 본인은 안 됨(422 SELF_APPROVAL). REQUESTED 판정만(아니면 409 INVALID_STATE, 같은 결정 재요청은 지금 판정).
        APPROVE → mfc-inventory RELEASE(Q−q, STORED 면 E+q) → APPLIED / UNKNOWN_RESULT(서버가 같은 키로 다시) / REJECTED(사유). REJECT → DECLINED.
        본사 승인 기준(AP-1, 0.3.0 — `pmart.approval-ref.mode: VERIFY`): 수량 × pricing 판매 기준가 합 ≥ `hq-loss-krw`(10만 원) 또는 한 SKU ≥ `hq-sku-qty`(20개)면 본사 재고 승인(approval-service MFC_STOCK_ADJUSTMENT, INVENTORY_APPROVER) — approvalRef 가 없으면 422 APPROVAL_REQUIRED, details `field=approvalRequest` 의 reason = approval-service `POST /change-requests` 본문 JSON, `field=threshold` = 걸린 기준. 승인 번호를 approvalRef 로 다시 보내면 재고 반영 전 한 번 쓴다(쓸 수 없거나 SKU 수량이 승인보다 많으면 422 APPROVAL_REQUIRED). 기준 아래면 센터 관리자 승인만(approvalRef 선택). 단가 없는 SKU 는 미평가 → 본사. `RECORD_ONLY`(LAN 시험)는 예전처럼. kind QUALITY_RELEASE, ref = qualityDecisionId.
      operationId: approveQualityDecision
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: qualityDecisionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 500 }
                approvalRef: { type: string, maxLength: 64, description: '(0.3.0, AP-1) 본사 승인 기준 이상일 때 approval-service 승인 번호(approvalId)' }
      responses:
        '200':
          description: 결정 뒤 판정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDecision' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED(본사 승인 필요·번호 사용 불가 — 0.3.0)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /quality-decisions/{qualityDecisionId}:
    get:
      tags: [decisions]
      summary: 판정 조회 (inventory 반영 상태·commitId)
      operationId: getQualityDecision
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: qualityDecisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDecision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /return-inspections:
    get:
      tags: [return-inspections]
      summary: '회수품 검수 목록 (0.5.0, MB-1)'
      description: |
        센터 관리자 웹 품질 > 회수품 검수. state = 재고 반영 상태(inventoryApplyStatus). 검수를 기다리는 반입은 mfc-inbound 회수품 반입 쪽.
        그 센터 운영자(조회 권한 = 단건과 같다). `state` 반복, 비우면 끝나지 않은 것(SUBMITTED·UNKNOWN_RESULT) — 끝난 것은 state 로 고를 때만.
        오래된 것부터(대기 큐), 커서 = 마지막 항목 ID(`nextCursor`), size ≤ 200. 항목은 단건 응답과 같다.
      operationId: listReturnInspections
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReturnInspection' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [return-inspections]
      summary: 회수품 검수 결과 등록 (RESALE / DISPOSE, ReturnInspected)
      description: |
        ReturnItemReceived(inbound) 이후 수행. 행별 판정 RESALE 은 상온(AMBIENT)·미개봉·적격일 때만 허용.
        temperatureZone 이 CHILLED/FROZEN 또는 신선 카테고리이면 RESALE 요청은 422 RESALE_NOT_ALLOWED.
        RESALE 은 inventory 에 RELEASE(Q−q, E+q), DISPOSE 는 폐기 승인 요청(disposal-approvals)으로 이어진다.
      operationId: createReturnInspection
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnInspectionRequest' }
      responses:
        '202':
          description: 접수 (resultId = returnInspectionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (반입 미등록·이미 검수)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: RESALE_NOT_ALLOWED (신선·냉장·냉동·개봉) / QTY_EXCEEDS_RECEIVED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /return-inspections/{returnInspectionId}:
    get:
      tags: [return-inspections]
      summary: 회수품 검수 조회
      operationId: getReturnInspection
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: returnInspectionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnInspection' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /disposal-approvals:
    get:
      tags: [disposals]
      summary: '폐기 목록 — 승인 대기·실행 대기 (0.5.0, MB-1)'
      description: |
        센터 관리자 웹 품질 > 폐기.
        그 센터 운영자(조회 권한 = 단건과 같다). `state` 반복, 비우면 끝나지 않은 것(REQUESTED·APPROVED·PARTIALLY_EXECUTED) — 끝난 것은 state 로 고를 때만.
        오래된 것부터(대기 큐), 커서 = 마지막 항목 ID(`nextCursor`), size ≤ 200. 항목은 단건 응답과 같다.
      operationId: listDisposalApprovals
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [REQUESTED, APPROVED, PARTIALLY_EXECUTED, COMPLETED, REJECTED] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/DisposalApproval' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [disposals]
      summary: 폐기 승인 요청/결정 (REQUESTED→APPROVED/REJECTED, 요청자·승인자 분리, DisposalApproved)
      description: |
        action REQUEST 는 폐기 요청 생성. action APPROVE/REJECT 는 disposalApprovalId 대상 결정이며 requesterId ≠ approverId.
        손실 회계 영향은 approval-service(BO-15) 승인 참조(approvalRef)를 요구한다. 실행은 inventory DISPOSE 전기(승인 잔량 내 부분 실행 가능).
        구현 0.2.0: actorId = 토큰 주체. REQUEST(MFC_WORKER·MFC_SUPERVISOR) 줄마다 sku·lotId·locationCode·qty. APPROVE·REJECT(MFC_SUPERVISOR, 요청자 아님 —
        422 SELF_APPROVAL), lines 로 부분 승인(요청량 이하). APPROVE 의 approvalRef:
        본사 승인 기준(AP-1, 0.3.0 — `pmart.approval-ref.mode: VERIFY`): 수량 × pricing 판매 기준가 합 ≥ `hq-loss-krw`(10만 원) 또는 한 SKU ≥ `hq-sku-qty`(20개)면 본사 재고 승인(approval-service MFC_STOCK_ADJUSTMENT, INVENTORY_APPROVER) — approvalRef 가 없으면 422 APPROVAL_REQUIRED, details `field=approvalRequest` 의 reason = approval-service `POST /change-requests` 본문 JSON, `field=threshold` = 걸린 기준. 승인 번호를 approvalRef 로 다시 보내면 재고 반영 전 한 번 쓴다(쓸 수 없거나 SKU 수량이 승인보다 많으면 422 APPROVAL_REQUIRED). 기준 아래면 센터 관리자 승인만(approvalRef 선택). 단가 없는 SKU 는 미평가 → 본사. `RECORD_ONLY`(LAN 시험)는 예전처럼. kind DISPOSAL, ref = disposalApprovalId, 수량 = 승인 수량.
        승인하면 DisposalApproved. 응답 resultId = disposalApprovalId. 실제 폐기는 POST …/{id}/executions.
      operationId: decideDisposal
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisposalApprovalRequest' }
      responses:
        '202':
          description: 접수 (resultId = disposalApprovalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED (approvalRef 없음) / QTY_EXCEEDS_QUARANTINED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /disposal-approvals/{disposalApprovalId}/executions:
    post:
      tags: [disposals]
      summary: '[0.2.0] 폐기 실행 — 승인 잔량 안에서 mfc-inventory DISPOSE(H−q, Q−q)'
      description: |
        MFC_WORKER·MFC_SUPERVISOR. APPROVED·PARTIALLY_EXECUTED 만. 줄(sku·lotId·locationCode)마다 승인량 − 실행 누계 − 진행 중 실행 이하(아니면 422 QTY_EXCEEDS_APPROVED).
        실행 ID = Idempotency-Key 기준(같은 키는 같은 실행). 재고 반영 APPLIED 면 누계 +q, 다 실행하면 COMPLETED. 모름은 서버가 같은 실행 ID 로 다시,
        거절은 REJECTED(잔량 되돌림).
      operationId: executeDisposal
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/QualityLine' }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 실행 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalExecution' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QTY_EXCEEDS_APPROVED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /disposal-approvals/{disposalApprovalId}:
    get:
      tags: [disposals]
      summary: 폐기 승인 조회 (승인량·집행 누계·잔량)
      operationId: getDisposalApproval
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /quality-incidents:
    get:
      tags: [incidents]
      summary: 품질 사고 목록 (0.6.0)
      description: |
        그 센터 운영자. `state` 반복, 비우면 끝나지 않은 것(OPEN·DECIDED). 오래된 순(대기 큐), 커서 = 마지막 사고 ID, size ≤ 200. 항목은 단건과 같다.
        상태는 조회 때 영향 LOT 의 판정으로 다시 맞춘다(OPEN ↔ DECIDED).
      operationId: listQualityIncidents
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/IncidentKind' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [OPEN, DECIDED, CLOSED] } }
        - { name: lotId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QualityIncident' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [incidents]
      summary: 품질 사고 직접 등록 (그 센터 MFC_SUPERVISOR — 0.6.0)
      description: |
        사용자 결정(2026-11-19): 현장에서 찾은 파손·변질·오염·유통기한·온도·리콜 등. 영향 LOT 은 **이 센터에 재고가 남은 LOT** 만(mfc-inventory 로 확인 — 없으면 422 LOT_NOT_IN_CENTER + details lotId,
        재고 조회가 안 되면 503). 등록은 격리를 걸지 않는다 — 격리·해제·폐기는 기존 흐름(`POST /quality-decisions` 의 `incidentId`, 폐기 요청)으로.
        같은 Idempotency-Key = 같은 결과. description 은 개인정보 금지.
      operationId: createQualityIncident
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfcId, kind, affectedLots, description]
              properties:
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                kind: { $ref: '#/components/schemas/IncidentKind' }
                description: { type: string, minLength: 1, maxLength: 300 }
                affectedLots:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [lotId, qty]
                    properties:
                      lotId: { type: string, maxLength: 40 }
                      qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityIncident' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /quality-incidents/{incidentId}:
    get:
      tags: [incidents]
      summary: 품질 사건 조회
      operationId: getQualityIncident
      description: 그 센터 운영자(0.6.0). 상태는 조회 때 다시 맞춘다.
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: incidentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityIncident' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /quality-incidents/{incidentId}/closures:
    post:
      tags: [incidents]
      summary: 품질 사고 닫기 (그 센터 MFC_SUPERVISOR — 0.6.0)
      description: |
        사용자 결정(2026-11-19): 영향 LOT 이 모두 처리(격리 해제 APPLIED 또는 폐기 승인)된 뒤에만, 사유 필수. 남았으면 409 `LOTS_NOT_RESOLVED`(details 에 남은 lotId),
        이미 닫혔으면 409 `INVALID_STATE`, X-Expected-Version 이 다르면 409 VERSION_CONFLICT.
      operationId: closeQualityIncident
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: incidentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: 닫힘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityIncident' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/work-activities:
    get:
      tags: [work-activities]
      summary: '[mfc-capacity→mfc-quality] 작업자 한 명의 처리 내역(기간) — 요청 F-7 R3'
      description: |
        mfc-capacity 작업자 "오늘 업무 내역"(`GET /mfcs/{mfcId}/workers/{workerId}/activities`)이 모으는 이 서비스 몫. 내부 호출(토큰 없음, ADR-0026).
        이 서비스 원장에서 그 센터·그 운영자가 [from, to) 에 처리한 것: QUARANTINE·RELEASE(품질 판정 — 판정한 사람)·DISPOSE(폐기 실행)·RETURN_INSPECTION(회수품 검수).
        시각 순. 기간은 최대 48시간(넘으면 400), 최대 500건.
      operationId: listWorkActivities
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: operatorId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkActivity' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    WorkActivity:
      type: object
      description: '처리 한 건(F-7 R3) — mfc-capacity 가 여러 서비스 것을 모은다(같은 모양)'
      required: [activityType, refId, at]
      properties:
        activityType: { type: string, description: '처리 종류 — 서비스마다 정한 값(경로 설명)' }
        refId: { type: string, description: 실행·실사·판정·이동 ID }
        taskId: { type: [string, 'null'], description: 작업 ID(있으면) }
        sku: { type: [string, 'null'], description: 한 SKU 일 때만 }
        qty: { type: [integer, 'null'], description: 처리 수량(SKU 단위 합) }
        result: { type: [string, 'null'], description: 'APPLIED·REJECTED·UNKNOWN_RESULT·CAPTURED·COMPLETED 등 그 원장의 상태' }
        at: { type: string, format: date-time }
    IncidentKind:
      type: string
      enum: [TEMPERATURE_EXCURSION, DAMAGE, SPOILAGE, RECALL, EXPIRY, CONTAMINATION, OTHER]
      description: '(0.6.0) SPOILAGE = 변질'
    InventoryApplyStatus:
      type: string
      enum: [NOT_REQUESTED, SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT]
    QualityLine:
      type: object
      required: [sku, lotId, locationCode, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lotId: { type: string }
        locationCode: { type: string }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        workState: { type: string, enum: [STORED, UNSTOWED], description: '0.2.0 — 재고 단위 행 업무 상태(기본 STORED)' }
    QualityDecisionRequest:
      type: object
      required: [mfcId, decisionType, reason, lines]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        decisionType: { type: string, enum: [QUARANTINE, RELEASE] }
        decidedBy: { type: string, description: '0.2.0 — 토큰 주체(생략 가능, 다르면 403)' }
        approverId: { type: string, description: '0.2.0 — 요청에서는 무시. 승인은 POST …/approvals 로(응답의 approverId = 실제 승인자)' }
        reason: { type: string, enum: [TEMPERATURE, DAMAGE, EXPIRY, RECALL, INSPECTION_FAIL, INSPECTION_PASS, OTHER] }
        incidentId: { type: string }
        note: { type: string, maxLength: 500 }
        evidenceRefs: { type: array, items: { type: string } }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QualityLine' }
    QualityDecision:
      allOf:
        - $ref: '#/components/schemas/QualityDecisionRequest'
        - type: object
          properties:
            qualityDecisionId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { type: string, enum: [REQUESTED, SUBMITTED, APPLIED, UNKNOWN_RESULT, REJECTED, DECLINED], description: '0.2.0 — REQUESTED = 해제 승인 대기, DECLINED = 해제 반려' }
            rejectReason: { type: [string, 'null'], description: 재고 거절 사유 }
            approvedAt: { type: [string, 'null'], format: date-time }
            inventoryApplyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
            inventoryCommitId: { type: [string, 'null'] }
            appliedQty: { type: integer }
            affectedOrderIds: { type: array, items: { type: string }, description: inventory ReservationBlocked 투영 }
            decidedAt: { type: string, format: date-time }
    ReturnInspectionRequest:
      type: object
      required: [mfcId, returnReceiptId, inspectedBy, lines]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        claimId: { type: [string, 'null'], description: '(0.7.0) 선택 — 반입의 클레임(오배송 회수·전달 실패 반납은 없음). 주면 반입과 같아야 한다' }
        returnReceiptId: { type: string, description: inbound 회수품 반입 ID }
        inspectedBy: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty, verdict, temperatureZone, opened]
            properties:
              orderLineId: { type: [string, 'null'], description: '(0.7.0) 생략하면 반입 줄의 주문 줄 번호(같은 상품 두 줄이면 수량대로 나눔)' }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              verdict: { type: string, enum: [RESALE, DISPOSE] }
              temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
              fresh: { type: boolean, description: 신선 카테고리 여부. true 면 RESALE 불가 }
              opened: { type: boolean, description: 개봉 여부. true 면 RESALE 불가 }
              disposeReason: { type: string, enum: [TEMPERATURE_ZONE, FRESH, OPENED, DAMAGED, EXPIRED, OTHER] }
              evidenceRef: { type: string }
    ReturnInspection:
      allOf:
        - $ref: '#/components/schemas/ReturnInspectionRequest'
        - type: object
          properties:
            returnInspectionId: { type: string }
            purpose: { type: string, enum: [CLAIM_RETURN, MISDELIVERY_RECOVERY, FAILED_DELIVERY_RETURN], description: '(0.7.0) 회수 목적' }
            caseId: { type: [string, 'null'] }
            originDeliveryId: { type: [string, 'null'] }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            resaleQty: { type: integer }
            disposeQty: { type: integer }
            inventoryApplyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
            inventoryCommitId: { type: [string, 'null'], description: RESALE 분 RELEASE commitId }
            disposalApprovalId: { type: [string, 'null'], description: DISPOSE 분 폐기 승인 요청 }
            inspectedAt: { type: string, format: date-time }
    DisposalApprovalRequest:
      type: object
      required: [action, mfcId]
      properties:
        action: { type: string, enum: [REQUEST, APPROVE, REJECT] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        disposalApprovalId: { type: string, description: APPROVE/REJECT 시 필수 }
        actorId:
          type: string
          description: REQUEST 시 requesterId / APPROVE·REJECT 시 approverId. 0.2.0 — 토큰 주체(생략 가능, 다르면 403)
        approvalRef: { type: string, description: 'approval-service approvalId (BO-15 손실 회계). (0.3.0) 본사 승인 기준 이상일 때만 필요 — 아래면 선택(없으면 기록 CENTER:<id>)' }
        reason: { type: string, maxLength: 500 }
        sourceRef: { type: string, description: qualityDecisionId / returnInspectionId / incidentId }
        lines:
          type: array
          description: REQUEST 시 필수. APPROVE 시 생략하면 전량, 지정하면 부분 승인
          items: { $ref: '#/components/schemas/QualityLine' }
    DisposalApproval:
      type: object
      properties:
        disposalApprovalId: { type: string }
        mfcId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { type: string, enum: [REQUESTED, APPROVED, REJECTED, PARTIALLY_EXECUTED, COMPLETED] }
        requesterId: { type: string }
        approverId: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        sourceRef: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lotId: { type: string }
              locationCode: { type: string }
              requestedQty: { type: integer }
              approvedQty: { type: integer }
              executedQty: { type: integer, description: inventory DISPOSE 누계 }
              remainingQty: { type: integer, description: approvedQty − executedQty }
        executions:
          type: array
          items: { $ref: '#/components/schemas/DisposalExecution' }
        reason: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    DisposalExecution:
      type: object
      properties:
        executionId: { type: string }
        disposalApprovalId: { type: string }
        state: { type: string, enum: [SUBMITTED, APPLIED, UNKNOWN_RESULT, REJECTED] }
        executedBy: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/QualityLine' } }
        qty: { type: integer }
        inventoryCommitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        executedAt: { type: string, format: date-time }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    QualityIncident:
      type: object
      properties:
        incidentId: { type: string }
        mfcId: { type: string }
        kind: { $ref: '#/components/schemas/IncidentKind' }
        state: { type: string, enum: [OPEN, DECIDED, CLOSED], description: 'OPEN → DECIDED(영향 LOT 모두 처리) → CLOSED(센터 관리자 닫기)' }
        origin: { type: string, enum: [AUTO, MANUAL], description: '(0.6.0) AUTO = 사건으로 열림, MANUAL = 센터 관리자 직접 등록', x-added-in: '2026-11-19' }
        description: { type: [string, 'null'], description: '(0.6.0) 직접 등록 설명(자동은 null)', x-added-in: '2026-11-19' }
        openedBy: { type: [string, 'null'], description: '(0.6.0) 직접 등록한 운영자(자동은 null)', x-added-in: '2026-11-19' }
        sourceEvent: { type: [string, 'null'], description: TemperatureExcursion / LineShortageReported / RecallIssued — 직접 등록은 null }
        sourceRef: { type: [string, 'null'], description: '원천 사건 ID(자동이 묶이면 첫 사건)' }
        affectedLots:
          type: array
          items:
            type: object
            properties:
              sku: { type: [string, 'null'] }
              lotId: { type: string }
              qty: { type: integer }
              resolved: { type: boolean, description: '(0.6.0) 격리 해제 APPLIED 또는 폐기 승인이 있음', x-added-in: '2026-11-19' }
              resolvedBy: { type: [string, 'null'], description: '(0.6.0) 처리한 판정·폐기 ID', x-added-in: '2026-11-19' }
        remainingLotCount: { type: integer, description: '(0.6.0) 아직 처리 안 된 LOT 수', x-added-in: '2026-11-19' }
        decisionIds: { type: array, items: { type: string }, description: '이 사고에 이어진 판정·폐기 ID(incidentId 로 또는 같은 LOT·사고 뒤)' }
        caseId: { type: [string, 'null'], description: case-service 연결(고객 영향 — 2차) }
