    Availability:
      type: object
      description: |
        수량은 센터 요약(stock_balance — 단위 행 합과 같은 트랜잭션에서 바뀜, ADR-0040)에서 읽는다. A 에는 소비기한 기준을 통과하지 못한 LOT 도
        들어 있을 수 있어, 예약이 NO_ELIGIBLE_LOT 으로 거절될 수 있다 — 주문 가능 판정은 shippableAvailable(0.24.0)로. 원장 행이 없는 SKU(한 번도 입고되지 않음)는 0 이다. A = E − R.
        handlingEnabled=false 인 SKU 는 수량이 있어도 예약할 수 없다(SKU_NOT_HANDLED). version 은 원장 행 version(행 없음 = 0).
      properties:
        sku: { type: string }
        onHand: { type: [integer, 'null'], description: H }
        quarantined: { type: [integer, 'null'], description: Q }
        sellable: { type: [integer, 'null'], description: E }
        reserved: { type: [integer, 'null'], description: R }
        available: { type: [integer, 'null'], description: A = E − R }
        shippableAvailable:
          type: [integer, 'null']
          description: |
            (0.24.0, IV-1 — 사용자 "재고가 없으면 주문서 화면으로 가면 안 된다") 출하 가능 수량 = 예약과 같은 소비기한 적격 판정(상품 보장 잔여일,
            없으면 보관 유형 최소 잔여일, 제조 후 경과일 — 기준일 deliveryDate)을 통과한 LOT 의 E − R 합(≤ available). 소비기한이 지난 LOT 은 빠진다.
            장바구니·주문서 진입은 이 값으로 판정하면 예약의 NO_ELIGIBLE_LOT 과 같다(같은 순간이면). 최소 잔여일 미설정으로 판정할 수 없으면 null
            (예약은 CONFIG_REQUIRED) — null 을 0 이나 available 로 바꾸지 않는다.
        handlingEnabled: { type: boolean, description: 센터 취급 ON/OFF (center_sku_handling, 레코드 없음 = OFF) }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
