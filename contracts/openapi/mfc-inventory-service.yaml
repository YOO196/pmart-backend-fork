openapi: 3.1.0
info:
  title: mfc-inventory-service
  version: 0.35.0
  description: |
    MFC 재고 수량의 **단일 쓰기 주체**. (docs/architecture/service-map.md §5, ADR-0002)
    정본: Balance(센터·위치·SKU·LOT·품질상태·업무상태·수량·버전), LedgerEntry, ReservationPart, MoveAllocation(물량 M·공간 V), commitId 원장.
    비정본: 작업·포장·인계 fence(mfc-fulfillment), 수령 사실(mfc-inbound), 품질 판정(mfc-quality), 위치 마스터(mfc-location), 취소 판단(order-orchestration).

    수량 기호와 불변식
    - H(On-hand 현물), Q(격리), E(판매가능 실물 = H − Q − 미검수), R(예약), A(가용)
    - **0 ≤ R ≤ E ≤ H, A = E − R**
    - TIN(수령): H+q (E 제외, 검수 후 E+q). 인계 확정: H−q, E−q, R−q 를 **한 사건**으로 전기.
    - 격리: Q+q, E−q, 영향 ReservationPart → BLOCKED. 회수품 인수: H+q, Q+q. 폐기: 승인 잔량 내 H−q, Q−q.
    모든 변경은 commitId를 갖는다. 호출자는 자체 사본으로 성공을 판단하지 않고 commitId/requestId 조회로 확정한다.
    가용 조회 실패는 0이 아니라 503 DEPENDENCY_UNAVAILABLE 이다.

    0.20.0(2026-11-17, LOT 라벨 — 클라이언트 mfc-app 요청 L1~L6, 사용자 "추천대로"): LOT 라벨(QR) 값 `LOT:{lotId}` — LOT 하나 = 값 하나, 재출력해도 같다.
      LOT 기준은 그대로(SKU·제조사 LOT 원문·소비기한·제조일 — 납입일로 나누지 않음, 라벨에 표시만). 박스 상품은 박스 SKU(unitType B, unitsPerSku 입수) —
      라벨 1장 = 그 SKU 1단위. 조회 `GET /mfcs/{mfcId}/lot-labels/{lotId}`(인쇄·해석)·`GET /mfcs/{mfcId}/lot-labels?sku=|locationCode=`(재출력 찾기).
    0.21.0(2026-11-17, LOT 바코드 GS1-128 — 요청 IV-4, 사용자 결정): LOT 마다 짧은 **LOT 번호 `lotNo`**(20자 이하, 전체 유일 — `L`+만든 날 YYMMDD+일련,
      기존 LOT 은 한 번 채움). 라벨 바코드는 **GS1-128** `(01)` GTIN-14(상품 바코드 앞에 0) + `(17)` 소비기한 YYMMDD(없으면 생략) + `(10)` lotNo —
      `LotLabel.gs1`. 찍은 값으로 LOT 찾기 `GET /mfcs/{mfcId}/lot-resolutions?code=`(GS1 원문·괄호 꼴, 예전 QR `LOT:{lotId}` 도).
      `lotNo` 를 라벨·재고 상세(`CenterStock.lots`)·피킹 계획(`PickPlan.parts`)·실사 계수표(`CountSession.sheet`)에 싣는다.
    0.22.0(2026-11-17, 본사 승인 번호 실제 확인 — 요청 AP-1, 사용자 Q-11 "추천대로"): 실사 조정 승인·재고 정정에 본사 승인 기준(손실 10만 원·한 SKU 20개 — 설정).
      기준 이상이면 approval-service 승인 번호를 집행 전 한 번 쓴다(`/internal/approval-ref-uses`), 아래면 센터 관리자만 — 정정 `approvalRef` 선택.
      품질 반영(`/internal/quality-postings`)의 approvalRef 는 mfc-quality 내부 승인이라 확인하지 않는다(mfc-quality 가 확인).
    0.23.0(2026-11-17, PDA 재고 확인·작업자 오늘 업무 내역 — 요청 IV-2·F-7): `CenterStock.productName·barcodes`, `GET /internal/work-activities`(실사 계수 —
      mfc-capacity 가 모은다), 실사 계수 시각 기록(V22).
    0.24.0(2026-11-17, 출하 가능 수량 — 요청 IV-1 높음, 사용자 "재고가 없으면 주문서 화면으로 가면 안 된다"): `Availability.shippableAvailable`(예약과 같은
      소비기한 적격 LOT 의 E − R, 지난 LOT 제외, 판정 불가 null)·query `deliveryDate`. `available` 은 그대로(하위 호환).
    0.25.0(2026-11-17, PDA 품질검사 기준 — mfc-app BR-52 R18): SKU 사본(`/internal/skus`)에 `minRemainingDays`(실제 적용 최소 잔여일 — 상품 보장, 없으면 보관 유형 기본값).
    0.26.0(2026-11-18, 센터 관리자 웹 목록 — 요청 MB-1): `GET /mfcs/{mfcId}/count-sessions`(실사 목록), `GET /mfcs/{mfcId}/stock-units`(상품 코드 없이 센터 재고).
    0.27.0(2026-11-19, 상품 취급 — 사용자 결정 2026-11-19 R7·R8): 본사 단종(commerce.product.v1 `ProductSaleStateChanged` state DISCONTINUED)이면 모든 센터 취급 OFF(이력·SkuHandlingChanged, 주체 product-service), 단종인 동안 켜기 409 `SKU_DISCONTINUED`. 일시 품절(TEMP_OUT)은 취급을 건드리지 않음. `SkuHandling.saleState`·`offReason`(CENTER·DISCONTINUED, 정한 적 없으면 null)·`introducedAt`(SkuIssued 시각). 목록 `undecided`(정한 적 없는 것만 — 단종 제외)·`introducedSince`·응답 `totalCount`(배너 숫자).
    0.28.0(2026-11-19, 센터별 품절 상품 수 — 요청 IV-5, 백오피스 대시보드 D5): `GET /stock-summaries?mfcId=` — 센터마다 취급(ON) 상품 수·그중 가용(A = E − R) ≤ 0 인 상품 수. 안전재고(Q-13) 없이 "품절"로 센다(사용자 결정 2026-11-18).
    0.29.0(2026-11-19, 출하대기 랙 — 요청 F-12·시뮬레이터 R-20·PDA BR-52 R20): 작업 실행 `executionType: STAGE` — fromLocation(포장 PACKING 또는 다른 출하대기 랙)의 NORMAL·PACKED → toLocation(구역 DISPATCH_STAGING)의 PACKED, 위치만(H·E·R·예약 불변, 예약 줄 없음). 인계 전기는 지금처럼 locationCode 의 PACKED 에서.
    0.30.0(2026-11-19, ADR-0070 화면 번호 — LOT 은 LOT 번호로): `GET /mfcs/{mfcId}/lot-numbers?lotIds=` — LOT ID 여러 개 → LOT 번호·SKU·상품명·소비기한(품질·입고·이동 응답의 lotId 를 화면에서 바꿔 보이려고).
    0.32.0(2026-11-19, 결품 사유 변질 — 품질 사고 MB-2): `/internal/shortage-reports` reason 에 SPOILED(변질) — DAMAGED 와 같이 그 위치·LOT 을 격리하고 같은 SKU 적격 LOT 으로 재확보. 0.31.0 은 열린 PR #249 몫.
    0.31.0(2026-11-19, 품질 사고 고객 영향 — MB-2 2차 R6.): `GET /internal/lot-orders?mfcId=&lotIds=` — 그 LOT 을 집품·포장·인계한 주문 줄(예약 조각 기준). mfc-quality 가 사고의 영향 주문을 센다.
      권한(MB-3, PC 3 결정): 위치·LOT 정정(`stock-corrections`)은 그 센터 MFC_SUPERVISOR 만, 상품 취급 변경(`sku-handlings` 단건·일괄)은 그 센터의 MFC_SUPERVISOR 또는 MD(아니면 403). 조회는 그대로.
    0.33.0(2026-11-20, 시뮬레이터 R-15·R-16 — 칸 단위 재고·SKU 여러 개): `GET /mfcs/{mfcId}/stock-units` 에 거르기 `locationPrefix`(위치 코드 앞부분)·`zone`·`temperatureZone`
      (이 서비스의 위치 사본 — MfcLocationStateChanged 로 받은 것, 사본에 없는 위치는 이 둘로 거르면 빠진다), 항목 `zone`·`temperatureZone`, 응답 `asOf`(모두 추가만 — 하위 호환).
      `GET /mfcs/{mfcId}/stocks?sku=A&sku=B…`(1~100) — `CenterStock` 배열. 기존 `/mfcs/{mfcId}/stock?sku=` 응답 모양은 그대로(생성 클라이언트가 단건으로 쓴다).
    0.34.0(2026-11-20, 클라이언트 BR-52 R14·R19-6·R19-7 — 사용자 결정 "관리자가 계획·서버 잠금"): 실사 계획 `POST /mfcs/{mfcId}/count-plans`(MFC_SUPERVISOR, 칸마다 실사 하나 —
      mfc-location COUNT_LOCKED 없이 이 서비스가 그 칸을 잠금, 실사가 끝나거나 취소되면 저절로 풀림)·`GET …/count-plans/{planId}`·`POST …/count-plans/{planId}/cancellation`,
      실사 취소 `POST …/count-sessions/{sessionId}/cancellation`(상태 CANCELLED 추가), 계수 `unexpectedLines[]`(계수표 밖 상품 — 바코드/SKU·소비기한·수량)와 `CountSession.unresolvedLines`,
      실사 예외 `POST …/count-sessions/{sessionId}/exceptions`(LOCATION_INACCESSIBLE·DAMAGE_FOUND)와 `CountSession.exceptions`·`planId`, mfc-capacity 용 `GET /internal/count-work?mfcId=`(줄 일).
    0.35.0(2026-11-20, 클라이언트 BR-52 R19-7 후속 — 사용자 결정 "만들어. 꼭 해당 작업자에게 배정되지 않아도 돼"): 예외로 멈춘 실사 다시 시작
      `POST /mfcs/{mfcId}/count-sessions/{sessionId}/resumption`(MFC_SUPERVISOR — 열린 예외를 해결로 표시, 실사는 다시 `/internal/count-work` 후보, 누구든 받는다·재계수는 첫 계수자 제외 그대로,
      칸 잠금은 계속). `CountSession.exceptions[]` 에 `resolvedBy`·`resolvedAt`·`resolutionNote`, 계획 칸별 `openExceptionCount`(추가만 — 하위 호환).
      같은 0.35.0(2026-11-20, 요청 IV-6·사용자 결정 2026-11-20 "격리품은 격리 구역으로, 이동·보충·적치 예외는 PICK 결품처럼"):
      ① 격리 이동 — 작업 실행 `executionType: QUARANTINE_MOVE`: fromLocation 의 QUARANTINED(UNSTOWED 먼저, 그다음 STORED) → toLocation(구역 QUARANTINE·ACTIVE·온도대 = 상품 보관 유형)의
      QUARANTINED·STORED, 위치만(H·Q·E 불변). 추천 `GET /internal/placement-suggestions?purpose=QUARANTINE`(격리 구역 칸, 위치 코드 순).
      ② 품질 반영이 옮겨진 격리품을 따라간다 — RELEASE·DISPOSE 줄의 위치·업무 상태에 격리 수량이 모자라면 같은 LOT 의 **격리 구역** 칸 QUARANTINED 에서 나머지를 뺀다
      (mfc-quality 는 처음 기록한 위치를 그대로 보내도 된다). 선반·피킹 밖(격리·수령·반품 구역)에서 RELEASE 하면 NORMAL·**UNSTOWED**(적치 뒤 판매) — 선반 칸은 전과 같다.
      ③ 이동·보충 예외 `POST /internal/move-allocations/{moveId}/exceptions`(아직 집지 않은 몫: 이동 수량 −q·MOVE 보류 −q, SHORT·BLOCKED = 출발 칸 분실 조사 보류,
      DAMAGED·SPOILED = 출발 칸 격리 — E 순변화 없음), 예약 없는 재고 예외 `POST /internal/stock-exceptions`(입고 적치 — 위치·SKU·LOT·업무 상태의 NORMAL 에 같은 규칙,
      STORED 면 PICK 결품처럼 E−q·넘는 예약 BLOCKED(QUALITY_HOLD·사유)·재확보, UNSTOWED 분실 보류는 E 변화 없음). 같은 reportId 는 한 번.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: reservations, description: 예약 ReservationPart (HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED) }
  - { name: counts, description: 순환 실사·차이 조정(IV-11) }
  - { name: lot-labels, description: 'LOT 라벨(QR) 인쇄·재출력·해석 (0.20.0)' }
  - { name: postings, description: 수량 전기 명령 (수령·작업·인계·품질·조정) }
  - { name: queries, description: 가용·스냅샷·원결과 조회 }
  - { name: sku-handlings, description: 센터 SKU 취급 ON·OFF (운영자 — 자기 센터) }
  - { name: skus, description: 상품 SKU 투영 조회 }
  - { name: moves, description: '재고 위치 이동 — 이동 배정·집어 올리기·내려놓기(IV-03, 0.12.0)' }

paths:
  /internal/reservations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] ReserveInventory — 결제 직전 재고 예약 (all-or-nothing)'
      description: |
        행별 요청량 ≤ A 를 검증하고 동일 SKU는 합산한다. 한 행이라도 부족하면 전체 거절(INSUFFICIENT_STOCK, 부족 행 details 포함).
        TTL 기본 10분 `[Q-04]`. 만료 시 InventoryHoldExpired 발행, R−q.

        슬라이스 4 구현(2026-10-30): 원장은 센터·SKU 한 행(LOT·위치·품질 차원 없음). 예약 SKU 행을 SKU 오름차순으로 잠가(`FOR UPDATE`)
        직렬화하므로 마지막 수량 경합에서 총 성공량 ≤ A 다. 거절은 기록하지 않으므로 같은 키 재요청은 다시 판정한다.
        - INSUFFICIENT_STOCK details: `field` = sku, `reason` = `requestedQty=<합산 요청량>;availableQty=<A>`
        - SKU_NOT_HANDLED details: `field` = sku, `reason` = `HANDLING_OFF`
        - lotConstraint 는 아직 지원하지 않는다(400 VALIDATION_FAILED).
      operationId: reserveInventory
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveInventoryRequest' }
      responses:
        '201':
          description: 예약 생성 (resultId = reservationId, status APPLIED)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK (details에 부족 sku·requestedQty·availableQty) / SKU_NOT_HANDLED(센터 취급 OFF) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/reservations/{reservationId}:
    get:
      tags: [reservations]
      summary: 예약 조회 (상태·행별 HELD/CONFIRMED 수량·만료 시각)
      operationId: getReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/pick-plan:
    get:
      tags: [reservations]
      summary: '[fulfillment→inventory] 피킹 지시 — 예약 조각(LOT)별 남은 집품량과 선반 위치 후보 (IV-07, 0.5.0)'
      description: |
        조각마다 계획(qty)·집품(pickedQty)·포장(packedQty)과, 그 LOT 의 NORMAL·STORED 단위가 있는 위치(코드 순, 위치별 수량)를 준다.
        위치 수량은 그 LOT 의 선반 잔량이며 이 예약 몫만이 아니다(같은 LOT 을 다른 주문도 잡을 수 있다). 지시는 참고이고, 실제 집품은 CommitTaskExecution PICK 이 판정한다.
      operationId: getPickPlan
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickPlan' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/location-allocations:
    post:
      tags: [reservations]
      summary: '[fulfillment→inventory] 예약의 위치 배정 — 피킹 시작 때 LOT 예약을 선반 위치로 나눈다 (IV-05·WK-10 위치 세분화, 0.11.0)'
      description: |
        확정(CONFIRMED) 예약의 조각마다 아직 배정 안 된 남은 집품량을 그 LOT 의 선반(NORMAL·STORED) 위치에 나눠 적는다. 수량을 새로 빼지 않는다(R 불변) — 같은 예약을 어느 칸 몫인지 나눌 뿐.
        위치 가용 = 선반 잔량 − 조사 보류 − 다른 조각의 남은 배정. 고르는 규칙(Q-08 전 임시): 한 칸에서 다 집을 수 있으면 그런 칸 중 가용이 가장 적은 칸(같으면 코드 순), 없으면 가용 많은 칸부터.
        가용이 모자라면 배정할 수 있는 만큼만 하고 나머지는 unallocatedQty(오류 아님 — 피킹 때 결품 보고).
        이미 배정된 양은 다시 배정하지 않으므로 다시 불러도 같은 결과(멱등). 예약이 CONFIRMED 가 아니면 409.
      operationId: allocateReservationLocations
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 배정 결과(이 예약의 지금 배정 전체)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickPlan' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /mfcs/{mfcId}/unshippable-lots:
    get:
      tags: [moves]
      summary: 출하 부적격 LOT 회수 목록 (0.13.0)
      description: |
        2026-11-08 사용자 결정: 같은 상품의 여러 LOT 이 한 칸에 섞여도 되지만, 출하 기준(상품 소비기한 보장, 없으면 보관 유형 최소 잔여일 — 오늘 기준)을
        못 맞추는 LOT 은 빨리 거둔다. 선반·피킹 칸의 정상·적치 재고 중 오늘 부적격인 LOT 과 그 칸·수량. onMiscShelf = 이미 기타 칸(카테고리 없음)에 있음.
        센터 관리자는 이 목록으로 기타 칸으로 이동을 지시한다(카테고리 칸으로는 이동 배정이 409 LOT_NOT_SHIPPABLE). 그 센터 운영자. 기준이 없는 상품은 빼고 보여 주지 않는다.
      operationId: listUnshippableLots
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK (소비기한 빠른 순, 최대 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        lotId: { type: string }
                        expiryDate: { type: [string, 'null'], format: date }
                        manufactureDate: { type: [string, 'null'], format: date }
                        locationCode: { type: string }
                        locationCategoryId: { type: [string, 'null'] }
                        onMiscShelf: { type: boolean }
                        qty: { type: integer }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /internal/placement-suggestions:
    get:
      tags: [moves]
      summary: 적치·복귀 칸 추천 (0.14.1, #59)
      description: |
        2026-11-08 사용자 결정 #59: 취소품 복귀(MOVE)도 입고 적치와 같은 진열 규칙을 건다. 이 조회는 규칙을 통과하는 칸을 추천한다 —
        ① 그 상품이 이미 있는 칸(고회전 제외) ② 기타 칸(카테고리 없음, 위치 코드 순). 출하 부적격 LOT 은 카테고리 칸이 빠지므로 기타 칸만 나온다.
        통과하는 칸이 없으면 빈 목록. 서비스 토큰(mfc-fulfillment 복귀 작업 지시).
      operationId: suggestPlacement
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { type: string } }
        - { name: lotId, in: query, required: true, schema: { type: string } }
        - { name: qty, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 3 } }
        - name: purpose
          in: query
          description: '(0.35.0, IV-6) PLACEMENT(기본) = 진열 규칙 칸. QUARANTINE = 격리품 놓을 칸 — 구역 QUARANTINE·ACTIVE·온도대 = 상품 보관 유형(위치 코드 순, 보관 유형 모르면 빈 목록)'
          schema: { type: string, enum: [PLACEMENT, QUARANTINE], default: PLACEMENT }
      responses:
        '200':
          description: 추천 칸(앞이 우선)
          content:
            application/json:
              schema:
                type: object
                properties:
                  locationCodes: { type: array, items: { type: string } }
  /mfcs/{mfcId}/replenishment-policies:
    get:
      tags: [moves]
      summary: 자동 선반 보충 기준 목록 (IV-04, 0.14.0)
      operationId: listReplenishmentPolicies
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReplenishmentPolicy' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    put:
      tags: [moves]
      summary: 자동 선반 보충 기준 등록·변경 — 센터 관리자 (IV-04, 0.14.0)
      description: |
        2026-11-08 사용자 결정: 보충은 **시스템이 만든다**(재배치는 센터 관리자). 기준값(Q-07)은 센터 관리자가 칸·상품별로 등록한다 — 등록이 없는 칸은 보충하지 않는다(수동 보충 요청 없음).
        **고회전 선반만**(같은 상품 한 자리 규칙의 예외인 칸 — 아니면 422 REPLENISH_ONLY_HIGH_TURNOVER). min ≤ target, 단위 > 0.
      operationId: putReplenishmentPolicy
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCode, sku, minQty, targetQty, unitQty]
              properties:
                locationCode: { type: string }
                sku: { type: string }
                minQty: { type: integer, minimum: 0 }
                targetQty: { type: integer, minimum: 0 }
                unitQty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplenishmentPolicy' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    delete:
      tags: [moves]
      summary: 자동 선반 보충 기준 삭제 — 센터 관리자 (0.14.0)
      operationId: deleteReplenishmentPolicy
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: locationCode, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨(없어도) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /internal/replenishment-evaluations:
    post:
      tags: [moves]
      summary: '[inbound→inventory] 자동 선반 보충 점검 — 필요한 보충 이동을 만들고 진행 중 보충 이동을 돌려준다 (IV-04, 0.14.0)'
      description: |
        기준마다: 현재량 C(그 칸 정상·적치 − 보류)가 min 이하이면 지시량 = floor(min(target − C − 진행 중 U, 출발 이동 가능 S, 도착 남은 공간 V) ÷ 단위) × 단위.
        출발은 같은 상품의 다른 선반·피킹 칸에서 **소비기한 빠른 출하 가능 LOT 부터**, 이동 가능 = 집을 수 있는 양이고 LOT 가용 A 까지(이동 중은 판매 가능에서 빠짐 —
        예약이 많아 A 가 모자라면 **재고가 확보될 때까지 보충하지 않는다**, 사용자 결정). 만든 이동은 일반 이동 배정(kind REPLENISH)과 같은 규칙으로 검사한다.
        기준마다 따로 처리(한 기준의 거절이 다른 기준을 막지 않는다). 응답 = 지금 진행 중인 보충 이동 전부(inbound 가 이동 지시로 남긴다 — 다시 불러도 같다).
        상품 크기·칸 치수가 없으면 그 기준은 건너뛴다(skipped 에 이유).
      operationId: evaluateReplenishment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mfcId: { type: [string, 'null'], description: 없으면 모든 센터 }
      responses:
        '200':
          description: 점검 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  moves: { type: array, items: { $ref: '#/components/schemas/MoveAllocation' } }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        mfcId: { type: string }
                        locationCode: { type: string }
                        sku: { type: string }
                        reason: { type: string }
  /internal/move-allocations:
    post:
      tags: [moves]
      summary: '[inbound→inventory] 재고 이동 배정 — 출발 물량·도착 공간을 함께 잡는다 (IV-03, 0.12.0)'
      description: |
        2026-11-08 사용자 결정. 두 단계 이동(출발 칸 → 카트 → 도착 칸)의 시작. 옮길 수 있는 양 = 출발 칸의 **집을 수 있는 양**(NORMAL·STORED − 보류 − 다른 주문 칸 배정)이고
        그 LOT 의 가용(A) 까지 — 이동 배정분은 판매 가능(E)에서 빠진다(IV-03, 출발 칸에 MOVE 보류). 도착 칸: 선반·피킹, ACTIVE, 온도대 = 상품 보관 유형,
        **칸에 여러 상품 가능 — 카테고리 칸은 그 카테고리(하위 포함) 상품만**(409 CATEGORY_MISMATCH, 상품 카테고리를 모르면 SKU_CATEGORY_UNKNOWN), 카테고리 없는 칸 = 기타(아무 상품).
        출하 부적격 LOT 은 카테고리 칸에 못 둔다(409 LOT_NOT_SHIPPABLE). **같은 상품은 한 자리**(고회전 선반 제외 — 다른 칸에 이미 있으면 409 SKU_ALREADY_SHELVED,
        출발 칸에 남는 양이 있으면 409 SKU_SPLIT_NOT_ALLOWED), 용량(칸 치수 ÷ 상품 크기, 들어올 예정 포함 — 넘으면 409 LOCATION_CAPACITY_EXCEEDED, 칸 치수 없으면 422 CONFIG_REQUIRED).
        상품 크기는 SKU 투영의 상품 실물 치수(0.18.0, ProductVersionPublished.skus[].dimensions — 어느 방향으로도 칸에 안 들어가면 용량 0, 무게를 알면 칸 최대 하중도 본다)가 우선이고,
        치수 미등록 SKU 는 설정 `pmart.inventory.dummy-sku-size` 가 켜진 환경(LAN·시험)에서만 더미(소·중·대)로 계산한다(꺼져 있으면 422 CONFIG_REQUIRED). 같은 moveId 는 한 번(같은 내용이면 지금 상태).
        출발·도착이 실사 잠금이면 409.
      operationId: createMoveAllocation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moveId, mfcId, sku, lotId, fromLocation, toLocation, qty]
              properties:
                moveId: { type: string, maxLength: 64 }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { type: string }
                lotId: { type: string }
                fromLocation: { type: string }
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: 배정됨(또는 같은 moveId 의 지금 상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
  /internal/move-allocations/{moveId}:
    get:
      tags: [moves]
      summary: 재고 이동 배정 조회 (0.12.0)
      operationId: getMoveAllocation
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /internal/move-allocations/{moveId}/pickups:
    post:
      tags: [moves]
      summary: 집어 올리기 — 출발 칸 → 카트 (0.12.0)
      description: |
        출발 칸 NORMAL·STORED −q, 카트 NORMAL·MOVING +q, MOVE 보류 −q(E 변화 없음 — 이미 배정 때 뺐다). 카트 = 구역 CART·ACTIVE 위치, 한 이동은 한 카트(다른 카트 409 CART_MISMATCH).
        남은 배정량 초과 409 MOVE_QTY_EXCEEDED. 같은 executionId 는 한 번.
      operationId: pickUpMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionId, cartLocation, qty]
              properties:
                executionId: { type: string, maxLength: 128 }
                cartLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/move-allocations/{moveId}/drops:
    post:
      tags: [moves]
      summary: 내려놓기 — 카트 → 도착 칸(취소 뒤에는 출발 칸으로도) (0.12.0)
      description: |
        카트 NORMAL·MOVING −q, 칸 NORMAL·STORED +q(E +q). 도착 칸은 배정의 도착 칸, 취소된 이동은 출발 칸도 허용(카트에 남은 물건을 되돌림).
        카트 위 양 초과 409 MOVE_QTY_EXCEEDED. 모두 내려놓으면 COMPLETED. 같은 executionId 는 한 번.
      operationId: dropMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionId, toLocation, qty]
              properties:
                executionId: { type: string, maxLength: 128 }
                toLocation: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/move-allocations/{moveId}/cancellations:
    post:
      tags: [moves]
      summary: 이동 취소 — 아직 집지 않은 몫만 푼다 (0.12.0)
      description: |
        집지 않은 양의 MOVE 보류를 풀어 E 를 되돌리고 배정 수량을 집은 양으로 줄인다. 카트에 남은 물건은 실제로 내려놓아야(도착 칸 또는 출발 칸) 끝난다 —
        다 내려놓았으면 바로 CANCELLED, 아니면 CANCEL_PENDING. 이미 끝난 이동은 지금 상태.
      operationId: cancelMove
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 취소됨(또는 카트 정리 대기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveAllocation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /internal/move-allocations/{moveId}/exceptions:
    post:
      tags: [moves]
      summary: '[inbound→inventory] 이동·보충 현장 예외 — 아직 집지 않은 몫을 분실 조사 보류·격리로 (0.35.0)'
      description: |
        사용자 결정 2026-11-20 "이동·보충·적치 예외는 PICK 결품처럼". 진행 중(ACTIVE) 이동의 **아직 집지 않은 양** 안에서만(넘으면 409 MOVE_QTY_EXCEEDED).
        이동 수량 −q·MOVE 보류 −q 하고 출발 칸 NORMAL·STORED 에 — SHORT·BLOCKED: 분실 조사 보류(stock_hold, 실사가 해소), DAMAGED·SPOILED: QUARANTINED·STORED(격리 — mfc-quality 해제·폐기).
        E 순변화 없음(이동 배정 때 이미 뺐다) — 예약은 건드리지 않는다. 남은 수량을 다 내려놓았으면 COMPLETED, 아무것도 안 집었고 0 이 되면 CANCELLED.
        같은 reportId 는 한 번(같은 결과, 다른 내용 409 IDEMPOTENCY_CONFLICT).
      operationId: reportMoveException
      parameters:
        - { name: moveId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId, reason, qty]
              properties:
                reportId: { type: string, maxLength: 128, description: '보고 ID(mfc-inbound 예외 ID). 한 번만 반영' }
                reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED] }
                qty: { type: integer, minimum: 1 }
      responses:
        '201':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockExceptionResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/stock-exceptions:
    post:
      tags: [postings]
      summary: '[inbound→inventory] 예약 없는 재고의 현장 예외 — 분실 조사 보류·격리 (0.35.0)'
      description: |
        사용자 결정 2026-11-20. 입고 적치 등 예약과 묶이지 않은 재고(위치·SKU·LOT·업무 상태 STORED/UNSTOWED 의 NORMAL)에 PICK 결품과 같은 효과 —
        SHORT·BLOCKED = 분실 조사 보류(STORED 면 E−q, UNSTOWED 는 E 밖이라 변화 없음 — 그 양은 적치·이동 못 함), DAMAGED·SPOILED = QUARANTINED(같은 업무 상태, STORED 면 E−q).
        E 가 줄어 그 LOT 의 R 을 넘으면 품질 격리와 같은 규칙으로 넘는 양만 예약 조각 BLOCKED(사유 = reason) → 같은 SKU 적격 LOT 재확보 → 남은 것만 ReservationBlocked.
        위치 잔량(보류 제외) 부족 422 INSUFFICIENT_STOCK. 같은 reportId 는 한 번.
      operationId: reportStockException
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId, mfcId, sku, lotId, locationCode, reason, qty]
              properties:
                reportId: { type: string, maxLength: 128 }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                lotId: { type: string }
                locationCode: { type: string }
                workState: { type: string, enum: [STORED, UNSTOWED], default: STORED }
                reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED] }
                qty: { type: integer, minimum: 1 }
                sourceRef: { type: string, maxLength: 128, description: '원 작업(예: 입고 작업 ID) — 기록용' }
      responses:
        '201':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockExceptionResult' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
  /internal/reservations/{reservationId}/shortfall-releases:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 이행부족(BLOCKED) 해제 — 결품 수량을 주문에서 취소했을 때 (IV-09 2부, 0.6.0)'
      description: |
        ADR-0045. 그 주문 줄의 BLOCKED 조각을 qty 만큼 RELEASED 로(현물·R 변화 없음 — BLOCKED 는 R 이 아니라 D). BLOCKED 합보다 많으면 409 INVALID_STATE.
        같은 Idempotency-Key·같은 본문은 재생.
      operationId: releaseShortfall
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderLineId, qty, reason]
              properties:
                orderLineId: { type: string }
                qty: { type: integer, minimum: 1 }
                reason: { type: string, enum: [OUT_OF_STOCK_CANCELLED] }
      responses:
        '200':
          description: 해제됨 (appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reservations/{reservationId}/cancel-returns:
    post:
      tags: [reservations]
      summary: '[fulfillment→inventory] 집품 뒤 취소 — 집품·포장분 판매 제외(취소 복귀 대기), 나머지 예약·이행부족 해제 (IV-08, 0.7.0)'
      description: |
        ADR-0046. 피킹이 시작된 주문의 작업 중지(취소 선확정) 때 fulfillment 가 부른다. returns 는 이 예약의 **집품했지만 포장 안 한 양(PICKED)과
        포장한 양(PACKED)을 위치별로 전부** 적어야 한다(조각별 합이 집품·포장량과 다르면 409 RETURN_MISMATCH — 실물을 빠뜨리지 않게).
        - 단위: 그 위치의 NORMAL·PICKED/PACKED → NORMAL·CANCEL_RETURN_PENDING(E−q, H 그대로). 선반 복귀·적격 확인은 MOVE 실행에서(E+q).
        - 예약: 모든 HELD·CONFIRMED 조각 R−q(집지 않은 양 포함), BLOCKED(이행부족)까지 조각 전부 RELEASED, 예약 RELEASED(사유 reason).
        - 이미 RELEASED/EXPIRED 면 변화 없는 성공. 같은 Idempotency-Key·같은 본문은 재생.
      operationId: cancelReturn
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, returns]
              properties:
                reason: { type: string, maxLength: 32, description: '예 CANCEL_AFTER_PICK' }
                returns:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, sku, lotId, locationCode, workState, qty]
                    properties:
                      orderLineId: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lotId: { type: string }
                      locationCode: { type: string }
                      workState: { type: string, enum: [PICKED, PACKED] }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 반영됨 (appliedQty = 해제한 R)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reservations/{reservationId}/confirmations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 확정 (PG 승인 후, HELD→CONFIRMED, TTL 해제)'
      description: |
        이미 CONFIRMED 면 변경 없이 성공(appliedQty 0). EXPIRED/RELEASED 는 409 INVALID_STATE. orderId 가 예약과 다르면 409 INVALID_STATE.
        만료 시각이 지났어도 만료 작업이 아직 EXPIRED 로 바꾸기 전(HELD, 수량 점유 중)이면 확정한다.
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
        (0.11.1, 2026-11-08 사용자 결정) 결제 중 격리·실사 손실로 보류(BLOCKED)되어 다른 LOT 으로도 다시 잡지 못한 몫이 남아 있으면 409 RESERVATION_SHORT —
        가용 재고가 없는 주문은 확정하지 않는다(사가는 RESERVATION_LOST 로 결제를 보상 취소한다).
      operationId: confirmReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                paymentAttemptId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (EXPIRED/RELEASED/BLOCKED 예약) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/reservations/{reservationId}/releases:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 해제 (보상·취소; 피킹 후는 CANCEL_RETURN_PENDING 경유)'
      description: |
        피킹 전: R−q, A+q 즉시. 피킹 후(PICKED/PACKED 업무상태): E−q, R−q 후 CANCEL_RETURN_PENDING,
        복귀·적격 확인(CommitTaskExecution MOVE)으로만 E/A+q. 검증 없이 판매가능 복구 금지.
        부분 해제는 lines 지정. lines 생략 시 전량.

        슬라이스 4 구현: 피킹 업무상태가 아직 없어 모든 해제는 R−q 즉시. 부분 해제는 지원하지 않는다 — lines 가 예약 전량과 다르면
        422 PARTIAL_RELEASE_NOT_SUPPORTED. 이미 RELEASED/EXPIRED 면 변경 없이 성공(appliedQty 0).
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
      operationId: releaseReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [SAGA_COMPENSATION, CANCEL_BEFORE_PICK, CANCEL_AFTER_PICK, SHORTAGE, PAYMENT_FAILED, EXPIRED_MANUAL] }
                sourceRef: { type: string, description: stopRequestId / claimId / sagaId }
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/SkuQtyLine' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PARTIAL_RELEASE_NOT_SUPPORTED (lines 가 예약 전량과 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/reservations/{reservationId}/promised-date-changes:
    post:
      tags: [reservations]
      summary: "[orchestration S4→inventory] 예약 시간 변경 — 배송 약속일 바꾸기(잡힌 LOT 소비기한 재검사)"
      x-added-in: '2026-11-16'
      description: |
        S4 예약 시간 변경으로 배송 날짜가 바뀔 때(OMS §4 — "변경 시 … LOT 기한을 검증", "예약 시 적격이나 새 출고일에 미달 → 시간 변경 실패·기존 유효 예약 유지").
        예약을 잠근 뒤 지금 잡힌 LOT 조각(HELD·CONFIRMED)이 **새 약속일 기준으로도 적격**(소비기한 − 약속일 ≥ 최소 잔여일, 제조일 기준)일 때만 약속일을 바꾼다.
        하나라도 미달이면 422 LOT_EXPIRY_NOT_MET(details: field = sku, reason = lotId) — 예약은 그대로(다른 LOT 로 다시 잡지 않는다). 같은 날짜면 그대로 성공.
        활성(HELD·CONFIRMED)이 아니면 409 INVALID_STATE. 같은 Idempotency-Key 재전송은 같은 결과.
      operationId: changeReservationPromisedDate
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, promisedDate]
              properties:
                orderId: { type: string }
                promisedDate: { type: string, format: date, description: 새 배송 약속일(Asia/Seoul) }
      responses:
        '200':
          description: APPLIED (resultId = reservationId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: LOT_EXPIRY_NOT_MET
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/receipts:
    post:
      tags: [postings]
      summary: '[inbound→inventory] ConfirmReceipt — TIN 전기 (H+q; 정상분만 검수 후 E+)'
      description: |
        receiptId·departureId 유일성으로 중복 계상 방지. normalQty는 PENDING_INSPECTION으로 H+q,
        quarantinedQty는 Q+q, pendingQty는 미판정 보류. MfcReceiptPosted 발행 → cdc-inventory가 같은 receiptId로 Transit 대사.

        재고 모델 v2(ADR-0040, 0.2.0): 줄마다 수령 위치(toLocationCode, 필수)에 UNSTOWED 로 넣는다 — normalQty·pendingQty 는
        PENDING_INSPECTION(H+q), quarantinedQty 는 QUARANTINED(H+q·Q+q). **E 는 검수(INSPECT)·적치(PUTAWAY) 뒤에만 는다.**
        줄의 LOT: sourceLotRef 나 expiryDate 가 있으면 같은 SKU·표기·기한의 추적 LOT, 둘 다 없으면 수령마다 추적 미확인 LOT.
        inventory 가 발급한 lotId 는 GET /internal/receipts/{receiptId} 로 조회한다(검수·적치 명령에 쓴다).
        같은 receiptId·같은 내용은 처음 commitId 를 그대로 돌려주고(이중 계상 없음, Idempotency-Key 가 달라도), 다른 내용이면 409
        RECEIPT_ALREADY_POSTED. 수량 합이 0 이면 400. MfcReceiptPosted 는 아직 발행하지 않는다(TRF 경로 구현 시).
        수령 위치는 mfc-location 투영(MfcLocationStateChanged)으로 검사한다: 미등록 422 LOCATION_NOT_REGISTERED(전파 지연이면 재시도),
        ACTIVE 아님 409 LOCATION_CLOSED, 수령·회수 구역(RECEIVING·RETURN) 아님 409 LOCATION_ZONE_MISMATCH.
      operationId: confirmReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmReceiptRequest' }
      responses:
        '201':
          description: TIN COMMITTED (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / RECEIPT_ALREADY_POSTED (같은 receiptId 다른 본문)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/receipts/{receiptId}:
    get:
      tags: [postings]
      summary: '[inbound→inventory] 수령 결과 — 줄별 inventory lotId·수령 위치·수량'
      operationId: getReceipt
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/task-executions:
    post:
      tags: [postings]
      summary: '[inbound/fulfillment→inventory] CommitTaskExecution — 검수·적치·피킹·패킹·이동 결과 반영'
      description: |
        INSPECT: PENDING_INSPECTION→NORMAL(E+q) 또는 QUARANTINED(Q+q). PUTAWAY: UNSTOWED→STORED, 위치 변경, V 소비.
        PICK: STORED→PICKED, 위치 변경. PACK: PICKED→PACKED(장바구니 → 패킹대면 위치도). MOVE: 위치 이동(취소 복귀 포함, CANCEL_RETURN_PENDING→STORED 시 E/A+q).
        appliedQty < 요청량이면 PARTIAL_APPLIED.

        PICK·PACK(IV-07, 0.5.0): reservationId·lines[].orderLineId 필수. 예약이 CONFIRMED 이고 그 줄·LOT 의 CONFIRMED 조각에 남은 양
        (PICK: qty − pickedQty, PACK: pickedQty − packedQty)이 있어야 한다 — 예약에 없는 LOT 은 422 LOT_MISMATCH, 남은 양 초과는
        422 PICK_QTY_EXCEEDED. PICK 은 fromLocation(선반)의 NORMAL·STORED → toLocation(등록·ACTIVE·구역 **CART(장바구니)** 또는
        PACKING, 아니면 409 LOCATION_ZONE_MISMATCH — 0.19.0, 장바구니 허용)의 NORMAL·PICKED. PACK 은 fromLocation(집품 도착지 —
        장바구니 또는 포장 위치)의 PICKED → toLocation(없으면 fromLocation)의 PACKED, 이 최종 위치는 등록·ACTIVE·구역 PACKING
        이어야 한다(장바구니 안에서 PACKED 금지, 아니면 409 LOCATION_ZONE_MISMATCH — 0.19.0). H/E/R/A 총량 불변(위치·업무 상태만).
        피킹·포장 시작으로 출고 차감하지 않는다(인계 IV-08). MOVE 는 아직 501.

        구현(ADR-0040, 0.2.0): INSPECT(fromLocation 의 PENDING_INSPECTION/UNSTOWED → resultQuality/UNSTOWED)와
        PUTAWAY(fromLocation 의 NORMAL/UNSTOWED → toLocation 의 NORMAL/STORED, 이때 E+q). executionId 필수 — 같은 executionId 는
        요청 ID 가 달라도 한 번(다른 내용이면 409 EXECUTION_ALREADY_POSTED). lines[].lotId 는 inventory lotId.
        위치 잔량이 모자라면 422 INSUFFICIENT_STOCK.
        MOVE(0.7.0, ADR-0046) 는 지금 **취소 복귀**만: fromLocation 의 NORMAL·CANCEL_RETURN_PENDING → toLocation(선반·피킹, 온도대 = SKU 보관 유형)의
        NORMAL·STORED(E+q). resultQuality QUARANTINED 면 복귀 중 이상품 — toLocation 의 QUARANTINED·STORED(Q+q). 일반 선반 이동은 아직 없다.
        QUARANTINE_MOVE(0.35.0, IV-6): 격리품을 격리 구역으로 — fromLocation 의 QUARANTINED(UNSTOWED 먼저, 그다음 STORED) → toLocation 의 QUARANTINED·STORED.
        도착은 등록·ACTIVE·구역 QUARANTINE·온도대 = 상품 보관 유형(아니면 409 LOCATION_ZONE_MISMATCH·TEMPERATURE_ZONE_MISMATCH, 보관 유형 모르면 422 CONFIG_REQUIRED). H·Q·E 불변.
        위치 검사(mfc-location 투영): 출발 위치가 실사 잠금이면 409 LOCATION_CLOSED. PUTAWAY 목적지는 등록·ACTIVE·구역 STORAGE/PICKING·
        온도대 = SKU 보관 유형 — 아니면 422 LOCATION_NOT_REGISTERED / 409 LOCATION_CLOSED·LOCATION_ZONE_MISMATCH·TEMPERATURE_ZONE_MISMATCH,
        보관 유형을 모르면 422 CONFIG_REQUIRED.
      operationId: commitTaskExecution
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitTaskExecutionRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: VERSION_CONFLICT / INVALID_STATE (업무상태 전이 불가) / LOCATION_CLOSED / SPACE_EXCEEDED(V 부족)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (피킹 위치 잔량 부족) / PARTIAL_APPLIED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/package-handovers:
    post:
      tags: [postings]
      summary: '[fulfillment→inventory] CommitPackageHandover — 인계 전기 H−q, E−q, R−q 한 사건'
      description: |
        handoverAuthorizationId + fenceVersion 으로 fence 정합을 검증한다(ADR-0006). 같은 packageId 재전송은 기존 commitId 반환.
        성공 시 PackageHandedOverPosted 발행(commitId로 fulfillment의 PackageHandedOver와 연결).
        구현(0.8.0, 2026-11-08, ADR-0047): 포장 위치(locationCode)의 NORMAL·PACKED 단위 −q(H−q, E−q, A 불변) + 줄·LOT 의 확정 조각 R−q
        (`handed_qty` +q, 다 넘긴 조각 CONSUMED, 현물 점유 조각이 없으면 예약 CONSUMED) 한 확정 단위. 같은 packageId 는 요청 ID 가 달라도 한 번 —
        같은 handoverAuthorizationId·fenceVersion 이면 처음 commitId(201 재생), 다르면 409 FENCE_VERSION_MISMATCH. 예약이 CONFIRMED 가 아니면 409
        INVALID_STATE, 줄·LOT 의 (포장 − 인계)보다 많으면 409 HANDOVER_QTY_EXCEEDED, 위치에 PACKED 가 모자라면 422 INSUFFICIENT_STOCK.
      operationId: commitPackageHandover
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitPackageHandoverRequest' }
      responses:
        '201':
          description: 인계 전기 완료 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409':
          description: INVALID_STATE (예약 BLOCKED/RELEASED) / FENCE_VERSION_MISMATCH / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (PACKED 잔량 < 인계량)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/shortage-reports:
    post:
      tags: [postings]
      summary: '[fulfillment→inventory] 피킹 결품·파손 보고 — 판매 제외·예약 BLOCKED·같은 SKU 적격 LOT 재확보 (IV-09, 0.6.0)'
      description: |
        IV-09·ADR-0042 결정 1·ADR-0044. 같은 reportId 는 한 번만 반영(같은 결과 재생, 다른 내용이면 409 IDEMPOTENCY_CONFLICT).
        1. 판매 제외: DAMAGED(파손)·SPOILED(변질, 0.32.0) 는 실제 있는 이상품 — 그 위치·LOT 의 NORMAL·STORED → QUARANTINED(Q+q, E−q). SHORT·BLOCKED 는 실물을 찾지 못함 —
           격리 현물을 만들지 않고 **분실 조사 보류**(stock_hold, E−q, H·단위 행 그대로)로 둔다. 확인된 실제 손실은 실사(IV-11)에서.
           위치 잔량(보류 제외)이 모자라면 422 INSUFFICIENT_STOCK.
        2. 예약: 그 주문 줄·LOT 의 CONFIRMED 조각 중 아직 집지 않은 양에서 q 만큼 R−q. 남은 양보다 많으면 422 PICK_QTY_EXCEEDED.
        3. 재확보: 같은 SKU 의 적격 LOT(소비기한 보장·보관 유형 최소 잔여일·배송 약속일, FEFO)에서 신규 가용(A=E−R) 안으로 다시 잡는다 —
           확정 조각(CONFIRMED)으로 R+r. 다른 주문의 예약은 건드리지 않는다. 다른 SKU 로는 바꾸지 않는다.
        4. 못 잡은 양 u = q − r 는 BLOCKED 조각(이행부족 D)으로 남기고 ReservationBlocked(mfc.inventory.v1) 발행.
      operationId: reportShortage
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShortageReportRequest' }
      responses:
        '201':
          description: 반영 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortageReportResult' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK / PICK_QTY_EXCEEDED / LOT_MISMATCH / LINE_NOT_IN_RESERVATION
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quality-postings:
    post:
      tags: [postings]
      summary: '[quality→inventory] 격리/해제/폐기 반영 (approvalRef 필수)'
      description: |
        QUARANTINE: Q+q, E−q, 영향 ReservationPart→BLOCKED, ReservationBlocked(영향 orderId 포함) 발행.
        RELEASE: Q−q, E+q. DISPOSE: 승인 잔량 내 H−q, Q−q. 승인 잔량 초과는 APPROVAL_REQUIRED.
        구현(0.9.0, 2026-11-08): 줄마다 sku·lotId·locationCode·qty 필수, workState STORED(기본)/UNSTOWED — 그 위치·LOT·업무 상태의 단위 행.
        QUARANTINE = NORMAL → QUARANTINED(E 는 STORED 일 때만 −q). LOT 의 R 이 남은 E 를 넘으면 넘는 양만 그 LOT 의 아직 집지 않은
        HELD·CONFIRMED 조각을 **나중에 잡은 예약부터** 줄여 BLOCKED 조각(사유 QUALITY_HOLD) + ReservationBlocked. 자동 재배분 없음(MFC Q-13).
        RELEASE = QUARANTINED → NORMAL(같은 업무 상태 — UNSTOWED 는 적치 뒤 판매). DISPOSE = QUARANTINED −q(승인 잔량은 mfc-quality 가 지킴).
        집품·포장분(PICKED/PACKED)은 결품·파손 보고(shortage-reports)로. 같은 Idempotency-Key 는 같은 결과. 부족 422 INSUFFICIENT_STOCK.
        (0.35.0, IV-6) RELEASE·DISPOSE 는 옮겨진 격리품을 따라간다: 줄의 위치·업무 상태에 QUARANTINED 가 모자라면 같은 LOT 의 격리 구역(QUARANTINE) 칸에서 나머지를 뺀다.
        RELEASE 가 선반·피킹 밖(격리·수령·반품 구역) 칸에서 일어나면 결과는 NORMAL·UNSTOWED(E 변화 없음 — mfc-inbound 적치 작업 뒤 판매).
      operationId: postQualityDecision
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityPostingRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (승인 잔량 초과·승인 참조 없음) / INSUFFICIENT_STOCK
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/adjustments:
    post:
      tags: [postings]
      summary: '[backoffice/실사→inventory] 재고 조정 집행 CNT/ADJ (approvalRef 필수)'
      description: 실사 수량(CNT) 또는 차이 조정(ADJ). 승인된 수량 범위 내에서만 집행하며 InventoryAdjustmentPosted를 발행해 approval 실행 축을 갱신한다.
      operationId: postAdjustment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: 조정 반영 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / INVARIANT_VIOLATION (0≤R≤E≤H 위반)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/availability:
    get:
      tags: [queries]
      summary: '[cart/commerce→inventory] 가용 수량 A = E − R (센터·SKU)'
      description: 조회 사본이며 성공을 확정하지 않는다. 산출 실패·미설정 시 0을 반환하지 않고 503으로 응답한다.
      operationId: getAvailability
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: sku
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
        - name: deliveryDate
          in: query
          required: false
          description: '(0.24.0, IV-1) 출하 가능 판정 기준일 = 배송 약속일(Asia/Seoul). 없으면 오늘 — 예약 주문은 약속일을 주면 예약과 같게 판정'
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/snapshots:
    get:
      tags: [queries]
      summary: '[SCM/replenishment→inventory] 센터 재고 스냅샷 (H/Q/E/R/A, 위치·LOT·품질상태별)'
      description: '구현(0.10.0, 2026-11-08): 0 초과 단위 행(위치·SKU·LOT·품질·업무 상태)과 LOT 소비기한, SKU·LOT·위치 순 키셋 페이지(cursor = 앞 페이지 마지막 키). reservedQty 는 비움 — 예약은 LOT 단위라 위치 줄에 나누지 않는다(LOT 합계는 GET /mfcs/{mfcId}/stock).'
      operationId: getSnapshot
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: locationCode, in: query, schema: { type: string }, description: '0.10.0 — 한 위치만(mfc-location 위치 폐지 전 잔량 확인)' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Balance' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/commits/{commitId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — commitId로 전기 내역 확인
      operationId: getCommit
      parameters:
        - { name: commitId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commit' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/requests/{requestId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — requestId(=Idempotency-Key)로 inventory_apply_status 확인 (UNKNOWN_RESULT 해소)
      description: |
        호출 서비스(X-Source-System = 토큰 주체)의 요청만 찾는다. 전기(commit)를 만든 요청은 APPLIED + commitId.
        기록됐지만 수량 변화가 없던 요청(이미 확정·해제된 예약 등)은 APPLIED, commitId null.
        거절(4xx)로 끝난 요청은 기록되지 않으므로 404 — 반영되지 않았다는 뜻이다(같은 키로 다시 보내면 다시 판정).
      operationId: getRequestResult
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  applyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
                  commitId: { type: [string, 'null'] }
                  appliedQty: { type: integer }
                  rejectReason: { type: string }
                  occurredAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/lot-labels/{lotId}:
    get:
      tags: [lot-labels]
      summary: '[운영자] LOT 라벨 인쇄 정보·라벨 값 해석 (0.20.0)'
      description: |
        라벨 바코드는 GS1-128 `gs1`(0.21.0, IV-4) — PDA 는 찍은 값의 `(10)` LOT 번호를 피킹 지시 `picks[].lotNo` 와 바로 대조할 수 있다(이 조회 없이).
        예전 QR 값 `LOT:{lotId}`(`labelValue`)도 그대로 준다 — 이미 붙인 라벨 해석용.
        이 조회는 인쇄 정보(상품명·소비기한·제조일·납입일 등)와 그 센터 보유량을 준다 — 입고 품질검사 뒤 라벨 출력, 재출력, 찍은 라벨의 유통기한·품질 확인에.
        그 센터 운영자. LOT 자체가 없으면 404 LOT_NOT_FOUND. 그 센터에 보유가 없어도(다 나갔어도) LOT 정보는 준다(onHand 0).
        붙일 장수는 이 조회가 아니라 그때의 수량 — 품질검사 합격 수량(낱개 SKU 는 낱개마다, 박스 SKU 는 박스마다 — 모두 SKU 단위 수량).
        제조사·공급사는 MFC 에 없어 싣지 않는다.
      operationId: getLotLabel
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: lotId, in: path, required: true, schema: { type: string, maxLength: 40 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LotLabel' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/lot-numbers:
    get:
      tags: [lot-labels]
      summary: LOT 번호 일괄 조회 (0.30.0, ADR-0070)
      description: |
        화면이 시스템 LOT ID(LOT-…) 대신 **LOT 번호**(`lotNo`, 예 L261107000497)를 보이려고 — 품질 판정·사고·입고·이동 응답은 lotId 만 준다.
        그 센터 운영자. `lotIds` 반복 1~200(같은 값은 한 번). LOT 은 센터와 무관한 정본이라 그 센터 보유와 상관없이 답한다. 모르는 ID 는 빠진다.
      operationId: getLotNumbers
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: lotIds
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: { type: string, maxLength: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [lotId]
                      properties:
                        lotId: { type: string }
                        lotNo: { type: [string, 'null'] }
                        sku: { type: string }
                        productName: { type: [string, 'null'] }
                        expiryDate: { type: [string, 'null'], format: date }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /mfcs/{mfcId}/lot-labels:
    get:
      tags: [lot-labels]
      summary: '[운영자] 재출력할 LOT 찾기 — SKU 또는 위치로 (0.20.0)'
      description: |
        라벨이 훼손돼 값을 모를 때. `sku` 나 `locationCode` 중 하나 이상(없으면 400). 그 센터에 지금 보유가 있는(H > 0) LOT 만, 소비기한 이른 순
        (없으면 뒤), 최대 100건. locationCode 를 주면 그 위치에 있는 LOT 만이고 `qtyAtLocation` 을 채운다. 재출력은 물류 실적이 아니라 기록하지 않는다.
      operationId: listLotLabels
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: locationCode, in: query, required: false, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LotLabel' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/lot-resolutions:
    get:
      tags: [lot-labels]
      summary: '[운영자] 찍은 LOT 바코드로 LOT 찾기 — GS1-128 (0.21.0, IV-4)'
      description: |
        `code` = 스캐너 원문(앞 `]C1` 심볼 식별자 허용, 가변 길이 뒤 그룹 구분자 GS)이나 괄호 꼴 `(01)…(17)…(10)…`, 또는 예전 QR `LOT:{lotId}`.
        GS1 은 `(10)` LOT 번호로 LOT 을 찾고, `(01)` 이 있으면 그 LOT SKU 의 상품 바코드(GTIN-14 로 맞춤) 중 하나와 같아야, `(17)` 이 있으면 LOT 소비기한과
        같아야 한다(아니면 422 `GS1_MISMATCH` — 다른 상품·다른 LOT 의 라벨). AI 는 01·10·11·15·17·21 만 읽는다. 응답은 라벨 단건과 같다(그 센터 보유 포함).
        입고 검수·이동·실사 화면에서 찍은 LOT 을 지시 lotId 와 대조할 때. 피킹은 `picks[].lotNo` 로 바로 대조해도 된다. 그 센터 운영자.
      operationId: resolveLot
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: code, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LotLabel' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422':
          description: GS1_MISMATCH — (01) 상품·(17) 소비기한이 그 LOT 과 다르다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/stock:
