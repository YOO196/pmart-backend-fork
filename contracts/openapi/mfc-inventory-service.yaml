              schema:
                type: object
                required: [mfcId, asOf, items]
                properties:
                  mfcId: { type: string }
                  asOf: { type: string, format: date-time, description: 읽은 시각 }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CenterStock' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/stock-units:
    get:
      tags: [queries]
      summary: '[운영자] 센터 재고 목록 — 상품 코드 없이 위치·상품·LOT·품질로 (0.26.0, MB-1)'
      description: |
        센터 관리자 웹 재고 > 센터 재고("지금은 상품 코드를 알아야만 본다"). 그 센터 운영자(역할 무관 — `/stock` 과 같다). 수량 > 0 인 단위 행
        (위치·SKU·LOT·품질 상태·업무 상태)만, 거르기는 모두 선택: `sku`·`locationCode`(정확히)·`lotId`·`qualityState`·`workState`.
        위치 → SKU → LOT 순, 커서 = 응답 `nextCursor`(불투명 값 — 그대로 다시 보낸다), size ≤ 200. 상품명·LOT 번호·소비기한 사본을 같이 준다.
        LOT 요약(H/Q/E/R)은 상품별 `GET /mfcs/{mfcId}/stock?sku=`(여러 상품은 `GET /mfcs/{mfcId}/stocks`).
        (0.33.0, 시뮬레이터 R-15 — 칸 단위 재고) `locationPrefix` = 위치 코드가 이 값으로 시작하는 것(예 `C-B1-01`), `zone`·`temperatureZone` = 이 서비스가
        mfc-location 사건(MfcLocationStateChanged)으로 받아 둔 위치 사본 기준 — 사본에 없는 위치의 행은 이 둘로 거르면 빠지고, 항목의 `zone`·`temperatureZone` 은 null.
        `asOf` = 이 응답을 읽은 시각(같은 순간의 센터 전체 사진은 아니다 — 쪽마다 따로 읽는다). 센터 전체를 그리려면 거르기 없이 `nextCursor` 가 null 일 때까지.
      operationId: listStockUnits
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: locationCode, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: lotId, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: qualityState, in: query, required: false, schema: { $ref: '#/components/schemas/QualityState' } }
        - { name: workState, in: query, required: false, schema: { $ref: '#/components/schemas/WorkState' } }
        - { name: locationPrefix, in: query, required: false, description: '(0.33.0) 위치 코드 앞부분(대소문자 구분)', schema: { type: string, maxLength: 64 } }
        - { name: zone, in: query, required: false, description: '(0.33.0) 위치 구역(mfc-location ZoneKind 값 — 예 STORAGE·PICKING·PACKING·CART·DISPATCH_STAGING)', schema: { type: string, maxLength: 20 } }
        - { name: temperatureZone, in: query, required: false, description: '(0.33.0) 위치 온도대(예 AMBIENT·CHILLED·FROZEN)', schema: { type: string, maxLength: 10 } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  asOf: { type: string, format: date-time, description: '(0.33.0) 이 쪽을 읽은 시각' }
                  items:
                    type: array
                    items:
                      type: object
                      required: [locationCode, sku, lotId, qualityState, workState, qty]
                      properties:
                        locationCode: { type: string }
                        sku: { type: string }
                        productName: { type: [string, 'null'] }
                        lotId: { type: string }
                        lotNo: { type: [string, 'null'] }
                        expiryDate: { type: [string, 'null'], format: date }
                        qualityState: { $ref: '#/components/schemas/QualityState' }
                        workState: { $ref: '#/components/schemas/WorkState' }
                        qty: { type: integer }
                        zone: { type: [string, 'null'], description: '(0.33.0) 위치 사본의 구역 — 사본에 없으면 null' }
                        temperatureZone: { type: [string, 'null'], description: '(0.33.0) 위치 사본의 온도대 — 사본에 없으면 null' }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /mfcs/{mfcId}/stock-corrections:
    post:
      tags: [postings]
      summary: '[운영자] LOT·위치 정정(CORRECTION) — 총량 불변, 원장에 정정 사건'
      description: |
        이미 있는 재고의 LOT 식별(제조 LOT 표기·소비기한)이나 위치를 바로잡는다(WMS 문서 LOT 식별 정정 — H 증감 0). 줄마다 출발 단위 행
        (위치·LOT·품질·업무상태)에서 qty 를 빼서, 목적 위치(없으면 같은 위치)·목적 LOT(toSourceLotRef·toExpiryDate 가 있으면 그 추적 LOT,
        없으면 같은 LOT)으로 옮긴다. 품질·업무상태는 바꾸지 않는다. 목적 위치가 STORED 면 적치와 같은 위치 검사. 예약(R)이 걸린 수량은 옮길 수
        없다(LOT 의 R ≤ E — 409 INVARIANT_VIOLATION). 그 센터의 운영자만.
        본사 승인 기준(AP-1, 0.22.0 — `pmart.approval-ref.mode: VERIFY`): 한 건 손실 Σ(감소 수량 × pricing 판매 기준가) ≥ `hq-loss-krw`(10만 원) 또는 한 SKU 움직이는 수량 ≥ `hq-sku-qty`(20개)면 본사 재고 승인 — approvalRef 가 없으면 422 APPROVAL_REQUIRED 이고 details 의 `field=approvalRequest` 의 reason 이 approval-service `POST /change-requests` 에 그대로 보낼 본문 JSON(type MFC_STOCK_ADJUSTMENT, targetRef `<mfcId>:<kind>:<ref>`, SKU 별 lines), `field=threshold` 가 걸린 기준. 승인 번호를 approvalRef 로 다시 보내면 집행 전 approval-service 에서 한 번 쓴다(쓸 수 없거나 SKU 수량이 승인보다 많으면 422 APPROVAL_REQUIRED). 기준 아래면 센터 관리자 승인만(approvalRef 선택, 확인 없이 기록). 단가 없는 감소 SKU 는 미평가 → 본사. `RECORD_ONLY`(LAN 시험) 는 예전처럼 approvalRef 필수·확인 없음. 정정은 총량 불변이라 손실 0 — 수량 기준만 걸린다. kind = CORRECTION, ref = 이 요청의 Idempotency-Key(승인을 받은 뒤 **같은 키**로 다시 보낸다).
        (0.26.0, MB-3) 그 센터 MFC_SUPERVISOR 만 — 작업자 403.
      operationId: correctStock
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockCorrectionRequest' }
      responses:
        '201':
          description: 정정 반영 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK / LOCATION_NOT_REGISTERED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/count-sessions:
    get:
      tags: [counts]
      summary: '[운영자] 순환 실사 목록 — 승인 대기 등 (0.26.0, MB-1)'
      description: |
        센터 관리자 웹 재고 > 순환 실사. 그 센터 운영자(단건과 같다). `state` 반복, 비우면 끝나지 않은 것(COUNTING·RECOUNT_REQUIRED·PENDING_APPROVAL) —
        끝난 것(MATCHED·ADJUSTED·REJECTED·CANCELLED(0.34.0))은 state 로 고를 때만. 시작(장부 기준 baselineAt) 오래된 순, 커서 = 마지막 sessionId, size ≤ 200.
        항목은 단건 응답과 같다(계수 중이면 differences null).
      operationId: listCountSessions
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: state
          in: query
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [COUNTING, RECOUNT_REQUIRED, PENDING_APPROVAL, MATCHED, ADJUSTED, REJECTED, CANCELLED] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CountSession' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [counts]
      summary: '[운영자] 순환 실사 시작(IV-11, 0.10.0) — 실사 잠금 위치의 장부 기준 고정'
      description: |
        그 센터 운영자 + MFC_WORKER·MFC_SUPERVISOR. 위치마다 mfc-location 에서 실사 잠금(COUNT_LOCKED)이어야 한다(409 LOCATION_NOT_LOCKED —
        잠금 실패는 계수 시작 차단). 대상 = 그 위치의 판매 단위(NORMAL·STORED) — 위치·SKU·LOT 별 장부 수량과 조사 보류(IV-09 결품 보고)를
        기준 시각에 고정한다. 응답의 계수표(sheet)에는 수량이 없다(첫 계수 장부 숨김). 같은 위치가 열린 실사에 있으면 409 COUNT_IN_PROGRESS.
      operationId: createCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCodes]
              properties:
                locationCodes: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                reason: { type: string, maxLength: 200, description: '순환 실사·차이 조사·확정 오류 정정 등' }
      responses:
        '201':
          description: 실사(COUNTING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}:
    get:
      tags: [counts]
      summary: '[운영자] 실사 조회 — 계수 중에는 장부·차이를 보이지 않는다'
      operationId: getCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/counts:
    post:
      tags: [counts]
      summary: '[작업자] 계수·재계수 제출'
      description: |
        MFC_WORKER·MFC_SUPERVISOR. 줄 = 위치·SKU·LOT·센 수량. 계수표에 있는데 줄이 없으면 0 으로 센 것. 계수표에 없는 SKU·LOT 도 낼 수 있다(찾은 재고).
        첫 계수가 장부와 같고 조사 보류가 없으면 MATCHED(끝). 다르면 RECOUNT_REQUIRED — **다른 작업자**가 재계수(같은 사람은 409 SAME_COUNTER).
        재계수가 장부와 같고 보류가 없으면 MATCHED, 아니면 PENDING_APPROVAL(최종 수량 = 재계수). 첫 계수가 같아도 조사 보류가 있으면 PENDING_APPROVAL
        (보류 해소도 승인 뒤). 계수 단계가 아닌 실사는 409 INVALID_STATE.
        (0.34.0, BR-52 R19-6) `unexpectedLines` = 계수표에 없는 상품을 칸에서 찾은 것 — sku 또는 barcode(상품 바코드 → SKU 사본) 하나는 있어야, lotId(LOT 라벨을 찍었으면)
        또는 expiryDate. LOT 은 lotId 가 있으면 그것(그 SKU 의 LOT 이어야 — 아니면 400), 없으면 그 SKU 에서 소비기한이 같은 LOT 이 **하나뿐일 때만** 그 LOT.
        정해지면 `lines` 의 줄과 같이 센다(장부 0 → 찾은 수량만큼 차이). 정하지 못하면(모르는 바코드·LOT 없음·여럿) 조정하지 않고
        `unresolvedLines` 로 남긴다 — 그런 줄이 있으면 장부와 같아도 MATCHED 가 아니다(첫 계수면 재계수, 재계수면 승인 대기). 승인은 정해진 차이만 반영하고,
        정하지 못한 물건은 센터 관리자가 따로(입고·정정) 처리한다.
      operationId: submitCount
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [locationCode, sku, lotId, countedQty]
                    properties:
                      locationCode: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      lotId: { type: string }
                      countedQty: { type: integer, minimum: 0 }
                unexpectedLines:
                  type: array
                  maxItems: 100
                  description: '(0.34.0, BR-52 R19-6) 계수표 밖에서 찾은 상품·LOT'
                  items: { $ref: '#/components/schemas/CountUnexpectedLine' }
      responses:
        '200':
          description: 제출 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/approvals:
    post:
      tags: [counts]
      summary: '[센터 관리자] 실사 차이 승인(조정 ADJ 반영) / 반려'
      description: |
        MFC_SUPERVISOR, 실사를 시작·계수한 사람이 아니어야 한다(422 SELF_APPROVAL). PENDING_APPROVAL 만. APPROVE 의 approvalRef:
          본사 승인 기준(AP-1, 0.22.0 — `pmart.approval-ref.mode: VERIFY`): 한 건 손실 Σ(감소 수량 × pricing 판매 기준가) ≥ `hq-loss-krw`(10만 원) 또는 한 SKU 움직이는 수량 ≥ `hq-sku-qty`(20개)면 본사 재고 승인 — approvalRef 가 없으면 422 APPROVAL_REQUIRED 이고 details 의 `field=approvalRequest` 의 reason 이 approval-service `POST /change-requests` 에 그대로 보낼 본문 JSON(type MFC_STOCK_ADJUSTMENT, targetRef `<mfcId>:<kind>:<ref>`, SKU 별 lines), `field=threshold` 가 걸린 기준. 승인 번호를 approvalRef 로 다시 보내면 집행 전 approval-service 에서 한 번 쓴다(쓸 수 없거나 SKU 수량이 승인보다 많으면 422 APPROVAL_REQUIRED). 기준 아래면 센터 관리자 승인만(approvalRef 선택, 확인 없이 기록). 단가 없는 감소 SKU 는 미평가 → 본사. `RECORD_ONLY`(LAN 시험) 는 예전처럼 approvalRef 필수·확인 없음. kind = COUNT_ADJUSTMENT, ref = sessionId, SKU 별 수량 = 차이 |증감| 합, 손실 = 순감소.
        반영 직전 장부가 기준 시각과 다르면 409 BOOK_CHANGED(다시 실사). 반영 = 한 확정 단위(COUNT_ADJ): 위치·SKU·LOT 별 (최종 − 장부)만큼 NORMAL·STORED
        증감, 그 위치 조사 보류는 모두 해소(찾은 것은 E 복귀, 없는 것은 손실). E 가 줄어 LOT 의 R 을 넘으면 넘는 양만 나중 예약부터 BLOCKED(COUNT_LOSS) +
        ReservationBlocked. 증감이 있으면 StockAdjusted. 같은 승인 재요청은 지금 실사(한 번만 반영). REJECT → REJECTED(변화 없음, 보류 그대로).
        실사 잠금 해제는 mfc-location 에서 따로(시간 만료로 자동 해제하지 않음). (0.34.0) 실사 계획으로 만든 실사는 mfc-location 잠금을 보지 않고 이 서비스의
        잠금을 쓴다 — 승인·반려로 끝나면 그 칸 잠금이 풀린다. 정하지 못한 목록 밖 줄(unresolvedLines)은 조정하지 않는다.
      operationId: decideCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                approvalRef: { type: string, maxLength: 128 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 결정 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /stock-summaries:
    get:
      tags: [stock]
      summary: 센터별 품절 상품 수 (0.28.0, 요청 IV-5)
      description: |
        백오피스 대시보드 D5. 센터마다 **취급 ON 상품** 기준 — `handledSkuCount` = 취급 ON 상품 수, `soldOutSkuCount` = 그중 가용(A = 판매 가능 E − 예약 R) ≤ 0 인 상품 수
        (재고 행이 없으면 0 으로 봄). 안전재고(Q-13)는 정해지지 않아 쓰지 않는다 — "재고 부족"이 아니라 **"품절"**(사용자 결정 2026-11-18). 취급 ON 상품이 하나도 없는 센터는 줄이 없다.
        권한: OPERATOR_ADMIN·서비스는 모든 센터(mfcId 선택), 그 밖 운영자는 토큰 센터만(mfcId 를 주면 그 센터 — 권한 없으면 403). 지금 값(조회 시각 `asOf`).
      operationId: getStockSummaries
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK (센터 순)
          content:
            application/json:
              schema:
                type: object
                required: [items, asOf]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [mfcId, handledSkuCount, soldOutSkuCount]
                      properties:
                        mfcId: { type: string }
                        handledSkuCount: { type: integer }
                        soldOutSkuCount: { type: integer }
                  asOf: { type: string, format: date-time }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /mfcs/{mfcId}/sku-handlings:
    get:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 목록 (취급 레코드가 없으면 OFF)'
      description: |
        상품 SKU 투영(SkuIssued/ProductVersionPublished)에 있는 SKU 전체를 이 센터의 취급 여부와 함께 돌려준다.
        취급 레코드가 없으면 OFF(handlingEnabled=false, version 0)이다(사용자 결정 2026-10-30: 기본 OFF, 센터 운영자가 켬).
        토큰의 centers 클레임에 mfcId 가 없으면 403.
      operationId: listSkuHandlings
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: enabled, in: query, required: false, description: 'true=ON 만, false=OFF(레코드 없음 포함)만, 생략=전체', schema: { type: boolean } }
        - { name: undecided, in: query, required: false, description: '(0.27.0) true = 이 센터가 한 번도 정하지 않은 상품만(레코드 없음, 단종 제외) — 신상품 배너', schema: { type: boolean }, x-added-in: '2026-11-19' }
        - { name: introducedSince, in: query, required: false, description: '(0.27.0) 이 시각 이후 생긴 상품(SkuIssued)만. 생긴 시각을 모르는 예전 상품은 빠진다', schema: { type: string, format: date-time }, x-added-in: '2026-11-19' }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (SKU 오름차순, 커서 = 마지막 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 변경 (자기 센터만)'
      description: |
        켜기(enabled=true)는 SKU 투영이 있고 state=ACTIVE 일 때만(INACTIVE → 422 SKU_INACTIVE). 끄기는 항상 허용.
        (0.27.0) 본사 단종(saleState DISCONTINUED)인 동안 켜기는 409 `SKU_DISCONTINUED`(일괄도 그 행 사유).
        현재 값과 같으면 변경·이력 없이 현재 상태를 돌려준다(changed=false). 바뀌면 이력을 남기고 version +1.
        X-Expected-Version 은 이 센터·SKU 취급 레코드의 version(레코드가 없으면 0).
        (0.26.0, MB-3) 그 센터의 MFC_SUPERVISOR 또는 MD 만.
      operationId: changeSkuHandling
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingChange' }
      responses:
        '200':
          description: 반영(같은 키·같은 본문 재요청은 저장된 결과 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영이 아직 없음 — 상품 승인 이벤트 수신 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_INACTIVE (비활성 SKU 는 켤 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/sku-handling-batches:
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 일괄 변경 (최대 500행, 전부 또는 전무)'
      description: |
        모든 행을 먼저 검증하고 하나라도 실패하면 아무것도 바꾸지 않는다(422 SKU_HANDLING_BATCH_REJECTED, details[].field = items[i]).
        행 규칙은 단건과 같다. 같은 SKU 가 두 번 나오면 400 VALIDATION_FAILED.
        (0.26.0, MB-3) 그 센터의 MFC_SUPERVISOR 또는 MD 만.
      operationId: changeSkuHandlingBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingBatchRequest' }
      responses:
        '200':
          description: 전 행 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingBatchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_HANDLING_BATCH_REJECTED (행별 SKU_NOT_FOUND / SKU_INACTIVE / VERSION_CONFLICT 를 details 에)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/sku-handling-republications:
    post:
      tags: [sku-handlings]
      summary: '[운영 도구→mfc-inventory] 지금 취급 상태를 SkuHandlingChanged 로 다시 알린다'
      description: |
        취급 레코드마다 현재 상태(켬·끔, 행 버전)를 SkuHandlingChanged(republished=true)로 다시 발행한다(mfc.sku-handling.v1).
        상태는 바꾸지 않으므로 같은 Idempotency-Key 로 다시 불러도 다시 발행한다. 사건 발행 전부터 있던 취급(2026-11-05 이전)을 검색 색인에 처음 연결할 때, 구독 쪽 사본을 복구할 때 쓴다.
        같은 버전을 다시 받은 구독자는 무시하므로 여러 번 불러도 결과가 같다. mfcId 를 주면 그 센터만. 한 번에 최대 20000건(넘으면 422).
      operationId: republishSkuHandlings
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: 다시 발행한 건수
          content:
            application/json:
              schema:
                type: object
                required: [publishedCount]
                properties:
                  publishedCount: { type: integer, minimum: 0 }
        '422':
          description: DOMAIN_REJECTED — 건수 상한 초과, 센터를 나눠 부른다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/cancellation:
    post:
      tags: [counts]
      summary: '[센터 관리자] 실사 취소 (0.34.0, BR-52 R14·R19-7)'
      description: |
        MFC_SUPERVISOR. 끝나지 않은 실사(COUNTING·RECOUNT_REQUIRED·PENDING_APPROVAL) → CANCELLED, 재고 변화 없음(조사 보류 그대로). 계획 실사면 그 칸 잠금이 풀린다.
        예외 보고(칸 접근 불가 등)로 멈춘 실사를 정리할 때. 이미 CANCELLED 면 지금 실사, 다른 끝난 상태면 409 INVALID_STATE.
        mfc-location 에서 직접 잠근(COUNT_LOCKED) 칸의 잠금은 그대로다(풀기는 mfc-location 에서).
      operationId: cancelCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 취소 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/exceptions:
    post:
      tags: [counts]
      summary: '[작업자] 실사 예외 보고 — 칸 접근 불가·파손 발견 (0.34.0, BR-52 R19-7)'
      description: |
        MFC_WORKER·MFC_SUPERVISOR, 계수 단계(COUNTING·RECOUNT_REQUIRED)만(아니면 409 INVALID_STATE). 사유:
        `LOCATION_INACCESSIBLE`(칸에 갈 수 없음·막힘 — 셀 수 없다), `DAMAGE_FOUND`(파손품 발견 — sku·lotId·qty 선택). 칸은 이 실사의 칸이어야 한다.
        **재고는 바꾸지 않는다** — 기록하고 센터 관리자에게 넘긴다: 예외가 있는 실사는 다음 작업 후보(`/internal/count-work`)에서 빠지고, 관리자가 실사를
        취소(`…/cancellation` — 계획 잠금 풀림)하거나, 막힘이 풀린 뒤 다시 시작(`…/resumption`, 0.35.0 — 후보로 돌아감)하거나, 누군가 계수를 내면 그대로 이어진다.
        파손품 격리는 품질 절차(mfc-quality)로 따로. 같은 Idempotency-Key 는 한 번만 기록.
      operationId: reportCountException
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, locationCode]
              properties:
                reason: { type: string, enum: [LOCATION_INACCESSIBLE, DAMAGE_FOUND] }
                locationCode: { type: string }
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                lotId: { type: string }
                qty: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 기록 뒤 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-sessions/{sessionId}/resumption:
    post:
      tags: [counts]
      summary: '[센터 관리자] 예외로 멈춘 실사 다시 시작 (0.35.0, BR-52 R19-7 후속)'
      description: |
        MFC_SUPERVISOR. 계수 단계(COUNTING·RECOUNT_REQUIRED)만(아니면 409 INVALID_STATE). 해결되지 않은 예외(`exceptions[].resolvedAt` 이 null)를 모두
        해결로 표시(resolvedBy = 나, resolvedAt, resolutionNote = 본문 note)하면 실사가 다시 `/internal/count-work` 후보가 된다 — **누구에게 줄지는 정하지 않는다**
        (보고한 작업자를 먼저 주지 않음, 사용자 결정 2026-11-20). 재계수 단계면 첫 계수자는 여전히 제외(`excludedOperatorIds`). 재고·장부 기준·칸 잠금은 그대로다.
        열린 예외가 없으면 아무것도 바꾸지 않고 지금 실사(재시도 안전).
      operationId: resumeCountSession
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500, description: '어떻게 풀었는지(예: 통로 정리함)' }
      responses:
        '200':
          description: 다시 시작한 실사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountSession' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /mfcs/{mfcId}/count-plans:
    post:
      tags: [counts]
      summary: '[센터 관리자] 실사 계획 — 칸 묶음을 서버가 잠그고 칸마다 실사를 만든다 (0.34.0, BR-52 R14)'
      description: |
        사용자 결정(2026-11-20) "관리자가 계획·서버 잠금". 그 센터 MFC_SUPERVISOR. 칸 1~200개, 칸마다 실사(COUNTING) 하나 — 기준 시각에 그 칸 판매 단위
        (NORMAL·STORED) 장부·조사 보류를 고정한다(수동 실사와 같다). **mfc-location 의 COUNT_LOCKED 는 필요 없다** — 계획 실사가 끝나지 않은 동안 이 서비스가
        그 칸을 잠근다: 그 칸을 출발·도착으로 하는 재고 이동·보충, 적치·피킹 등 작업 실행은 409 LOCATION_CLOSED. 실사가 MATCHED·ADJUSTED·REJECTED·CANCELLED
        로 끝나면 잠금이 저절로 풀린다(시간 만료 해제 없음 — IV-11). 모두 또는 전무: 칸이 위치 사본에 없으면 422 LOCATION_NOT_REGISTERED, 폐지(RETIRED)면 409 LOCATION_CLOSED,
        진행 중 재고 이동이 있으면 409 MOVE_IN_PROGRESS, 열린 실사에 있으면 409 COUNT_IN_PROGRESS. 계수는 작업자(다음 작업 받기 — mfc-capacity 가 `/internal/count-work`
        를 보고 줌), 차이면 첫 계수자와 다른 작업자가 재계수, 승인은 지금처럼 시작(계획한 사람)·계수자가 아닌 MFC_SUPERVISOR. 계획한 사람은 실사의 createdBy.
      operationId: createCountPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locationCodes]
              properties:
                locationCodes: { type: array, minItems: 1, maxItems: 200, items: { type: string } }
                reason: { type: string, maxLength: 200, description: '순환 실사·차이 조사 등' }
      responses:
        '201':
          description: 계획(OPEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: LOCATION_NOT_REGISTERED(위치 사본에 없는 칸)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/count-plans/{planId}:
    get:
      tags: [counts]
      summary: '[운영자] 실사 계획 조회 — 칸별 실사 상태 (0.34.0)'
      operationId: getCountPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/count-plans/{planId}/cancellation:
    post:
      tags: [counts]
      summary: '[센터 관리자] 실사 계획 취소 — 끝나지 않은 실사를 모두 취소, 잠금 해제 (0.34.0)'
      description: |
        MFC_SUPERVISOR. 끝나지 않은 계획 실사를 모두 CANCELLED(재고 변화 없음) → 그 칸들 잠금이 풀린다. 이미 끝난 실사(조정 포함)는 그대로. 이미 취소된 계획이면 지금 계획.
      operationId: cancelCountPlan
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: planId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 취소 뒤 계획
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountPlan' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/count-work:
    get:
      tags: [counts]
      summary: '[mfc-capacity→mfc-inventory] 작업자에게 줄 실사 (0.34.0, BR-52 R14)'
      description: |
        다음 작업 받기(CYCLE_COUNT, taskId = sessionId)의 후보. **계획 실사**(planId 있음) 중 계수 단계(COUNTING·RECOUNT_REQUIRED)이고 예외 보고가 없는 것만,
        기준 시각 오래된 순(0.35.0 — 예외가 모두 해결(`…/resumption`)되면 다시 들어온다). `excludedOperatorIds` = 이 실사를 셀 수 없는 사람(재계수면 첫 계수자 — 그 사람이 내면 409 SAME_COUNTER).
        누가 들고 있는지(배정)는 이 서비스가 모른다 — 한 실사를 두 작업자에게 동시에 주지 않는 것은 배정 쪽 몫(두 번째 제출은 재계수가 된다). 최대 500건.
      operationId: listCountWork
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sessionId, planId, state, locationCodes, excludedOperatorIds, baselineAt]
                      properties:
                        sessionId: { type: string }
                        planId: { type: string }
                        state: { type: string, enum: [COUNTING, RECOUNT_REQUIRED] }
                        locationCodes: { type: array, items: { type: string } }
                        excludedOperatorIds: { type: array, items: { type: string } }
                        baselineAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/lot-orders:
    get:
      tags: [lot-labels]
      summary: '[서비스→mfc-inventory] LOT 을 집품·인계한 주문 줄 (0.31.0, 품질 사고 R6)'
      description: |
        mfc-quality 가 품질 사고의 **고객 영향**(영향 LOT 이 나간 주문)을 센다. 예약 조각(reservation_part)의 lot 이 같고 집품(picked) 또는 인계(handed)가 있는 줄만 —
        예약만 잡히고 아직 집지 않은 줄은 빠진다(그 LOT 이 아직 선반에 있음). `handedQty > 0` = 고객에게 나감(라이더 인계), 아니면 아직 센터 안(집품·포장).
        lotIds 1~50(쉼표), 그 센터(mfcId) 예약만. 최대 1000줄(넘으면 `truncated: true`).
      operationId: listLotOrders
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: lotIds
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, maxLength: 40 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, truncated]
                properties:
                  truncated: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      required: [orderId, reservationId, lotId, sku, pickedQty, packedQty, handedQty]
                      properties:
                        orderId: { type: string }
                        reservationId: { type: string }
                        orderLineId: { type: [string, 'null'] }
                        lotId: { type: string }
                        sku: { type: string }
                        pickedQty: { type: integer }
                        packedQty: { type: integer }
                        handedQty: { type: integer }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/skus:
    get:
      tags: [skus]
      summary: '[서비스→mfc-inventory] SKU 투영 일괄 조회 (최대 100건, 0.15.0)'
      description: |
        현장 화면의 상품명·바코드 표시용(mfc-inbound 입고 작업 — 클라이언트 BR-53 R8). 조회 사본이다. 상품 정본은 product-service.
        투영이 없는 SKU 는 items 에서 빼고 missing 에 둔다.
      operationId: listSkuProjections
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, missing]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SkuProjection' } }
                  missing: { type: array, items: { type: string } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/skus/{sku}:
    get:
      tags: [skus]
      summary: '[서비스→mfc-inventory] SKU 투영 조회 (product-service 이벤트 사본)'
      description: 조회 사본이다. 상품 정본은 product-service.
      operationId: getSkuProjection
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProjection' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/work-activities:
    get:
      tags: [work-activities]
      summary: '[mfc-capacity→mfc-inventory] 작업자 한 명의 처리 내역(기간) — 요청 F-7 R3'
      description: |
        mfc-capacity 작업자 "오늘 업무 내역"(`GET /mfcs/{mfcId}/workers/{workerId}/activities`)이 모으는 이 서비스 몫. 내부 호출(토큰 없음, ADR-0026).
        이 서비스 원장에서 그 센터·그 운영자가 [from, to) 에 처리한 것: COUNT·RECOUNT(실사 계수 — first_counted_at·recounted_at).
        시각 순. 기간은 최대 48시간(넘으면 400), 최대 500건.
      operationId: listWorkActivities
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: operatorId, in: query, required: true, schema: { type: string, maxLength: 128 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WorkActivity' } }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    WorkActivity:
      type: object
      description: '처리 한 건(F-7 R3) — mfc-capacity 가 여러 서비스 것을 모은다(같은 모양)'
      required: [activityType, refId, at]
      properties:
        activityType: { type: string, description: '처리 종류 — 서비스마다 정한 값(경로 설명)' }
        refId: { type: string, description: 실행·실사·판정·이동 ID }
        taskId: { type: [string, 'null'], description: 작업 ID(있으면) }
        sku: { type: [string, 'null'], description: 한 SKU 일 때만 }
        qty: { type: [integer, 'null'], description: 처리 수량(SKU 단위 합) }
        result: { type: [string, 'null'], description: 'APPLIED·REJECTED·UNKNOWN_RESULT·CAPTURED·COMPLETED 등 그 원장의 상태' }
        at: { type: string, format: date-time }
    InventoryApplyStatus:
      type: string
      enum: [CAPTURED, SUBMITTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT]
    QualityState:
      type: string
      enum: [PENDING_INSPECTION, NORMAL, QUARANTINED, DISPOSAL_PENDING]
    WorkState:
      type: string
      enum: [UNSTOWED, STORED, PICKED, PACKED, CANCEL_RETURN_PENDING]
    ReservationPartState:
      type: string
      description: HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED, CONFIRMED→CONSUMED/RELEASED/BLOCKED
      enum: [HELD, CONFIRMED, RELEASED, EXPIRED, BLOCKED, CONSUMED]
    SkuQtyLine:
      type: object
      required: [sku, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
    LotConstraint:
      type: object
      description: 예약 시 LOT 제약 (선택, 아직 미지원 — 400). 미지정이면 FEFO.
      properties:
        minShelfLifeDays: { type: integer, minimum: 0 }
        lotId: { type: string }
    ReserveInventoryRequest:
      type: object
      required: [orderId, mfcId, lines]
      properties:
        orderId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        ttlMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: '예약 유효 시간(분). 없으면 설정 pmart.inventory.default-hold-ttl(MFC 문서 §6 Q-04 결정 2026-11-07: 10분, ADR-0042), 설정도 없으면 CONFIG_REQUIRED'
        promisedDate:
          type: string
          format: date
          description: |
            배송 약속일(예약 배송 슬롯의 날짜, Asia/Seoul). 소비기한 적격 기준일 — 소비기한 − 약속일 ≥ 최소 잔여일인 LOT 만 배정한다
            (MFC 문서 §6 Q-05 결정 2026-11-07, ADR-0040). 없으면 예약 시각의 날짜(즉시 배송).
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              lotConstraint: { $ref: '#/components/schemas/LotConstraint' }
    Reservation:
      type: object
      properties:
        reservationId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        state: { $ref: '#/components/schemas/ReservationPartState' }
        expiresAt: { type: [string, 'null'], format: date-time }
        parts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              orderLineId: { type: [string, 'null'] }
              sku: { type: string }
              lotId: { type: string, description: inventory lotId. 한 줄이 여러 LOT 조각으로 나뉠 수 있다(줄당 LOT 수 제한 없음, FEFO) }
              kind: { type: string, enum: [HAND, FUTURE] }
              qty: { type: integer }
              state: { $ref: '#/components/schemas/ReservationPartState' }
              blockedReason: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ShortageReportRequest:
      type: object
      required: [reportId, mfcId, reservationId, orderLineId, sku, lotId, locationCode, qty, reason]
      properties:
        reportId: { type: string, maxLength: 128, description: 보고 ID(fulfillment 실행 ID 기반). 한 번만 반영 }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        reservationId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lotId: { type: string, description: 결품·파손을 발견한 예약 LOT }
        locationCode: { type: string, description: 발견한 선반 위치 }
        qty: { type: integer, minimum: 1 }
        reason: { type: string, enum: [SHORT, DAMAGED, SPOILED, BLOCKED], description: '(0.32.0) SPOILED 변질 — DAMAGED 와 같이 격리' }
        taskId: { type: string }
        note: { type: string, maxLength: 200 }
    ShortageReportResult:
      type: object
      properties:
        reportId: { type: string }
        commitId: { type: string }
        reportedQty: { type: integer }
        quarantinedQty: { type: integer, description: DAMAGED 로 격리한 양 }
        heldQty: { type: integer, description: 분실 조사 보류한 양(SHORT·BLOCKED) }
        resecuredQty: { type: integer, description: 같은 SKU 적격 LOT 으로 다시 잡은 양 }
        blockedQty: { type: integer, description: 못 잡아 BLOCKED(이행부족 D)로 남은 양 }
        resecuredParts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              lotId: { type: string }
              qty: { type: integer }
    StockExceptionResult:
      type: object
      description: (0.35.0) 이동·적치 현장 예외 반영 결과
      properties:
        reportId: { type: string }
        commitId: { type: string }
        reason: { type: string }
        reportedQty: { type: integer }
        quarantinedQty: { type: integer, description: DAMAGED·SPOILED 로 격리한 양 }
        heldQty: { type: integer, description: SHORT·BLOCKED 로 분실 조사 보류한 양 }
        blockedQty: { type: integer, description: 'stock-exceptions 만 — E 감소로 다른 LOT 재확보도 못 해 BLOCKED 로 남은 예약 양' }
        locationCode: { type: string, description: 보류·격리가 걸린 칸 }
        move: { $ref: '#/components/schemas/MoveAllocation' }
    MoveAllocation:
      type: object
      properties:
        moveId: { type: string }
        kind: { type: string, enum: [MOVE, REPLENISH], description: 'MOVE = 센터 관리자 재배치, REPLENISH = 시스템 자동 보충(0.14.0)' }
        mfcId: { type: string }
        sku: { type: string }
        lotId: { type: string }
        fromLocation: { type: string }
        toLocation: { type: string }
        cartLocation: { type: [string, 'null'] }
        qty: { type: integer, description: 배정 수량(취소하면 집은 양으로 줄어든다) }
        pickedQty: { type: integer }
        droppedQty: { type: integer }
        onCartQty: { type: integer, description: 카트 위 = 집음 − 내려놓음 }
        state: { type: string, enum: [ACTIVE, CANCEL_PENDING, COMPLETED, CANCELLED] }
        sizeClass: { type: [string, 'null'], description: '용량 계산에 쓴 상품 크기 — 더미 S·M·L, 또는 상품 실물 치수(0.18.0) MEASURED·ESTIMATED·PRODUCT(출처 모름)' }
        destinationCapacity: { type: [integer, 'null'], description: 도착 칸에 이 상품이 들어가는 개수(sizeClass 크기 기준) }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReplenishmentPolicy:
      type: object
      properties:
        mfcId: { type: string }
        locationCode: { type: string }
        sku: { type: string }
        minQty: { type: integer }
        targetQty: { type: integer }
        unitQty: { type: integer }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    PickPlan:
      type: object
      properties:
        reservationId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
