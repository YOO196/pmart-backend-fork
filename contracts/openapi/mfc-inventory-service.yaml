      summary: '[운영자] 센터 재고 상세 여러 SKU 한 번에 (0.33.0, 시뮬레이터 R-16)'
      description: |
        `GET /mfcs/{mfcId}/stock?sku=` 를 SKU 여러 개로 — `sku` 반복 1~100(넘으면 400, 같은 값은 한 번). 항목은 요청 순서대로 `CenterStock` 하나씩,
        재고가 없거나 모르는 SKU 도 빈 `lots`·`units` 로 준다. 권한은 `/stock` 과 같다(그 센터 운영자, 역할 무관). 읽기만.
        단건 `/stock` 의 응답 모양은 바꾸지 않는다(생성 클라이언트가 단건 객체로 쓴다).
      operationId: getCenterStocks
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
