    LotLabel:
      type: object
      description: '(0.20.0) LOT 라벨 인쇄 정보. (0.21.0) 바코드는 GS1-128 gs1 — labelValue(QR)는 예전 라벨 해석용'
      required: [labelValue, lotId, lotNo, sku, tracking, barcodes, onHand]
      properties:
        labelValue: { type: string, description: 'LOT:{lotId} — 예전 QR 값(0.20.0). 재출력해도 같다' }
        lotId: { type: string }
        lotNo: { type: string, maxLength: 20, description: '(0.21.0) LOT 번호 — GS1 (10) 값. 전체 유일, 바뀌지 않는다' }
        gs1: { type: [string, 'null'], description: '(0.21.0) GS1-128 괄호 꼴 (01)GTIN-14(17)YYMMDD(10)lotNo — 기한 없으면 (17) 생략. 상품 바코드(숫자 8·12·13·14자리)가 없으면 null(GS1 라벨 불가)' }
        sku: { type: string }
        productName: { type: [string, 'null'], description: SKU 사본(모르면 null) }
        barcodes: { type: array, items: { type: string }, description: 상품 바코드(880·299…) — 라벨 대신 쓰지 않는다, 표시용 }
        unitType: { type: [string, 'null'], description: 'E 낱개 / B 박스(밀봉 묶음) — 라벨 1장 = 이 SKU 1단위. 모르면 null' }
        unitsPerSku: { type: [integer, 'null'], description: 박스 SKU 입수(낱개 수) }
        tracking: { type: string, enum: [TRACKED, UNTRACKED], description: 'UNTRACKED = 소비기한·LOT 원문 없음(선입선출 근거 아님)' }
        sourceLotRef: { type: [string, 'null'], description: 제조사 LOT 원문 }
        expiryDate: { type: [string, 'null'], format: date, description: 소비기한 }
        manufactureDate: { type: [string, 'null'], format: date }
        receivedAt: { type: [string, 'null'], format: date-time, description: '납입일 — 이 센터 최초 정상 인수 시각(검수 전이면 null)' }
        onHand: { type: integer, description: 이 센터 보유(H) }
        qtyAtLocation: { type: [integer, 'null'], description: 'locationCode 로 찾았을 때 그 위치의 수량' }
    CenterStock:
      type: object
      required: [mfcId, sku, lots, units]
      properties:
        mfcId: { type: string }
        sku: { type: string }
        productName: { type: [string, 'null'], description: '(0.23.0, IV-2 — PDA 재고 확인) 상품 관리용 명칭(SKU 사본). 모르면 null' }
        barcodes: { type: array, items: { type: string }, description: '(0.23.0) 활성 상품 바코드(선행 0 보존). 모르면 빈 배열' }
        lots:
          type: array
          items:
            type: object
            properties:
              lotId: { type: string }
              lotNo: { type: string, description: '(0.21.0) LOT 번호 — GS1 (10)' }
              tracking: { type: string, enum: [TRACKED, UNTRACKED] }
              expiryDate: { type: [string, 'null'], format: date }
              manufactureDate: { type: [string, 'null'], format: date, description: 제조일(0.4.0). 모르면 null }
              onHand: { type: integer }
              quarantined: { type: integer }
              sellable: { type: integer }
              reserved: { type: integer }
              available: { type: integer }
        units:
          type: array
          items:
            type: object
            properties:
              locationCode: { type: string }
              lotId: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
              workState: { $ref: '#/components/schemas/WorkState' }
              qty: { type: integer }
    SkuHandling:
      type: object
      required: [sku, handlingEnabled, version]
      properties:
        sku: { type: string }
        handlingEnabled: { type: boolean, description: 레코드가 없으면 false }
        version: { type: integer, description: 취급 레코드 version (레코드 없음 = 0) }
        skuState: { type: string, enum: [ACTIVE, INACTIVE] }
        productId: { type: [string, 'null'] }
        changedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
        saleState: { type: [string, 'null'], enum: [ON_SALE, TEMP_OUT, DISCONTINUED, null], description: '(0.27.0) 본사 판매 상태 사본(모르면 null)', x-added-in: '2026-11-19' }
        offReason: { type: [string, 'null'], enum: [CENTER, DISCONTINUED, null], description: '(0.27.0) OFF 인 까닭 — DISCONTINUED = 본사 단종(켜기 막힘), CENTER = 센터가 끔, 정한 적 없으면 null', x-added-in: '2026-11-19' }
        introducedAt: { type: [string, 'null'], format: date-time, description: '(0.27.0) 상품이 생긴 시각(SkuIssued) — 예전 상품은 null', x-added-in: '2026-11-19' }
    SkuHandlingPage:
      type: object
      properties:
        centerId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
        totalCount: { type: integer, description: '(0.27.0) 거르기에 맞는 전체 건수(쪽과 무관 — 배너 숫자)', x-added-in: '2026-11-19' }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    SkuHandlingChange:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
    SkuHandlingResult:
      type: object
      required: [status, requestId, occurredAt, handling]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changed: { type: boolean, description: false 면 이미 같은 값이라 바뀐 것이 없음 }
        occurredAt: { type: string, format: date-time }
        handling: { $ref: '#/components/schemas/SkuHandling' }
    SkuHandlingBatchRequest:
      type: object
      required: [items]
      properties:
        reason: { type: string, maxLength: 500, description: 행에 reason 이 없을 때 쓰는 공통 사유 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SkuHandlingBatchItem' }
    SkuHandlingBatchItem:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 0, description: 행별 낙관적 잠금(선택) }
    SkuHandlingBatchResult:
      type: object
      required: [status, requestId, occurredAt, items]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changedCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
    SkuProjection:
      type: object
      required: [sku, state, productVersion]
      properties:
        sku: { type: string }
        productId: { type: [string, 'null'] }
        baseProductId: { type: [string, 'null'] }
        unitType: { type: [string, 'null'] }
        unitsPerSku: { type: [integer, 'null'] }
        weightG: { type: [integer, 'null'] }
        volumeMl: { type: [integer, 'null'] }
        storageType: { type: [string, 'null'], description: AMBIENT / CHILLED / FROZEN }
        alcohol: { type: [boolean, 'null'] }
        shelfMinRemainingDays: { type: [integer, 'null'], description: '상품별 소비기한 보장 — 주문일 기준 최소 잔여일(ADR-0041). null 이면 보장 문구 없음(보관 유형 기본값을 쓴다)' }
        shelfMaxDaysSinceManufacture: { type: [integer, 'null'], description: '상품별 소비기한 보장 — 주문일 기준 제조 후 최대 경과일(ADR-0041). null 이면 보장 없음' }
        minRemainingDays: { type: [integer, 'null'], description: '(0.25.0, mfc-app BR-52 R18) 실제로 적용하는 최소 잔여일 — shelfMinRemainingDays, 없으면 보관 유형 기본값. 둘 다 없으면 null(예약은 CONFIG_REQUIRED). 예약·출하 가능 판정과 같다' }
        productName: { type: [string, 'null'], description: '(0.15.0) 상품 관리용 명칭(ProductVersionPublished.internalName). 이 필드 추가 전에 받은 상품은 다음 상품 버전 발행까지 null' }
        barcodes: { type: array, items: { type: string }, description: '(0.15.0) 활성 바코드(선행 0 보존). 모르면 빈 배열' }
        widthMm: { type: [integer, 'null'], description: '(0.18.0, 2026-11-16) 상품 실물 치수 가로(mm, ProductVersionPublished.skus[].dimensions). 셋 다 있으면 적치·이동·보충 칸 용량을 이 치수로 계산하고, 없으면 더미 크기(pmart.inventory.dummy-sku-size) 또는 CONFIG_REQUIRED' }
        depthMm: { type: [integer, 'null'], description: '(0.18.0) 상품 실물 치수 세로(mm). 모르면 null' }
        heightMm: { type: [integer, 'null'], description: '(0.18.0) 상품 실물 치수 높이(mm). 모르면 null' }
        dimensionsSource: { type: [string, 'null'], description: '(0.18.0) 치수 출처 MEASURED(실측) / ESTIMATED(추정). 모르면 null' }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        productVersion: { type: integer, description: 마지막으로 반영한 상품 버전(이보다 오래된 이벤트는 무시) }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
