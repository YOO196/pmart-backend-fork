        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [sku, lotId, fromLocation, qualityState, workState, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              fromLocation: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
